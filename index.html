<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Viewer | Samisaki Shoes</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e8e4df;
            font-family: 'Vazirmatn', sans-serif;
        }
        canvas { display: block; }
        .ui-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 10;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(15px);
            padding: 14px 24px;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.active { border-color: #333; box-shadow: 0 0 0 3px rgba(0,0,0,0.1); }
        .hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,0,0,0.6);
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="hint">🖱️ بچرخانید | اسکرول زوم | دکمه‌ها = تغییر رنگ</div>
    <div class="ui-panel" id="colorPanel">
        <button class="color-btn active" data-color="#2a2a2a" style="background:#2a2a2a;"></button>
        <button class="color-btn" data-color="#cc3333" style="background:#cc3333;"></button>
        <button class="color-btn" data-color="#3355aa" style="background:#3355aa;"></button>
        <button class="color-btn" data-color="#dddddd" style="background:#dddddd;"></button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== صحنه، دوربین، رندرر ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0dcd5);
        scene.fog = new THREE.Fog(0xe0dcd5, 6, 15);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
        camera.position.set(2.5, 1.6, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.3, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.minDistance = 1.8;
        controls.maxDistance = 6;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.update();

        // ==================== نورپردازی Three-Point Lighting ====================
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);

        const keyLight = new THREE.DirectionalLight(0xfff5f0, 7.5);
        keyLight.position.set(-3, 4, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 20;
        keyLight.shadow.camera.left = -3;
        keyLight.shadow.camera.right = 3;
        keyLight.shadow.camera.top = 3;
        keyLight.shadow.camera.bottom = -3;
        keyLight.shadow.bias = -0.0001;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 3.0);
        fillLight.position.set(3, 1.5, 1.5);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 5.5);
        rimLight.position.set(0, 1.5, -3);
        scene.add(rimLight);

        // ==================== پایه (پد استال) ====================
        const pedestal = new THREE.Mesh(
            new THREE.CylinderGeometry(0.7, 0.75, 0.04, 64),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25, metalness: 0.15 })
        );
        pedestal.position.y = -0.04;
        pedestal.receiveShadow = true;
        pedestal.castShadow = true;
        scene.add(pedestal);

        // ==================== بافت‌ها ====================
        function createFabricTexture(baseColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 800; i++) {
                ctx.fillStyle = `rgba(${Math.random()>0.5?255:0},${Math.random()>0.5?255:0},${Math.random()>0.5?255:0},0.03)`;
                ctx.fillRect(Math.random()*256, Math.random()*256, 1, 1);
            }
            return new THREE.CanvasTexture(canvas);
        }

        // ==================== گروه کفش ====================
        const shoeGroup = new THREE.Group();
        scene.add(shoeGroup);

        // --- متریال‌های قابل تغییر ---
        const materials = {
            upper: new THREE.MeshStandardMaterial({ roughness: 0.65, metalness: 0.05 }),
            sole: new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.45, metalness: 0.1 }),
            accent: new THREE.MeshStandardMaterial({ color: 0xff5533, roughness: 0.3, metalness: 0.25 }),
            lace: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 }),
            inner: new THREE.MeshStandardMaterial({ color: 0xffddcc, roughness: 0.75 }),
        };

        // --- تابع ساخت کفش ---
        function buildShoe(colorHex) {
            // حذف قطعات قبلی
            while(shoeGroup.children.length > 0) {
                shoeGroup.remove(shoeGroup.children[0]);
            }

            const upperTex = createFabricTexture(colorHex);
            materials.upper.map = upperTex;
            materials.upper.color.set(colorHex);

            // زیره
            const sole = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.08, 1.5), materials.sole);
            sole.position.set(0, 0.02, 0.1);
            sole.castShadow = true; sole.receiveShadow = true;
            shoeGroup.add(sole);

            const heelSole = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.35), materials.sole);
            heelSole.position.set(0, 0.04, -0.45);
            heelSole.castShadow = true; heelSole.receiveShadow = true;
            shoeGroup.add(heelSole);

            // رویه
            const toeBox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.65), materials.upper);
            toeBox.position.set(0, 0.25, 0.55);
            toeBox.castShadow = true; toeBox.receiveShadow = true;
            shoeGroup.add(toeBox);

            const midSection = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.35, 0.5), materials.upper);
            midSection.position.set(0, 0.3, 0.1);
            midSection.castShadow = true; midSection.receiveShadow = true;
            shoeGroup.add(midSection);

            const heelCounter = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.35, 0.35), materials.upper);
            heelCounter.position.set(0, 0.3, -0.45);
            heelCounter.castShadow = true; heelCounter.receiveShadow = true;
            shoeGroup.add(heelCounter);

            // زبانه
            const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.15), materials.upper);
            tongue.position.set(0, 0.55, 0.2);
            tongue.rotation.x = -0.3;
            tongue.castShadow = true; tongue.receiveShadow = true;
            shoeGroup.add(tongue);

            // یقه
            const collar = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.06, 8, 16), materials.upper);
            collar.position.set(0, 0.55, -0.35);
            collar.rotation.x = Math.PI / 2;
            collar.castShadow = true; collar.receiveShadow = true;
            shoeGroup.add(collar);

            // بندها
            for (let i = 0; i < 4; i++) {
                const lace = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.35, 6), materials.lace);
                lace.position.set(0, 0.45 + i * 0.08, 0.25);
                lace.rotation.z = Math.PI / 2;
                lace.castShadow = true;
                shoeGroup.add(lace);
            }

            // خط تزئینی
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.03, 1.3), materials.accent);
            stripe.position.set(0, 0.07, 0.1);
            stripe.castShadow = true;
            shoeGroup.add(stripe);

            // لوگوی منحنی
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-0.2, 0.15, 0.6),
                new THREE.Vector3(-0.05, 0.28, 0.3),
                new THREE.Vector3(0.15, 0.35, -0.1),
                new THREE.Vector3(0.1, 0.25, -0.5)
            ]);
            const tube = new THREE.Mesh(
                new THREE.TubeGeometry(curve, 32, 0.025, 8, false),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.1 })
            );
            tube.castShadow = true;
            shoeGroup.add(tube);

            // کفی داخلی
            const insole = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.03, 0.9), materials.inner);
            insole.position.set(0, 0.42, 0.15);
            insole.castShadow = true; insole.receiveShadow = true;
            shoeGroup.add(insole);

            shoeGroup.rotation.y = -0.2;
        }

        // --- ساخت اولیه ---
        buildShoe('#2a2a2a');

        // --- کنترل رنگ ---
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const color = btn.dataset.color;
                buildShoe(color);
            });
        });

        // ==================== انیمیشن ====================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
