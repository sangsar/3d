<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقل‌قول‌نما | گنجینهٔ سخنان بزرگان</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #faf9f6;
      --text: #2c3e50;
      --card-bg: #ffffff;
      --primary: #d4a373;
      --secondary: #6b705c;
      --shadow: 0 4px 20px rgba(0,0,0,0.05);
      --header-bg: rgba(255, 251, 245, 0.9);
      --tag-bg: #f0e9df;
      --favorite-icon: #e76f51;
    }

    body.dark {
      --bg: #2c3e50;
      --text: #ecf0f1;
      --card-bg: #34495e;
      --primary: #d4a373;
      --secondary: #bdc3c7;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --header-bg: rgba(44, 62, 80, 0.9);
      --tag-bg: #3b4b5c;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--header-bg);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 2em;
      font-weight: 900;
      color: var(--primary);
      cursor: pointer;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .search-container {
      display: flex;
      background: var(--card-bg);
      border-radius: 30px;
      padding: 3px 3px 3px 15px;
      box-shadow: var(--shadow);
    }

    .search-container input {
      border: none;
      background: transparent;
      padding: 10px;
      font-family: inherit;
      font-size: 0.95em;
      width: 180px;
      color: var(--text);
      outline: none;
    }

    .search-container button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9em;
    }

    .toggle-theme {
      background: none;
      border: 1px solid var(--text);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3em;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .favorites-btn {
      background: var(--card-bg);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9em;
      white-space: nowrap;
    }

    main {
      flex: 1;
      padding: 30px 20px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.8em;
      margin-bottom: 25px;
      border-right: 5px solid var(--primary);
      padding-right: 15px;
    }

    .quote-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .quote-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px 30px;
      box-shadow: var(--shadow);
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      border-right: 5px solid var(--primary);
    }

    .quote-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .quote-text {
      font-size: 1.3em;
      line-height: 1.8;
      margin-bottom: 15px;
      font-style: italic;
    }

    .quote-author {
      font-weight: 600;
      color: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .quote-tags {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .tag {
      background: var(--tag-bg);
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.8em;
      cursor: pointer;
      transition: background 0.2s;
      color: var(--text);
    }

    .tag:hover {
      background: var(--primary);
      color: white;
    }

    .fav-icon {
      background: none;
      border: none;
      font-size: 1.5em;
      cursor: pointer;
      transition: transform 0.2s;
      color: var(--favorite-icon);
      line-height: 1;
      margin-right: 10px;
    }

    .fav-icon:hover {
      transform: scale(1.3);
    }

    .load-more {
      text-align: center;
      margin: 30px 0;
    }

    .load-more button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 1.1em;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .load-more button:hover {
      opacity: 0.9;
    }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: var(--card-bg);
      color: #888;
      font-size: 0.9em;
      margin-top: auto;
    }

    footer a {
      color: var(--primary);
    }

    @media (max-width: 600px) {
      .quote-text {
        font-size: 1.1em;
      }
      header {
        flex-direction: column;
        gap: 12px;
      }
      .search-container input {
        width: 120px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="showRandomQuotes()">✨ نقل‌قول‌نما</div>
    <div class="nav-actions">
      <div class="search-container">
        <input type="text" id="author-search" placeholder="جستجوی نویسنده..." />
        <button onclick="searchByAuthor()">🔍</button>
      </div>
      <button class="favorites-btn" onclick="showFavorites()">❤️ علاقه‌مندی‌ها</button>
      <button class="toggle-theme" onclick="toggleTheme()" title="تغییر حالت">🌓</button>
    </div>
  </header>

  <main>
    <div id="tags-filter" style="margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap;">
      <!-- تگ‌های پیشنهادی اینجا پر می‌شوند -->
    </div>

    <div id="quotes-container" class="quote-grid">
      <!-- نقل‌قول‌ها اینجا رندر می‌شوند -->
    </div>

    <div class="load-more" id="load-more-container" style="display: none;">
      <button onclick="loadMore()">بارگذاری بیشتر</button>
    </div>
  </main>

  <footer>
    داده‌ها از <a href="https://github.com/lukePeavey/quotable" target="_blank">Quotable API</a> (رایگان و بدون نیاز به کلید)
    <br>ساخته شده با ❤️ برای نمایش قدرت یک سایت گسترده بدون محتوای دستی
  </footer>

  <script>
    // ====================== حالت‌های مختلف ======================
    const STATE = {
      currentPage: 1,
      currentMode: 'random', // random | author | tag | favorites
      currentQuery: null,    // برای author یا tag
      favorites: JSON.parse(localStorage.getItem('quotes_favorites') || '[]'),
      currentQuotes: []
    };

    // ====================== المان‌ها ======================
    const quotesContainer = document.getElementById('quotes-container');
    const loadMoreContainer = document.getElementById('load-more-container');
    const tagsFilterDiv = document.getElementById('tags-filter');
    const authorSearch = document.getElementById('author-search');

    // تگ‌های پرطرفدار
    const popularTags = ['عشق', 'زندگی', 'موفقیت', 'علم', 'فلسفه', 'شجاعت', 'دوستی', 'آینده', 'انسانیت', 'خلاقیت'];

    // ====================== مدیریت تم ======================
    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('theme', theme);
    }
    function toggleTheme() {
      const newTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(newTheme);
    }
    applyTheme(localStorage.getItem('theme') || 'light');

    // ====================== توابع API ======================
    async function fetchRandomQuotes(page = 1, limit = 20) {
      const res = await fetch(`https://api.quotable.io/quotes/random?limit=${limit}&page=${page}`);
      if (!res.ok) throw new Error('خطا در دریافت داده');
      return res.json();
    }

    async function fetchQuotesByAuthor(author, page = 1, limit = 20) {
      const res = await fetch(`https://api.quotable.io/quotes?author=${encodeURIComponent(author)}&page=${page}&limit=${limit}`);
      if (!res.ok) throw new Error('نویسنده پیدا نشد');
      return res.json();
    }

    async function fetchQuotesByTag(tag, page = 1, limit = 20) {
      const res = await fetch(`https://api.quotable.io/quotes?tags=${encodeURIComponent(tag)}&page=${page}&limit=${limit}`);
      if (!res.ok) throw new Error('تگ یافت نشد');
      return res.json();
    }

    // ====================== رندر نقل‌قول‌ها ======================
    function renderQuotes(quotes, append = false) {
      if (!append) {
        quotesContainer.innerHTML = '';
        STATE.currentQuotes = [];
      }
      if (quotes.length === 0) {
        if (!append) quotesContainer.innerHTML = '<div class="empty-message">هیچ نقل‌قولی یافت نشد.</div>';
        loadMoreContainer.style.display = 'none';
        return;
      }
      STATE.currentQuotes = append ? [...STATE.currentQuotes, ...quotes] : quotes;
      quotes.forEach(quote => {
        const card = document.createElement('div');
        card.className = 'quote-card';
        const isFav = STATE.favorites.includes(quote._id);
        card.innerHTML = `
          <div class="quote-text">“${quote.content}”</div>
          <div class="quote-author">
            <span>— ${quote.author}</span>
            <button class="fav-icon" data-id="${quote._id}">${isFav ? '❤️' : '🤍'}</button>
          </div>
          <div class="quote-tags">
            ${quote.tags.map(tag => `<span class="tag" data-tag="${tag}">#${tag}</span>`).join('')}
          </div>
        `;
        quotesContainer.appendChild(card);
      });

      // مدیریت دکمهٔ علاقه‌مندی
      document.querySelectorAll('.fav-icon').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(btn.dataset.id);
        });
      });

      // کلیک روی تگ
      document.querySelectorAll('.tag').forEach(tagEl => {
        tagEl.addEventListener('click', () => {
          const tag = tagEl.dataset.tag;
          filterByTag(tag);
        });
      });

      loadMoreContainer.style.display = quotes.length >= 20 ? 'block' : 'none';
    }

    // ====================== علاقه‌مندی‌ها ======================
    function toggleFavorite(quoteId) {
      const index = STATE.favorites.indexOf(quoteId);
      if (index > -1) {
        STATE.favorites.splice(index, 1);
      } else {
        STATE.favorites.push(quoteId);
      }
      localStorage.setItem('quotes_favorites', JSON.stringify(STATE.favorites));
      // رفرش لیست فعلی برای آپدیت آیکون‌ها
      refreshCurrentView();
    }

    function showFavorites() {
      STATE.currentMode = 'favorites';
      STATE.currentPage = 1;
      loadMoreContainer.style.display = 'none';
      if (STATE.favorites.length === 0) {
        quotesContainer.innerHTML = '<div class="empty-message">هنوز نقل‌قولی به علاقه‌مندی‌ها اضافه نکرده‌اید.</div>';
        return;
      }
      // باید تک‌تک نقل‌قول‌ها را با id دریافت کنیم
      Promise.all(STATE.favorites.map(id => fetch(`https://api.quotable.io/quotes/${id}`).then(res => res.json())))
        .then(quotes => {
          renderQuotes(quotes, false);
          loadMoreContainer.style.display = 'none';
        })
        .catch(() => quotesContainer.innerHTML = '<div class="empty-message">خطا در بارگذاری علاقه‌مندی‌ها.</div>');
    }

    function refreshCurrentView() {
      switch (STATE.currentMode) {
        case 'random': showRandomQuotes(false); break;
        case 'author': searchByAuthor(false); break;
        case 'tag': filterByTag(STATE.currentQuery, false); break;
        case 'favorites': showFavorites(); break;
        default: showRandomQuotes(false);
      }
    }

    // ====================== بارگذاری اصلی ======================
    async function showRandomQuotes(reset = true) {
      if (reset) {
        STATE.currentMode = 'random';
        STATE.currentPage = 1;
        STATE.currentQuery = null;
        authorSearch.value = '';
        history.pushState(null, '', window.location.pathname); // پاک کردن هش
      }
      try {
        const data = await fetchRandomQuotes(STATE.currentPage);
        renderQuotes(data, !reset);
      } catch (e) {
        quotesContainer.innerHTML = '<div class="empty-message">خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.</div>';
      }
    }

    async function searchByAuthor(reset = true) {
      const author = authorSearch.value.trim();
      if (!author) return;
      if (reset) {
        STATE.currentMode = 'author';
        STATE.currentPage = 1;
        STATE.currentQuery = author;
      }
      try {
        const data = await fetchQuotesByAuthor(author, STATE.currentPage);
        renderQuotes(data.results, !reset);
        if (data.results.length === 0 && reset) {
          quotesContainer.innerHTML = '<div class="empty-message">نویسنده‌ای با این نام پیدا نشد.</div>';
        }
      } catch (e) {
        quotesContainer.innerHTML = '<div class="empty-message">نویسنده پیدا نشد.</div>';
      }
    }

    async function filterByTag(tag, reset = true) {
      if (reset) {
        STATE.currentMode = 'tag';
        STATE.currentPage = 1;
        STATE.currentQuery = tag;
      }
      try {
        const data = await fetchQuotesByTag(tag, STATE.currentPage);
        renderQuotes(data.results, !reset);
        if (data.results.length === 0 && reset) {
          quotesContainer.innerHTML = '<div class="empty-message">نقل‌قولی با این تگ پیدا نشد.</div>';
        }
      } catch (e) {
        quotesContainer.innerHTML = '<div class="empty-message">خطا در فیلتر.</div>';
      }
    }

    // بارگذاری بیشتر
    function loadMore() {
      STATE.currentPage++;
      switch (STATE.currentMode) {
        case 'random': showRandomQuotes(false); break;
        case 'author': searchByAuthor(false); break;
        case 'tag': filterByTag(STATE.currentQuery, false); break;
        default: break;
      }
    }

    // ====================== رندر تگ‌های پیشنهادی ======================
    function renderPopularTags() {
      tagsFilterDiv.innerHTML = '';
      popularTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'tag';
        btn.textContent = `#${tag}`;
        btn.addEventListener('click', () => filterByTag(tag));
        tagsFilterDiv.appendChild(btn);
      });
      // دکمهٔ بازگشت به نقل‌قول‌های تصادفی
      const homeTag = document.createElement('button');
      homeTag.className = 'tag';
      homeTag.style.background = 'var(--primary)';
      homeTag.style.color = 'white';
      homeTag.textContent = '🏠 همه نقل‌قول‌ها';
      homeTag.addEventListener('click', () => showRandomQuotes());
      tagsFilterDiv.prepend(homeTag);
    }

    // ====================== راه‌اندازی ======================
    function init() {
      renderPopularTags();
      showRandomQuotes();
      // امکان جستجو با Enter
      authorSearch.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchByAuthor();
      });
    }
    init();
  </script>
</body>
</html>
