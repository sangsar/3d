<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موزه هنرهای کهکشانی | Samisaki Museum</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Vazirmatn', sans-serif; }
        canvas { display: block; }
        .info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(12px);
            color: #e0d6ff;
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="info">🖱️ با موس بچرخید | اسکرول برای زوم | موزه کهکشانی Samisaki</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== صحنه، دوربین، رندرر ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d14);
        scene.fog = new THREE.Fog(0x0d0d14, 10, 40);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.7, 8);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // ==================== کنترل‌ها ====================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.4, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2.5;
        controls.maxDistance = 14;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.update();

        // ==================== نورپردازی ====================
        // نور محیطی بسیار ملایم
        const ambient = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambient);

        // نور اصلی از نورگیر سقفی (شبیه‌سازی نور روز)
        const skyLight = new THREE.DirectionalLight(0xfff5e8, 6.0);
        skyLight.position.set(0, 8, 0);
        skyLight.castShadow = true;
        skyLight.shadow.mapSize.width = 2048;
        skyLight.shadow.mapSize.height = 2048;
        skyLight.shadow.camera.near = 0.5;
        skyLight.shadow.camera.far = 25;
        skyLight.shadow.camera.left = -8;
        skyLight.shadow.camera.right = 8;
        skyLight.shadow.camera.top = 8;
        skyLight.shadow.camera.bottom = -8;
        skyLight.shadow.bias = -0.0005;
        skyLight.shadow.normalBias = 0.02;
        scene.add(skyLight);

        // نورهای نقطه‌ای گرم روی تابلوها (حس گالری)
        const spotLight1 = new THREE.SpotLight(0xffeedd, 15, 12, Math.PI / 6, 0.3, 1);
        spotLight1.position.set(-2.5, 2.6, -3.2);
        spotLight1.target.position.set(-2.5, 1.8, -4.3);
        spotLight1.castShadow = true;
        spotLight1.shadow.mapSize.width = 512;
        spotLight1.shadow.mapSize.height = 512;
        scene.add(spotLight1);
        scene.add(spotLight1.target);

        const spotLight2 = new THREE.SpotLight(0xffeedd, 15, 12, Math.PI / 6, 0.3, 1);
        spotLight2.position.set(2.5, 2.6, -3.2);
        spotLight2.target.position.set(2.5, 1.8, -4.3);
        spotLight2.castShadow = true;
        spotLight2.shadow.mapSize.width = 512;
        spotLight2.shadow.mapSize.height = 512;
        scene.add(spotLight2);
        scene.add(spotLight2.target);

        const spotLight3 = new THREE.SpotLight(0xffeedd, 12, 10, Math.PI / 6, 0.3, 1);
        spotLight3.position.set(0, 2.6, 3.2);
        spotLight3.target.position.set(0, 1.8, 4.3);
        spotLight3.castShadow = true;
        spotLight3.shadow.mapSize.width = 512;
        spotLight3.shadow.mapSize.height = 512;
        scene.add(spotLight3);
        scene.add(spotLight3.target);

        // ==================== متریال‌ها ====================
        // تولید بافت مرمر با Canvas برای کف
        const marbleCanvas = document.createElement('canvas');
        marbleCanvas.width = 512;
        marbleCanvas.height = 512;
        const mCtx = marbleCanvas.getContext('2d');
        mCtx.fillStyle = '#e8e4df';
        mCtx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 200; i++) {
            mCtx.beginPath();
            mCtx.strokeStyle = `rgba(${180 + Math.random() * 40}, ${175 + Math.random() * 40}, ${170 + Math.random() * 40}, 0.15)`;
            mCtx.lineWidth = Math.random() * 4 + 1;
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            mCtx.moveTo(x, y);
            mCtx.bezierCurveTo(x + Math.random() * 80 - 40, y + Math.random() * 80 - 40, x + Math.random() * 80 - 40, y + Math.random() * 80 - 40, x + Math.random() * 100 - 50, y + Math.random() * 100 - 50);
            mCtx.stroke();
        }
        const marbleTexture = new THREE.CanvasTexture(marbleCanvas);
        marbleTexture.wrapS = THREE.RepeatWrapping;
        marbleTexture.wrapT = THREE.RepeatWrapping;
        marbleTexture.repeat.set(4, 4);

        const floorMat = new THREE.MeshStandardMaterial({
            map: marbleTexture,
            roughness: 0.25,
            metalness: 0.1,
            color: 0xffffff
        });

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8e2d8, roughness: 0.85, metalness: 0.0 });
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.9, metalness: 0.0 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.5, metalness: 0.1 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.2, metalness: 0.9 });
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.25, envMapIntensity: 0.5 });
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.8 });
        const benchMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.55, metalness: 0.05 });
        const plantMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.7 });
        const potMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.6 });

        // ==================== تابع‌های کمکی ====================
        function createBox(w, h, d, mat, x, y, z, cast = true, receive = true) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = cast;
            mesh.receiveShadow = receive;
            return mesh;
        }

        // ==================== ساختمان موزه ====================
        // کف
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // دیوارهای بیرونی
        scene.add(createBox(16, 4.5, 0.35, wallMat, 0, 2.25, -8));
        scene.add(createBox(0.35, 4.5, 16, wallMat, -8, 2.25, 0));
        scene.add(createBox(0.35, 4.5, 16, wallMat, 8, 2.25, 0));
        scene.add(createBox(16, 4.5, 0.35, wallMat, 0, 2.25, 8));
        // سقف
        scene.add(createBox(16, 0.15, 16, ceilingMat, 0, 4.4, 0));

        // --- نورگیر سقفی (اسکای‌لایت) ---
        const skylightFrame = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 3.5), metalMat);
        skylightFrame.position.set(0, 4.5, 0);
        skylightFrame.castShadow = true;
        scene.add(skylightFrame);
        const skylightGlass = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2), glassMat);
        skylightGlass.rotation.x = -Math.PI / 2;
        skylightGlass.position.set(0, 4.55, 0);
        scene.add(skylightGlass);

        // --- ستون‌های داخلی (۴ عدد) ---
        const pillarPositions = [[-5, -5], [5, -5], [-5, 5], [5, 5]];
        pillarPositions.forEach(([px, pz]) => {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 4.5, 32), new THREE.MeshStandardMaterial({ color: 0xf0ebe0, roughness: 0.4, metalness: 0.2 }));
            pillar.position.set(px, 2.25, pz);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        });

        // --- دیوارهای داخلی برای ایجاد راهرو و فضاهای نمایش ---
        // دیوار پشتی سالن اصلی (با تابلو)
        scene.add(createBox(10, 3.8, 0.25, wallMat, 0, 2.1, -6));
        // دو دیوار جداکنندهٔ کوتاه برای تعریف فضا
        scene.add(createBox(0.25, 3.5, 5, wallMat, -3.5, 1.95, -3.5));
        scene.add(createBox(0.25, 3.5, 5, wallMat, 3.5, 1.95, -3.5));

        // ==================== تابلوهای هنری ====================
        function createArtCanvas(width, height, paintFunction) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512 * (height / width);
            const ctx = canvas.getContext('2d');
            paintFunction(ctx, canvas.width, canvas.height);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // تابع نقاشی کهکشانی ۱
        function paintGalaxy1(ctx, w, h) {
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 600; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const r = Math.random() * 3 + 1;
                ctx.fillStyle = `rgba(${200 + Math.random() * 55}, ${150 + Math.random() * 100}, ${220 + Math.random() * 35}, ${Math.random() * 0.8 + 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            // بازوی کهکشانی
            for (let i = 0; i < 300; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 180;
                const x = w / 2 + Math.cos(angle) * dist;
                const y = h / 2 + Math.sin(angle) * dist * 0.4;
                ctx.fillStyle = `rgba(255, ${180 + Math.random() * 75}, ${200 + Math.random() * 55}, ${Math.random() * 0.6 + 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 4 + 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // تابع نقاشی کهکشانی ۲
        function paintGalaxy2(ctx, w, h) {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 400; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                ctx.fillStyle = `rgba(${100 + Math.random() * 100}, ${100 + Math.random() * 100}, ${200 + Math.random() * 55}, 0.8)`;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 2 + 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            for (let i = 0; i < 200; i++) {
                const x = w / 2 + (Math.random() - 0.5) * 200;
                const y = h / 2 + (Math.random() - 0.5) * 200;
                ctx.fillStyle = `rgba(255, ${150 + Math.random() * 105}, 255, 0.5)`;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 3 + 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // تابع نقاشی انتزاعی ۳
        function paintAbstract(ctx, w, h) {
            ctx.fillStyle = '#0d0d14';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 200; i++) {
                ctx.fillStyle = `rgba(${180 + Math.random() * 75}, ${130 + Math.random() * 100}, ${200 + Math.random() * 55}, 0.5)`;
                ctx.beginPath();
                const x = Math.random() * w;
                const y = Math.random() * h;
                ctx.arc(x, y, Math.random() * 15 + 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const textures = [
            createArtCanvas(3, 4, paintGalaxy1),
            createArtCanvas(3, 4, paintGalaxy2),
            createArtCanvas(3, 4, paintAbstract),
            createArtCanvas(3, 4, paintGalaxy1),
            createArtCanvas(3, 4, paintGalaxy2),
            createArtCanvas(3, 4, paintAbstract),
        ];

        function createPainting(texture, x, y, z, rotY = 0) {
            const group = new THREE.Group();
            // قاب
            const frame = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.65, 0.08), frameMat);
            frame.castShadow = true;
            frame.receiveShadow = true;
            group.add(frame);
            // بوم
            const canvas = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.45), new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6, metalness: 0.0 }));
            canvas.position.z = 0.05;
            group.add(canvas);
            group.position.set(x, y, z);
            group.rotation.y = rotY;
            scene.add(group);
            return group;
        }

        // تابلوها روی دیوار پشتی (دو عدد)
        createPainting(textures[0], -2.5, 2.2, -5.85, 0);
        createPainting(textures[1], 2.5, 2.2, -5.85, 0);
        // تابلوها روی دیوارهای کناری
        createPainting(textures[2], -7.85, 2.2, -2, Math.PI / 2);
        createPainting(textures[3], 7.85, 2.2, -2, -Math.PI / 2);
        // تابلو روی دیوار ورودی
        createPainting(textures[4], 0, 2.2, 7.85, Math.PI);
        // یک تابلوی اضافه روی دیوار پشتی نزدیک ستون
        createPainting(textures[5], -5.5, 2.2, -5.85, 0);

        // ==================== مبلمان موزه ====================
        // نیمکت‌ها
        function createBench(x, y, z, rotY = 0) {
            const group = new THREE.Group();
            const seat = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.5), benchMat);
            seat.position.y = 0.45;
            seat.castShadow = true; seat.receiveShadow = true;
            group.add(seat);
            for (let lx = -0.9; lx <= 0.9; lx += 0.6) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.45, 8), metalMat);
                leg.position.set(lx, 0.22, 0.18);
                leg.castShadow = true;
                group.add(leg);
                const leg2 = leg.clone();
                leg2.position.z = -0.18;
                group.add(leg2);
            }
            group.position.set(x, y, z);
            group.rotation.y = rotY;
            scene.add(group);
        }
        createBench(0, 0, 3.5, 0);
        createBench(-4, 0, -3.5, Math.PI / 4);
        createBench(4, 0, -3.5, -Math.PI / 4);

        // گلدان‌ها
        function createPlant(x, z) {
            const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.4, 16), potMat);
            pot.position.set(x, 0.25, z);
            pot.castShadow = true; pot.receiveShadow = true;
            scene.add(pot);
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), plantMat);
            leaves.position.set(x, 0.6, z);
            leaves.castShadow = true;
            scene.add(leaves);
        }
        createPlant(-6.5, -6.5);
        createPlant(6.5, -6.5);
        createPlant(-6.5, 6.5);
        createPlant(6.5, 6.5);

        // تابلوی راهنما در ورودی
        const signBase = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.5, 8), metalMat);
        signBase.position.set(0, 0.75, 6.5);
        signBase.castShadow = true;
        scene.add(signBase);
        const signBoard = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.05), woodMat);
        signBoard.position.set(0, 1.5, 6.5);
        signBoard.castShadow = true;
        scene.add(signBoard);
        // متن راهنما با Canvas
        const signCanvas = document.createElement('canvas');
        signCanvas.width = 256;
        signCanvas.height = 128;
        const sCtx = signCanvas.getContext('2d');
        sCtx.fillStyle = '#2a2018';
        sCtx.fillRect(0, 0, 256, 128);
        sCtx.fillStyle = '#d4af37';
        sCtx.font = 'bold 28px serif';
        sCtx.textAlign = 'center';
        sCtx.fillText('گالری کهکشان', 128, 55);
        sCtx.fillText('Samisaki Museum', 128, 95);
        const signTexture = new THREE.CanvasTexture(signCanvas);
        const signLabel = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.4), new THREE.MeshBasicMaterial({ map: signTexture }));
        signLabel.position.set(0, 1.5, 6.53);
        scene.add(signLabel);

        // ==================== انیمیشن ====================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // واکنش‌گرایی
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
