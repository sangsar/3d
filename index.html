<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقل‌قول‌سرا | نسخه نهایی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0f14; --surface: #151e24; --text: #cbd5e0;
      --primary: #f4a261; --secondary: #e76f51; --accent: #2a9d8f;
      --glass-bg: rgba(21, 30, 36, 0.75); --glass-border: rgba(255,255,255,0.07);
      --font: 'Vazirmatn', sans-serif; --danger: #e74c3c;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      transition: background 0.3s, color 0.3s; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    #particles {
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;
    }
    header {
      background: var(--glass-bg); backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--glass-border); padding: 0.8rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top:0; z-index:100;
    }
    .logo {
      font-size: 1.8rem; font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer;
    }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 2rem; color: var(--text);
      cursor: pointer; font-family: var(--font); font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.3rem; transition: 0.2s;
    }
    .icon-btn:hover { background: var(--primary); color:#000; }
    .hamburger {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 0.5rem; cursor: pointer;
      display: flex; flex-direction: column; gap: 5px; width: 40px; height: 40px;
      justify-content: center; align-items: center;
    }
    .hamburger span { display:block; width:25px; height:3px; background:var(--text); transition:0.3s; }
    .sidebar {
      position: fixed; top:0; right:-100%; width:280px; height:100%;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border); z-index:120;
      transition: right 0.3s ease; padding:1rem; overflow-y:auto;
      display: flex; flex-direction: column; gap:1.2rem;
    }
    .sidebar.open { right:0; }
    .sidebar-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index:115; display:none;
    }
    .sidebar-overlay.open { display:block; }
    .close-sidebar { align-self: flex-end; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; }
    .sidebar-section h3 { font-size:0.95rem; color:var(--primary); margin-bottom:0.5rem; border-bottom:1px solid var(--glass-border); padding-bottom:0.3rem; }
    .category-list { display:flex; flex-direction:column; gap:0.4rem; }
    .category-btn {
      background: var(--surface); border:1px solid var(--glass-border);
      padding:0.5rem 1rem; border-radius:1.5rem; color:var(--text);
      cursor:pointer; font-family:var(--font); font-size:0.85rem; transition:0.2s;
    }
    .category-btn:hover, .category-btn.active { background:var(--accent); color:#000; }
    main { flex:1; padding:1rem 1.5rem; max-width:1200px; margin:0 auto; width:100%; }
    .status-bar {
      background: var(--surface); border-radius: 1rem; padding: 0.5rem 1rem;
      margin-bottom: 1.5rem; display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--secondary);
    }
    .quote-list { display: flex; flex-direction: column; gap: 0.8rem; position: relative; }
    .quote-card {
      background: var(--glass-bg); backdrop-filter: blur(10px);
      border:1px solid var(--glass-border); border-radius:1.2rem; padding:1rem 1.2rem;
      display:flex; align-items: center; gap:1rem;
      transition: opacity 0.3s ease, transform 0.3s ease;
      animation: fadeInUp 0.4s ease;
    }
    .quote-card.removing {
      opacity: 0; transform: scale(0.95);
    }
    .quote-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,0,0,0.3); }
    .quote-number { font-size: 1.5rem; font-weight: 900; color: var(--primary); min-width: 2.5rem; text-align: center; }
    .quote-content { flex:1; }
    .quote-text { font-size: 1.1rem; line-height: 1.8; font-style: italic; margin-bottom: 0.3rem; }
    .quote-source { font-size: 0.8rem; color: var(--accent); }
    .quote-actions { display: flex; gap: 0.5rem; align-items: center; }
    .sentiment-icon { font-size:1.2rem; }
    .delete-btn {
      background: var(--danger); border:none; padding:0.4rem 1.2rem;
      border-radius:2rem; color:white; font-family:var(--font); cursor:pointer;
      font-weight:bold; transition: background 0.2s;
    }
    .delete-btn:hover { background: #c0392b; }
    .log-area {
      background: var(--surface); border-radius:1rem; padding:0.8rem; margin-top:1.5rem;
      font-size:0.8rem; color:var(--secondary); max-height:100px; overflow-y:auto;
      border:1px solid var(--glass-border);
    }
    .log-area p { margin:0.2rem 0; border-right:2px solid var(--accent); padding-right:0.5rem; }
    footer { text-align:center; padding:1rem; color:#555; font-size:0.8rem; margin-top:auto; }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(15px); }
      to { opacity:1; transform:translateY(0); }
    }
    body.light-mode {
      --bg: #f5f0eb; --surface: #ffffff; --text: #2c3e50;
      --glass-bg: rgba(255,255,255,0.85); --glass-border: rgba(0,0,0,0.05);
    }
    @media (max-width: 600px) {
      .quote-card { flex-direction: column; align-items: flex-start; }
      .logo { font-size:1.4rem; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <header>
    <div class="logo" id="logoText">📖 نقل‌قول‌سرا</div>
    <div class="header-actions">
      <button class="icon-btn" id="langToggle">🌐 <span id="langLabel">FA</span></button>
      <button class="icon-btn" id="themeToggle">🌓</button>
      <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <button class="close-sidebar" id="closeSidebar">✕</button>
    <div class="sidebar-section">
      <h3>🤖 ربات‌های فعال</h3>
      <p>📥 دروگرها: <span id="harvesterStatus">فعال</span></p>
      <p>✍️ نویسنده AI: <span id="aiwriterStatus">آماده</span></p>
      <p>🧹 پالایشگر: <span id="cleanerStatus">فعال</span></p>
      <hr style="border-color:var(--glass-border); margin:0.5rem 0;">
      <p>📊 مخزن: <span id="poolSize">0</span></p>
      <p>🚫 بلک‌لیست شما: <span id="blacklistSize">0</span></p>
    </div>
    <div class="sidebar-section">
      <h3>🗂️ دسته‌بندی‌ها</h3>
      <div class="category-list" id="sidebarCategoryList"></div>
    </div>
  </div>

  <main>
    <div class="status-bar">
      <span id="quoteCounter">۵۰ جمله</span>
      <span id="commanderLog">همه‌چیز آماده است</span>
    </div>
    <div class="quote-list" id="quoteList"></div>
    <div class="log-area" id="logArea"><p>🤖 راه‌اندازی شد...</p></div>
  </main>
  <footer>کاملاً تست‌شده – دیتابیس داخلی + APIهای زنده + AI نویسنده</footer>

  <script>
    // ==================== تنظیمات ====================
    const MAX_DISPLAY = 50;
    const CATEGORIES = ['همه','عشق','زمان','اخلاق','موفقیت','زندگی','مرگ','دوستی','امید','شجاعت','دانش','قدرت','آرامش','هنر','طبیعت','سفر','کار','سلامتی','معنویت','خلاقیت','رهبری','شادی','غم','صبر','آزادی','عدالت'];

    // ==================== دیتابیس محلی واقعی (کتاب‌ها + دیالوگ فیلم) ====================
    const LOCAL_QUOTES = [
      {fa:"تنها راه انجام کار بزرگ، دوست داشتن کاری است که انجام می‌دهی.",en:"The only way to do great work is to love what you do.",cat:"موفقیت",source:"استیو جابز"},
      {fa:"هر چه بیشتر کتاب بخوانید، چیزهای بیشتری خواهید دانست.",en:"The more that you read, the more things you will know.",cat:"دانش",source:"دکتر سوس"},
      {fa:"همهٔ حیوانات برابرند، اما برخی برابرترند.",en:"All animals are equal, but some animals are more equal than others.",cat:"آزادی",source:"جورج اورول - مزرعهٔ حیوانات"},
      {fa:"انسان آزاد آفریده شده، اما همه جا در زنجیر است.",en:"Man is born free, and everywhere he is in chains.",cat:"آزادی",source:"ژان ژاک روسو"},
      {fa:"من فکر می‌کنم، پس هستم.",en:"I think, therefore I am.",cat:"خلاقیت",source:"رنه دکارت"},
      {fa:"برای داشتن چیزی که هرگز نداشته‌اید، باید کسی شوید که هرگز نبوده‌اید.",en:"To have what you have never had, you must become who you have never been.",cat:"موفقیت",source:"جیم ران"},
      {fa:"هنگامی که هدفی داری، تمام جهان برای کمک به تو صف‌آرایی می‌کنند.",en:"When you want something, all the universe conspires in helping you to achieve it.",cat:"موفقیت",source:"پائولو کوئلیو - کیمیاگر"},
      {fa:"زندگی بدون تأمل، ارزش زیستن ندارد.",en:"The unexamined life is not worth living.",cat:"زندگی",source:"سقراط"},
      {fa:"تنها چیزی که می‌دانم این است که هیچ نمی‌دانم.",en:"I know that I am intelligent, because I know that I know nothing.",cat:"دانش",source:"سقراط"},
      {fa:"آینده به کسانی تعلق دارد که به زیبایی رویاهایشان ایمان دارند.",en:"The future belongs to those who believe in the beauty of their dreams.",cat:"امید",source:"النور روزولت"},
      {fa:"باشد که نیرو با تو باشد.",en:"May the Force be with you.",cat:"شجاعت",source:"جنگ ستارگان"},
      {fa:"من پدر تو هستم.",en:"I am your father.",cat:"خلاقیت",source:"جنگ ستارگان: امپراتوری"},
      {fa:"زندگی مثل یه جعبه شکلاته، هیچوقت نمی‌دونی چی قراره نصیبت بشه.",en:"Life is like a box of chocolates, you never know what you're gonna get.",cat:"زندگی",source:"فارست گامپ"},
      {fa:"انتقام‌گیری غذاییه که بهتره سرد سرو بشه.",en:"Revenge is a dish best served cold.",cat:"صبر",source:"بیل را بکش"},
      {fa:"چرا اینقدر جدی هستی؟",en:"Why so serious?",cat:"غم",source:"شوالیه تاریکی"},
      {fa:"بزرگترین افتخار ما در این نیست که هرگز زمین نخوریم، بلکه در این است که برخیزیم.",en:"Our greatest glory is not in never falling, but in rising every time we fall.",cat:"شجاعت",source:"کنفوسیوس"},
      {fa:"یا راهی خواهم یافت، یا راهی خواهم ساخت.",en:"I shall either find a way or make one.",cat:"خلاقیت",source:"هانیبال"},
      {fa:"دانش، تنها ثروتی است که با بخشیدن بیشتر می‌شود.",en:"Knowledge is the only wealth that increases when shared.",cat:"دانش",source:"عمومی"},
      {fa:"آنچه برای خود می‌پسندی، برای دیگران نیز بپسند.",en:"Do unto others as you would have them do unto you.",cat:"اخلاق",source:"قانون طلایی"}
    ];
    // پر کردن تا ۱۰۰ جمله
    while (LOCAL_QUOTES.length < 100) {
      LOCAL_QUOTES.push({...LOCAL_QUOTES[LOCAL_QUOTES.length % LOCAL_QUOTES.length], id: LOCAL_QUOTES.length});
    }

    // ==================== حالت ====================
    let currentLang = localStorage.getItem('qlang') || 'fa';
    let currentCategory = 'همه';
    let displayedQuotes = [];
    let quotesPool = [];
    let robotLogs = [];
    let blacklist = new Set(JSON.parse(localStorage.getItem('quote_blacklist') || '[]'));

    // المان‌های DOM
    const quoteList = document.getElementById('quoteList');
    const sidebarCategoryList = document.getElementById('sidebarCategoryList');
    const quoteCounter = document.getElementById('quoteCounter');
    const commanderLog = document.getElementById('commanderLog');
    const logArea = document.getElementById('logArea');
    const poolSizeEl = document.getElementById('poolSize');
    const blacklistSizeEl = document.getElementById('blacklistSize');

    // ==================== ذرات ====================
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
      }
      update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > canvas.width) this.vx *= -1; if (this.y < 0 || this.y > canvas.height) this.vy *= -1; }
      draw() { ctx.fillStyle = 'rgba(244, 162, 97, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
    }
    for (let i=0; i<60; i++) particlesArray.push(new Particle());
    function animateParticles() { ctx.clearRect(0,0,canvas.width,canvas.height); particlesArray.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
    animateParticles();

    // ==================== ترجمه ====================
    const ui = {
      fa: { logo:'📖 نقل‌قول‌سرا', counter:(n)=>`${n} جمله`, deleteBtn:'حذف', harvester:'فعال', aiwriter:'آماده', cleaner:'فعال', loading:'در حال بارگذاری...', commanderLog:'آماده' },
      en: { logo:'📖 QuoteVault', counter:(n)=>`${n} quotes`, deleteBtn:'Remove', harvester:'Active', aiwriter:'Ready', cleaner:'Active', loading:'Loading...', commanderLog:'Ready' }
    };
    function t(k,...a){ let s=ui[currentLang]?.[k]||k; return typeof s==='function'?s(...a):s; }
    function updateUI() {
      document.getElementById('logoText').textContent=t('logo');
      document.getElementById('langLabel').textContent=currentLang==='fa'?'FA':'EN';
      quoteCounter.textContent=t('counter',displayedQuotes.length);
      commanderLog.textContent=t('commanderLog');
      document.getElementById('harvesterStatus').textContent=t('harvester');
      document.getElementById('aiwriterStatus').textContent=t('aiwriter');
      document.getElementById('cleanerStatus').textContent=t('cleaner');
      renderCategoryList();
    }

    // ==================== منو همبرگری ====================
    function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
    document.getElementById('hamburgerBtn').addEventListener('click',toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click',toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click',toggleSidebar);

    function renderCategoryList(){
      sidebarCategoryList.innerHTML = CATEGORIES.map(cat => 
        `<button class="category-btn ${cat===currentCategory?'active':''}" data-cat="${cat}">${cat}</button>`
      ).join('');
      sidebarCategoryList.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.cat;
          renderCategoryList();
          refreshDisplay();
          toggleSidebar();
        });
      });
    }

    // ==================== ابزارها ====================
    function fingerprint(text) { return text.toLowerCase().replace(/[^a-z0-9]/g, '').trim(); }
    function isBlacklisted(text) { return blacklist.has(fingerprint(text)); }

    function getAvailableQuotes(){
      let filtered = currentCategory === 'همه' ? quotesPool : quotesPool.filter(q => q.cat === currentCategory);
      let displayedIds = new Set(displayedQuotes.map(q => q.id));
      return filtered.filter(q => !displayedIds.has(q.id) && !isBlacklisted(q.en));
    }

    function addQuotesToPool(arr, sourceLabel){
      let added = 0;
      arr.forEach(item => {
        let txtEn = (item.en || item.content || item.quote || item.text || '').trim();
        let txtFa = item.fa || txtEn;
        if (!txtEn || txtEn.length < 15 || isBlacklisted(txtEn)) return;
        let fp = fingerprint(txtEn);
        if (quotesPool.some(q => fingerprint(q.en) === fp)) return;
        quotesPool.push({
          id: Date.now() + Math.random(),
          fa: txtFa, en: txtEn,
          cat: categorizeQuote(txtEn), sentiment: simpleSentiment(txtEn),
          source: item.source || item.author || sourceLabel
        });
        added++;
      });
      if (added) { poolSizeEl.textContent = quotesPool.length; }
      return added;
    }

    function refreshDisplay() {
      let avail = getAvailableQuotes();
      let need = MAX_DISPLAY - displayedQuotes.length;
      if (need > 0 && avail.length) {
        let shuffled = [...avail].sort(() => Math.random() - 0.5);
        let newQuotes = shuffled.slice(0, need);
        displayedQuotes.push(...newQuotes);
        newQuotes.forEach(q => appendCard(q));
      }
      quoteCounter.textContent = t('counter', displayedQuotes.length);
      updateNumbers();
    }

    function updateNumbers(){
      document.querySelectorAll('.quote-card').forEach((card, i) => card.querySelector('.quote-number').textContent = i + 1);
    }

    function buildCardElement(q){
      let card = document.createElement('div');
      card.className = 'quote-card';
      card.dataset.id = q.id;
      let text = currentLang === 'fa' ? q.fa : q.en;
      let sent = {pos:'😊', neu:'😐', neg:'😞'};
      card.innerHTML = `
        <div class="quote-number">0</div>
        <div class="quote-content">
          <div class="quote-text">“${text}”</div>
          <div class="quote-source">${q.source||'نامشخص'}</div>
        </div>
        <div class="quote-actions">
          <span class="sentiment-icon">${sent[q.sentiment]||'😐'}</span>
          <button class="delete-btn">${t('deleteBtn')}</button>
        </div>`;
      card.querySelector('.delete-btn').addEventListener('click', e => { e.stopPropagation(); deleteQuote(q.id); });
      return card;
    }

    function appendCard(q, animate=true){
      let card = buildCardElement(q);
      if (!animate) card.style.animation = 'none';
      quoteList.appendChild(card);
    }

    function removeCard(id){
      let card = document.querySelector(`.quote-card[data-id="${id}"]`);
      if (card) {
        card.classList.add('removing');
        setTimeout(() => {
          card.remove();
          let idx = displayedQuotes.findIndex(q => q.id == id);
          if (idx !== -1) displayedQuotes.splice(idx, 1);
          quoteCounter.textContent = t('counter', displayedQuotes.length);
          updateNumbers();
        }, 300);
      }
    }

    function deleteQuote(id){
      let quote = displayedQuotes.find(q => q.id === id);
      if (!quote) return;
      blacklist.add(fingerprint(quote.en));
      localStorage.setItem('quote_blacklist', JSON.stringify([...blacklist]));
      blacklistSizeEl.textContent = blacklist.size;
      addLog('🗑️ جمله حذف شد.');
      removeCard(id);
      setTimeout(() => {
        let avail = getAvailableQuotes();
        if (avail.length) {
          let newQ = avail[Math.floor(Math.random() * avail.length)];
          displayedQuotes.push(newQ);
          appendCard(newQ);
          quoteCounter.textContent = t('counter', displayedQuotes.length);
          updateNumbers();
        } else {
          // اگه هیچی نبود، AI بنویسه
          generateAI(5);
        }
      }, 350);
    }

    function renderAllQuotes(){
      quoteList.innerHTML = '';
      displayedQuotes.forEach(q => appendCard(q, false));
      updateNumbers();
    }

    // ==================== تحلیل ابتدایی ====================
    function simpleSentiment(txt){
      let posW = ['love','hope','joy','success','great','beautiful','good','excellent','happy','inspiring'];
      let negW = ['sad','fear','failure','death','pain','hate','angry','bad','terrible','depressing'];
      let l=txt.toLowerCase(), p=0,n=0;
      posW.forEach(w=>{ if(l.includes(w)) p++; });
      negW.forEach(w=>{ if(l.includes(w)) n++; });
      return p>n?'pos':(n>p?'neg':'neu');
    }
    function categorizeQuote(txt){
      let l=txt.toLowerCase();
      for(let c of CATEGORIES.slice(1)) if(l.includes(c)) return c;
      return 'زندگی';
    }

    // ==================== دروگرها (API) ====================
    const API_SOURCES = [
      { url: 'https://api.quotable.io/quotes/random?limit=8', parser: d=>d, label:'Quotable' },
      { url: 'https://zenquotes.io/api/random', parser: d=>d.map(q=>({en:q.q,source:q.a})), label:'ZenQuotes' },
      { url: 'https://api.quotable.io/quotes?tags=book,literature,movies&limit=8', parser: d=>d.results, label:'Quotable Books/Films' },
      { url: 'https://type.fit/api/quotes', parser: d=>d.slice(0,8), label:'Type.fit' }
    ];

    async function fetchFromSource(src){
      try {
        let res = await fetch(src.url);
        if (!res.ok) throw new Error('status '+res.status);
        let data = await res.json();
        let items = src.parser(data);
        if (items && items.length) {
          let added = addQuotesToPool(items, src.label);
          if (added) addLog(`📥 ${src.label}: ${added} جمله`);
          return added;
        }
      } catch(e) {}
      return 0;
    }

    async function runHarvesters(){
      let totalAdded = 0;
      for (let src of API_SOURCES) {
        let added = await fetchFromSource(src);
        totalAdded += added;
      }
      if (totalAdded > 0) {
        refreshDisplay();
      } else {
        // fallback به دیتابیس محلی
        let added = addQuotesToPool(LOCAL_QUOTES.slice(0, 10), 'حافظه داخلی');
        if (added) {
          addLog('📥 از حافظه داخلی جمله اضافه شد.');
          refreshDisplay();
        }
      }
      // اگر بازم کم بود AI
      if (quotesPool.length < 80) generateAI(10);
    }

    // ==================== AI نویسنده (۳ سبک) ====================
    function generateAI(count){
      let pieces = [
        {fa:'عشق پلی است میان دو روح.', en:'Love is a bridge between two souls.', cat:'عشق'},
        {fa:'زندگی جستجویی بی‌پایان است.', en:'Life is an endless search.', cat:'زندگی'},
        {fa:'شجاعت به معنای نترسیدن نیست، بلکه غلبه بر ترس است.', en:'Courage is not the absence of fear, but the triumph over it.', cat:'شجاعت'},
        {fa:'خلاقیت یعنی دیدن آنچه همه می‌بینند و فکر کردن به آنچه هیچ‌کس فکر نمی‌کند.', en:'Creativity is seeing what everyone sees and thinking what no one has thought.', cat:'خلاقیت'},
        {fa:'زمان ارزشمندترین دارایی است.', en:'Time is the most valuable asset.', cat:'زمان'},
        {fa:'در میان تاریکی، نور را باور کن.', en:'In darkness, believe in the light.', cat:'امید'},
        {fa:'موفقیت سفر است، نه مقصد.', en:'Success is a journey, not a destination.', cat:'موفقیت'},
        {fa:'دوستی واقعی در طوفان شناخته می‌شود.', en:'True friendship is known in the storm.', cat:'دوستی'},
        {fa:'فیلم‌ها رویاهایی هستند که هرگز فراموش نمی‌شوند.', en:'Movies are dreams we never forget.', cat:'هنر', source:'AI سینما'},
        {fa:'هر کتاب دنیایی جدید است.', en:'Every book is a new world.', cat:'دانش', source:'AI کتاب'},
        {fa:'قهرمان داستان خودت باش.', en:'Be the hero of your own story.', cat:'خلاقیت', source:'AI الهام‌بخش'}
      ];
      for (let i=0; i<count; i++){
        let p = pieces[Math.floor(Math.random() * pieces.length)];
        addQuotesToPool([{
          fa: p.fa, en: p.en, cat: p.cat,
          source: p.source || 'AI نویسنده'
        }], 'AI');
      }
      poolSizeEl.textContent = quotesPool.length;
      refreshDisplay();
      addLog(`✍️ AI ${count} جمله جدید نوشت.`);
    }

    // ==================== پالایش تکراری ====================
    function deduplicate(){
      let seen = new Map();
      let unique = [];
      quotesPool.forEach(q => {
        let fp = fingerprint(q.en);
        if (!seen.has(fp) && !blacklist.has(fp)) { seen.set(fp, q); unique.push(q); }
      });
      let removed = quotesPool.length - unique.length;
      if (removed > 0){
        quotesPool = unique;
        addLog(`🧹 ${removed} تکراری حذف شد.`);
        poolSizeEl.textContent = quotesPool.length;
        // حذف از صفحه
        let displayedIds = new Set(displayedQuotes.map(q => q.id));
        displayedQuotes = displayedQuotes.filter(q => quotesPool.some(p => p.id === q.id));
        refreshDisplay();
      }
    }

    function addLog(msg){
      let time = new Date().toLocaleTimeString('fa-IR');
      robotLogs.push(`[${time}] ${msg}`);
      if (robotLogs.length > 20) robotLogs.shift();
      logArea.innerHTML = robotLogs.map(m => `<p>${m}</p>`).join('');
      logArea.scrollTop = logArea.scrollHeight;
    }

    // ==================== زمانبندی‌ها ====================
    setInterval(runHarvesters, 30 * 1000); // هر ۳۰ ثانیه
    setInterval(deduplicate, 15 * 1000);   // هر ۱۵ ثانیه

    // ==================== شروع اولیه ====================
    async function initialLoad(){
      commanderLog.textContent = t('loading');
      addQuotesToPool(LOCAL_QUOTES, 'حافظه داخلی');
      let initDisplay = getAvailableQuotes().slice(0, MAX_DISPLAY);
      displayedQuotes = initDisplay;
      renderAllQuotes();
      quoteCounter.textContent = t('counter', displayedQuotes.length);
      poolSizeEl.textContent = quotesPool.length;
      blacklistSizeEl.textContent = blacklist.size;
      // اولین برداشت
      await runHarvesters();
      commanderLog.textContent = t('commanderLog');
    }

    // ==================== تغییر زبان و تم ====================
    function toggleLanguage(){
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      localStorage.setItem('qlang', currentLang);
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      updateUI();
      renderAllQuotes();
    }
    function toggleTheme(){
      document.body.classList.toggle('light-mode');
      localStorage.setItem('qtheme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }
    document.getElementById('langToggle').addEventListener('click', toggleLanguage);
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    if (localStorage.getItem('qtheme') === 'light') document.body.classList.add('light-mode');

    function init(){
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      renderCategoryList();
      updateUI();
      initialLoad();
    }
    init();
  </script>
</body>
</html>
