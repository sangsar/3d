<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خبرخوان جنگ و ترامپ</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #0a0f1c;
      --surface: #141b2b;
      --text: #e0e6f0;
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #f4a261;
      --danger: #ff4d6d;
      --glass-bg: rgba(20, 27, 43, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --font: 'Vazirmatn', sans-serif;
      --card-radius: 1.2rem;
      --max-width: 800px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      transition: background 0.3s;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
    header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.8rem 1.2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    nav {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }
    nav button {
      background: var(--surface);
      border: 1px solid var(--glass-border);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
    }
    nav button:hover {
      background: var(--accent);
      color: #000;
    }
    .theme-btn {
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    main {
      flex: 1;
      padding: 1.2rem;
      max-width: var(--max-width);
      margin: 0 auto;
      width: 100%;
    }
    .status-bar {
      background: var(--surface);
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--secondary);
    }
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .news-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      overflow: hidden;
      animation: fadeInUp 0.4s ease;
    }
    .news-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card-body {
      padding: 1rem;
    }
    .source {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    h3 {
      font-size: 1.2rem;
      margin: 0.5rem 0;
      line-height: 1.5;
    }
    .desc {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-bottom: 0.8rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .actions a, .actions button {
      background: var(--surface);
      border: 1px solid var(--glass-border);
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      font-family: var(--font);
      font-size: 0.8rem;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .actions a:hover {
      background: var(--primary);
      color: #000;
    }
    .actions button:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }
    .robot-log {
      background: var(--surface);
      border-radius: 1rem;
      padding: 0.8rem;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--secondary);
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--glass-border);
    }
    .robot-log p {
      margin: 0.2rem 0;
      border-right: 2px solid var(--accent);
      padding-right: 0.5rem;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: #555;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* حالت روشن */
    body.light-mode {
      --bg: #f5f0eb;
      --surface: #ffffff;
      --text: #2c3e50;
      --glass-bg: rgba(255,255,255,0.9);
      --glass-border: rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <header>
    <div class="logo" id="logo-text">📡 فیلتر جنگ و ترامپ</div>
    <nav>
      <button onclick="toggleLanguage()">🌐 <span id="lang-label">FA</span></button>
      <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </nav>
  </header>

  <main>
    <div class="status-bar">
      <span>🤖 ربات: هر ۱ ساعت، فقط اخبار جنگ/ترامپ</span>
      <span id="last-fetch">آخرین دریافت: --</span>
    </div>
    <div class="news-list" id="news-list">
      <p style="text-align:center; padding:2rem;">در حال بارگذاری اخبار مرتبط...</p>
    </div>
    <div class="robot-log" id="robot-log">
      <p>⏳ ربات آماده دریافت خبر...</p>
    </div>
  </main>

  <footer>
    منابع: ایسنا، ایرنا، مهر، تسنیم، فارس، باشگاه خبرنگاران، خبرآنلاین، تابناک، BBC فارسی
  </footer>

  <script>
    // ==================== منابع (بدون توییتر) ====================
    const RSS_SOURCES = [
      'https://www.isna.ir/rss',
      'https://www.irna.ir/rss',
      'https://www.mehrnews.com/rss',
      'https://www.tasnimnews.com/fa/rss',
      'https://www.farsnews.ir/rss',
      'https://www.yjc.ir/fa/rss',
      'https://www.khabaronline.ir/rss',
      'https://www.tabnak.ir/fa/rss',
      'https://feeds.bbci.co.uk/persian/rss.xml'
    ];

    const FETCH_INTERVAL = 60 * 60 * 1000; // هر ۱ ساعت
    const ARTICLE_TTL = 60 * 60 * 1000;    // ۱ ساعت عمر خبر
    const MAX_PER_FETCH = 60;              // ۶۰ خبر در هر نوبت

    // کلمات کلیدی برای فیلتر (حروف کوچک)
    const KEYWORDS = ['جنگ', 'ترامپ', 'trump', 'war', 'iran war'];

    let articles = [];                 // لیست اخبار فعال
    let blacklist = JSON.parse(localStorage.getItem('news_blacklist') || '[]'); // لینک‌های حذف‌شده توسط کاربر
    let robotLogs = [];
    let currentLang = localStorage.getItem('news_lang') || 'fa';

    // ==================== ذرات پس‌زمینه ====================
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.fillStyle = 'rgba(244, 162, 97, 0.6)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    particles = Array.from({ length: 60 }, () => new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ==================== ترجمه و رابط ====================
    const translations = {
      fa: {
        loading: 'در حال بارگذاری اخبار...',
        empty: 'خبری با این موضوع پیدا نشد.',
        last_fetch: 'آخرین دریافت',
        new_article: 'خبر جدید اضافه شد',
        duplicate: 'تکراری حذف شد',
        filtered_out: 'فیلتر موضوع: حذف شد',
        read_more: 'مشاهده',
        delete_btn: 'حذف',
        twitter: 'توییتر'
      },
      en: {
        loading: 'Loading news...',
        empty: 'No matching news found.',
        last_fetch: 'Last fetch',
        new_article: 'New article added',
        duplicate: 'Duplicate removed',
        filtered_out: 'Topic filter: removed',
        read_more: 'Read more',
        delete_btn: 'Delete',
        twitter: 'Twitter'
      }
    };
    function t(key) { return translations[currentLang]?.[key] || key; }

    function applyLanguage() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('lang-label').textContent = currentLang === 'fa' ? 'FA' : 'EN';
      document.getElementById('logo-text').textContent = currentLang === 'fa' ? '📡 فیلتر جنگ و ترامپ' : '📡 War & Trump Filter';
      const timePart = document.getElementById('last-fetch').textContent.split(':')[1] || '--';
      document.getElementById('last-fetch').textContent = `${t('last_fetch')}:${timePart}`;
      renderArticles();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      localStorage.setItem('news_lang', currentLang);
      applyLanguage();
    }

    // ==================== ربات ====================
    function logRobot(msg) {
      const time = new Date().toLocaleTimeString('fa-IR');
      robotLogs.push(`[${time}] ${msg}`);
      if (robotLogs.length > 30) robotLogs.shift();
      const logDiv = document.getElementById('robot-log');
      logDiv.innerHTML = robotLogs.map(m => `<p>${m}</p>`).join('');
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function containsKeyword(text) {
      if (!text) return false;
      const lower = text.toLowerCase();
      return KEYWORDS.some(kw => lower.includes(kw));
    }

    function isDuplicate(link) {
      return articles.some(a => a.link === link) || blacklist.includes(link);
    }

    async function fetchNews() {
      logRobot('🔍 شروع دریافت ۶۰ خبر...');
      let freshArticles = [];
      for (let feedUrl of RSS_SOURCES) {
        try {
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
          const resp = await fetch(apiUrl);
          const data = await resp.json();
          if (data.status === 'ok') {
            const items = data.items.map(item => ({
              title: item.title,
              link: item.link,
              description: item.description?.replace(/<[^>]+>/g, '').substring(0, 250),
              image: item.thumbnail || (item.description?.match(/<img[^>]+src="([^">]+)"/) || [])[1] || 'https://via.placeholder.com/400x200?text=No+Image',
              pubDate: item.pubDate,
              source: data.feed.title
            }));
            freshArticles.push(...items);
          }
        } catch (e) {
          logRobot(`⚠️ خطا در دریافت ${feedUrl}`);
        }
      }

      // مرتب‌سازی جدیدترین
      freshArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

      let addedCount = 0;
      for (let article of freshArticles) {
        if (addedCount >= MAX_PER_FETCH) break;

        // فیلتر محتوایی (جنگ/ترامپ)
        if (!containsKeyword(article.title) && !containsKeyword(article.description)) {
          logRobot(`🚫 ${t('filtered_out')}: ${article.title?.substring(0, 40)}`);
          continue;
        }

        // بررسی تکراری و لیست سیاه
        if (isDuplicate(article.link)) {
          logRobot(`♻️ ${t('duplicate')}: ${article.title?.substring(0, 40)}`);
          continue;
        }

        article.addedAt = Date.now();
        articles.unshift(article);
        addedCount++;
        logRobot(`✅ ${t('new_article')}: ${article.title?.substring(0, 50)}`);
      }

      document.getElementById('last-fetch').textContent = 
        `${t('last_fetch')}: ${new Date().toLocaleTimeString('fa-IR')}`;
      renderArticles();
    }

    function removeOldArticles() {
      const now = Date.now();
      const before = articles.length;
      articles = articles.filter(a => now - a.addedAt < ARTICLE_TTL);
      if (articles.length < before) renderArticles();
    }

    // ==================== ترجمه خودکار ====================
    const translateCache = JSON.parse(localStorage.getItem('translate_cache') || '{}');
    async function translateText(text, from = 'auto', to = 'fa') {
      if (!text || currentLang === 'en') return text;
      const cacheKey = `${text}_${to}`;
      if (translateCache[cacheKey]) return translateCache[cacheKey];
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
        const data = await res.json();
        const translated = data.responseData.translatedText || text;
        translateCache[cacheKey] = translated;
        localStorage.setItem('translate_cache', JSON.stringify(translateCache));
        return translated;
      } catch (e) {
        return text;
      }
    }

    // ==================== دکمه حذف خبر ====================
    function deleteArticle(link) {
      // افزودن به لیست سیاه و حذف از آرایه
      if (!blacklist.includes(link)) {
        blacklist.push(link);
        localStorage.setItem('news_blacklist', JSON.stringify(blacklist));
      }
      articles = articles.filter(a => a.link !== link);
      logRobot(`🗑️ خبر حذف شد: ${link.substring(0, 50)}`);
      renderArticles();
    }

    // ==================== رندر اخبار ====================
    async function renderArticles() {
      const grid = document.getElementById('news-list');
      grid.innerHTML = '';
      if (articles.length === 0) {
        grid.innerHTML = `<p style="text-align:center; padding:2rem;">${t('empty')}</p>`;
        return;
      }

      for (let article of articles) {
        const card = document.createElement('div');
        card.className = 'news-card';

        let title = article.title;
        let desc = article.description;
        if (currentLang === 'fa') {
          title = await translateText(title);
          desc = await translateText(desc);
        }

        card.innerHTML = `
          <img src="${article.image}" alt="" onerror="this.style.display='none'">
          <div class="card-body">
            <div class="source">${article.source}</div>
            <h3>${title}</h3>
            <div class="desc">${desc}</div>
            <div class="actions">
              <a href="${article.link}" target="_blank">${t('read_more')}</a>
              <button onclick="deleteArticle('${article.link.replace(/'/g, "\\'")}')">🗑️ ${t('delete_btn')}</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    // ==================== حالت تاریک ====================
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    // ==================== راه‌اندازی ====================
    function init() {
      applyLanguage();
      fetchNews();
      setInterval(fetchNews, FETCH_INTERVAL);
      setInterval(removeOldArticles, 60000); // پاکسازی قدیمی‌ها هر دقیقه
    }
    init();
  </script>
</body>
</html>
