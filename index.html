<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کفش واقعی با Three.js | Samisaki</title>
    <style>
        body { margin: 0; overflow: hidden; background: #d5d0c8; font-family: sans-serif; }
        canvas { display: block; }
        .hint {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            color: #fff; padding: 10px 24px; border-radius: 30px;
            font-size: 0.85rem; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div class="hint">🖱️ بچرخانید | اسکرول زوم | مدل سه‌بعدی واقعی کفش</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // صحنه
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd5d0c8);

        // Environment Map (انعکاس‌های واقعی روی کفش)
        const pmremGenerator = new THREE.PMREMGenerator(new THREE.WebGLRenderer());
        const envMap = pmremGenerator.fromScene(new THREE.Scene()).texture;
        scene.environment = envMap;

        // دوربین
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
        camera.position.set(3, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.5, 0);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.minDistance = 1.5;
        controls.maxDistance = 8;
        controls.update();

        // نورپردازی حرفه‌ای
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const key = new THREE.DirectionalLight(0xfff5f0, 6);
        key.position.set(-4, 6, 4);
        key.castShadow = true;
        key.shadow.mapSize.width = 1024;
        key.shadow.mapSize.height = 1024;
        scene.add(key);

        const fill = new THREE.DirectionalLight(0xccddff, 2.5);
        fill.position.set(3, 2, 1);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffffff, 4);
        rim.position.set(0, 1.5, -3);
        scene.add(rim);

        // پایه
        const base = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 0.85, 0.05, 64),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 })
        );
        base.position.y = -0.03;
        base.receiveShadow = true;
        scene.add(base);

        // بارگذاری مدل GLTF واقعی از کفش
        const loader = new GLTFLoader();
        loader.load(
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Shoes/glTF/Shoes.gltf',
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(1.2, 1.2, 1.2);
                model.position.set(0, 0.1, 0);
                model.rotation.y = -0.4;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(model);
            },
            undefined,
            (error) => {
                console.error('خطا در بارگذاری مدل:', error);
                // Fallback: نمایش یک کفش ساده
                const fallback = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.3, 1.5),
                    new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 })
                );
                fallback.position.y = 0.3;
                scene.add(fallback);
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
