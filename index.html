<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل‌قول‌های ماندگار | کتابخانهٔ جملات</title>
    <!-- فونت وزیرمتن از CDN -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0a0f;
            --bg-secondary: #14111e;
            --card-bg: rgba(25, 22, 35, 0.7);
            --accent: #ff6b9d;
            --accent-soft: #ff8aab;
            --text: #e6e0f0;
            --text-muted: #9088a0;
            --border: rgba(255, 107, 157, 0.2);
            --radius: 20px;
            --shadow: 0 12px 32px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(255,107,157,0.07) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(180,130,255,0.05) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            line-height: 2;
            position: relative;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11,10,15,0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .category-badge {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--accent-soft);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
        }
        .hamburger {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 200;
        }
        .hamburger:hover {
            background: rgba(255,107,157,0.15);
            border-color: var(--accent);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -380px;
            width: 340px;
            max-width: 85vw;
            height: 100vh;
            background: rgba(20,17,30,0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--border);
            z-index: 160;
            padding: 24px 20px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar.active { right: 0; }
        .sidebar h3 {
            color: var(--accent);
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .sidebar .section-title {
            color: var(--text-muted);
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-top: 12px;
            padding-right: 8px;
        }
        .sidebar button,
        .sidebar .menu-link {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 13px 18px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.03);
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            text-align: right;
        }
        .sidebar button:hover {
            background: rgba(255,107,157,0.1);
            border-color: var(--border);
            color: #fff;
        }
        .sidebar button.active-cat {
            background: rgba(255,107,157,0.15);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }
        .sidebar .icon {
            font-size: 1.2rem;
            width: 26px;
        }
        .danger-btn {
            color: #ff7b7b !important;
            border-color: rgba(255,123,123,0.3) !important;
        }
        .danger-btn:hover {
            background: rgba(255,123,123,0.15) !important;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .sidebar .close-btn:hover { color: #fff; border-color: #fff; }

        .main-container {
            padding: 32px 20px 60px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .quotes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }
        @media (max-width: 700px) {
            .quotes-grid { grid-template-columns: 1fr; }
            .logo { font-size: 1.4rem; }
        }

        .quote-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 24px 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            transition: 0.4s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            animation: fadeCard 0.5s ease backwards;
            position: relative;
        }
        .quote-card:hover {
            border-color: rgba(255,107,157,0.5);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        @keyframes fadeCard {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-text {
            font-size: 1.3rem;
            line-height: 2.2;
            color: #f2ecfe;
            font-weight: 400;
            max-width: 90%;
        }

        .quote-author {
            font-size: 0.85rem;
            color: var(--accent-soft);
            margin-top: auto;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .card-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .card-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255,107,157,0.1);
        }
        .card-btn.fav-btn.liked {
            color: #ff5e7a;
            border-color: #ff5e7a;
            background: rgba(255,94,122,0.15);
            animation: heartPop 0.4s ease;
        }
        @keyframes heartPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .card-btn.delete-btn:hover {
            border-color: #ff7b7b;
            color: #ff7b7b;
            background: rgba(255,123,123,0.1);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            font-size: 1.3rem;
        }
        .empty-state .icon-big {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25,22,35,0.95);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 28px;
            border-radius: 30px;
            z-index: 300;
            backdrop-filter: blur(20px);
            font-size: 0.95rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-6px);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,107,157,0.3); border-radius: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">✨ جملات ماندگار</div>
        <div class="header-actions">
            <span class="category-badge" id="categoryBadge">📚 همه</span>
            <button class="hamburger" id="hamburgerBtn" title="منو">☰</button>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebar">✕</button>
        <h3>📖 گنجینهٔ جملات</h3>

        <div class="section-title">📂 دسته‌بندی</div>
        <button class="menu-link active-cat" data-category="all"><span class="icon">📚</span> همه نقل‌قول‌ها</button>
        <button class="menu-link" data-category="famous"><span class="icon">🌟</span> سخنان بزرگان</button>
        <button class="menu-link" data-category="book"><span class="icon">📖</span> تکه‌های کتاب</button>
        <button class="menu-link" data-category="dialogue"><span class="icon">🎬</span> دیالوگ‌های ماندگار</button>
        <button class="menu-link" data-category="philosophy"><span class="icon">🏛️</span> فلسفی</button>
        <button class="menu-link" data-category="psychology"><span class="icon">🧠</span> روانشناسی</button>

        <div class="section-title">❤️ مجموعه‌های من</div>
        <button class="menu-link" id="showFavorites"><span class="icon">❤️</span> علاقه‌مندی‌ها <span id="favCount">(0)</span></button>
        <button class="menu-link" id="showBlacklist"><span class="icon">🚫</span> بلک‌لیست <span id="blacklistCount">(0)</span></button>
        <button class="menu-link danger-btn" id="clearBlacklist"><span class="icon">🔓</span> آزادسازی بلک‌لیست</button>
    </aside>

    <main class="main-container">
        <div class="quotes-grid" id="quotesGrid"></div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="quotes.js"></script>
    <script>
        (function() {
            const grid = document.getElementById('quotesGrid');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const closeSidebarBtn = document.getElementById('closeSidebar');
            const categoryBadge = document.getElementById('categoryBadge');
            const toast = document.getElementById('toast');
            const favCountEl = document.getElementById('favCount');
            const blacklistCountEl = document.getElementById('blacklistCount');
            const showFavoritesBtn = document.getElementById('showFavorites');
            const showBlacklistBtn = document.getElementById('showBlacklist');
            const clearBlacklistBtn = document.getElementById('clearBlacklist');

            const STORAGE_KEY = 'cinema_quotes_v2';
            let currentCategory = 'all';
            let displayedIds = [];
            let blacklist = new Set();
            let favorites = new Set();
            let allQuotes = [];

            if (typeof quotes !== 'undefined' && Array.isArray(quotes)) {
                allQuotes = [...quotes];
            } else {
                console.error('quotes.js یافت نشد.');
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data.blacklist) blacklist = new Set(data.blacklist);
                        if (data.favorites) favorites = new Set(data.favorites);
                        if (data.currentCategory) currentCategory = data.currentCategory;
                        if (data.displayedIds) displayedIds = data.displayedIds;
                    }
                } catch (e) {}
            }

            function saveState() {
                try {
                    const data = {
                        blacklist: [...blacklist],
                        favorites: [...favorites],
                        currentCategory,
                        displayedIds,
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {}
            }

            function getQuotesByCategory(cat) {
                if (cat === 'all') return [...allQuotes];
                return allQuotes.filter(q => q.category === cat);
            }

            function getAvailableQuoteIds(cat) {
                const pool = getQuotesByCategory(cat);
                const poolIds = new Set(pool.map(q => q.id));
                const available = [];
                for (const id of poolIds) {
                    if (!blacklist.has(id) && !displayedIds.includes(id)) available.push(id);
                }
                for (let i = available.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [available[i], available[j]] = [available[j], available[i]];
                }
                return available;
            }

            function findQuoteById(id) {
                return allQuotes.find(q => q.id === id);
            }

            const categoryNames = {
                all: '📚 همه',
                famous: '🌟 سخنان بزرگان',
                book: '📖 تکه‌های کتاب',
                dialogue: '🎬 دیالوگ',
                philosophy: '🏛️ فلسفی',
                psychology: '🧠 روانشناسی',
                favorites: '❤️ علاقه‌مندی‌ها',
                blacklist: '🚫 بلک‌لیست',
            };

            function showToast(msg) {
                clearTimeout(window.toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            function initDisplayedIds(cat) {
                const available = getAvailableQuoteIds(cat);
                displayedIds = available.slice(0, 100);
            }

            function refillDisplayedIds(cat) {
                const needed = 100 - displayedIds.length;
                if (needed <= 0) return;
                const available = getAvailableQuoteIds(cat);
                displayedIds.push(...available.slice(0, needed));
            }

            function renderGrid() {
                grid.innerHTML = '';
                if (displayedIds.length === 0) {
                    const msg = currentCategory === 'favorites' ? '❤️ هنوز جمله‌ای به علاقه‌مندی‌ها اضافه نکردی.' :
                               currentCategory === 'blacklist' ? '🚫 بلک‌لیست خالی است.' :
                               '📭 جمله‌ای برای نمایش نیست.';
                    grid.innerHTML = `<div class="empty-state"><span class="icon-big">${currentCategory==='favorites'?'💔':'🕊️'}</span>${msg}</div>`;
                    return;
                }
                const fragment = document.createDocumentFragment();
                displayedIds.forEach((id, idx) => {
                    const quote = findQuoteById(id);
                    if (!quote) return;
                    const isFav = favorites.has(id);
                    const authorDisplay = (quote.author && quote.author !== 'ناشناس') ? quote.author : '';
                    const card = document.createElement('div');
                    card.className = 'quote-card';
                    card.style.animationDelay = `${(idx % 15) * 0.04}s`;
                    card.innerHTML = `
                        <div class="quote-text">${escapeHTML(quote.text)}</div>
                        ${authorDisplay ? `<div class="quote-author">— ${escapeHTML(authorDisplay)}</div>` : ''}
                        <div class="card-actions">
                            <button class="card-btn fav-btn ${isFav ? 'liked' : ''}" data-id="${id}">${isFav ? '❤️' : '🤍'}</button>
                            <button class="card-btn delete-btn" data-id="${id}">🗑️</button>
                        </div>
                    `;
                    fragment.appendChild(card);
                });
                grid.appendChild(fragment);
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updateCounts() {
                favCountEl.textContent = `(${favorites.size})`;
                blacklistCountEl.textContent = `(${blacklist.size})`;
            }
            function updateBadge() { categoryBadge.textContent = categoryNames[currentCategory] || '📚 همه'; }
            function updateSidebarActive() {
                document.querySelectorAll('.sidebar button[data-category]').forEach(btn => {
                    btn.classList.toggle('active-cat', btn.dataset.category === currentCategory);
                });
            }

            function switchCategory(cat) {
                if (cat === 'favorites') {
                    currentCategory = 'favorites';
                    displayedIds = [...favorites];
                } else if (cat === 'blacklist') {
                    currentCategory = 'blacklist';
                    displayedIds = [...blacklist];
                } else {
                    currentCategory = cat;
                    initDisplayedIds(cat);
                    refillDisplayedIds(cat);
                }
                updateBadge();
                updateSidebarActive();
                renderGrid();
                updateCounts();
                closeSidebar();
                saveState();
            }

            function toggleFavorite(id) {
                if (favorites.has(id)) {
                    favorites.delete(id);
                    showToast('🤍 از علاقه‌مندی‌ها حذف شد');
                } else {
                    favorites.add(id);
                    showToast('❤️ به علاقه‌مندی‌ها اضافه شد');
                }
                updateCounts();
                if (currentCategory === 'favorites') displayedIds = [...favorites];
                renderGrid();
                saveState();
            }

            function deleteQuote(id) {
                if (blacklist.has(id)) return;
                displayedIds = displayedIds.filter(did => did !== id);
                blacklist.add(id);
                favorites.delete(id);
                if (currentCategory !== 'favorites' && currentCategory !== 'blacklist') {
                    refillDisplayedIds(currentCategory);
                } else if (currentCategory === 'favorites') {
                    displayedIds = [...favorites];
                } else if (currentCategory === 'blacklist') {
                    displayedIds = [...blacklist];
                }
                updateCounts();
                renderGrid();
                saveState();
                showToast('🗑️ جمله به بلک‌لیست رفت و جملهٔ جدید جایگزین شد');
            }

            function clearBlacklistAction() {
                if (blacklist.size === 0) {
                    showToast('🚫 بلک‌لیست خالی است');
                    return;
                }
                const count = blacklist.size;
                blacklist.clear();
                if (currentCategory === 'blacklist') displayedIds = [];
                else if (currentCategory !== 'favorites') {
                    initDisplayedIds(currentCategory);
                    refillDisplayedIds(currentCategory);
                }
                updateCounts();
                renderGrid();
                saveState();
                showToast(`🔓 ${count} جمله آزاد شد`);
            }

            grid.addEventListener('click', e => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const id = parseInt(btn.dataset.id);
                if (isNaN(id)) return;
                if (btn.classList.contains('fav-btn')) toggleFavorite(id);
                else if (btn.classList.contains('delete-btn')) deleteQuote(id);
            });

            document.querySelectorAll('.sidebar button[data-category]').forEach(btn => {
                btn.addEventListener('click', () => switchCategory(btn.dataset.category));
            });
            showFavoritesBtn.addEventListener('click', () => switchCategory('favorites'));
            showBlacklistBtn.addEventListener('click', () => switchCategory('blacklist'));
            clearBlacklistBtn.addEventListener('click', clearBlacklistAction);

            function openSidebar() { sidebar.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
            function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
            hamburgerBtn.addEventListener('click', openSidebar);
            closeSidebarBtn.addEventListener('click', closeSidebar);
            overlay.addEventListener('click', closeSidebar);
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && sidebar.classList.contains('active')) closeSidebar(); });

            function init() {
                loadState();
                if (displayedIds.length === 0 && currentCategory !== 'favorites' && currentCategory !== 'blacklist') {
                    initDisplayedIds(currentCategory);
                    refillDisplayedIds(currentCategory);
                }
                if (currentCategory === 'favorites') displayedIds = [...favorites];
                if (currentCategory === 'blacklist') displayedIds = [...blacklist];
                updateBadge();
                updateCounts();
                updateSidebarActive();
                renderGrid();
                saveState();
            }
            init();
        })();
    </script>
</body>
</html>
