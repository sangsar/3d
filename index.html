<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خبرخوان جهان | اخبار از منابع معتبر</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #f0f2f5;
      --text: #1c1e21;
      --card-bg: #ffffff;
      --primary: #e63946;
      --secondary: #1d3557;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --header-bg: rgba(255,255,255,0.92);
      --cat-btn-bg: #e0e0e0;
    }
    body.dark {
      --bg: #18191a;
      --text: #e4e6eb;
      --card-bg: #242526;
      --primary: #e63946;
      --secondary: #f1f1f1;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --header-bg: rgba(24, 25, 26, 0.92);
      --cat-btn-bg: #3a3b3c;
    }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1.8em;
      font-weight: 900;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-box {
      display: flex;
      background: var(--card-bg);
      border-radius: 30px;
      padding: 3px 3px 3px 15px;
      box-shadow: var(--shadow);
    }
    .search-box input {
      border: none;
      background: transparent;
      padding: 10px;
      font-family: inherit;
      font-size: 0.9em;
      width: 160px;
      color: var(--text);
      outline: none;
    }
    .search-box button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--text);
      color: var(--text);
      padding: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #google_translate_element {
      margin-right: 5px;
    }
    main {
      flex: 1;
      padding: 25px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .category-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .cat-btn {
      background: var(--cat-btn-bg);
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
      font-weight: 500;
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: white;
    }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }
    .news-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.1);
    }
    .news-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #ccc;
    }
    .news-card .card-body {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-body .source {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 5px;
    }
    .card-body h3 {
      font-size: 1.1em;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .card-body .description {
      font-size: 0.9em;
      line-height: 1.7;
      color: var(--text);
      flex: 1;
      margin-bottom: 12px;
      opacity: 0.9;
    }
    .card-body a {
      align-self: flex-start;
      background: var(--secondary);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9em;
      display: inline-block;
    }
    .load-more {
      text-align: center;
      margin: 35px 0;
    }
    .load-more button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 35px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 1.1em;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .load-more button:hover {
      opacity: 0.9;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: var(--card-bg);
      color: #888;
      font-size: 0.9em;
      margin-top: auto;
    }
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 12px;
      }
      .news-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="resetToHome()">📰 خبرخوان جهان</div>
    <div class="nav-actions">
      <div id="google_translate_element"></div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="جستجوی خبر..." />
        <button onclick="searchNews()">🔍</button>
      </div>
      <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </div>
  </header>

  <main>
    <div class="category-nav" id="category-nav">
      <button class="cat-btn active" data-category="all">همه</button>
      <button class="cat-btn" data-category="world">جهان</button>
      <button class="cat-btn" data-category="technology">فناوری</button>
      <button class="cat-btn" data-category="sports">ورزش</button>
      <button class="cat-btn" data-category="business">کسب‌وکار</button>
      <button class="cat-btn" data-category="health">سلامت</button>
      <button class="cat-btn" data-category="science">علم</button>
    </div>
    <div id="news-grid" class="news-grid"></div>
    <div class="load-more" id="load-more-btn" style="display: none;">
      <button onclick="loadMore()">بارگذاری اخبار بیشتر</button>
    </div>
  </main>

  <footer>
    اخبار از RSS فیدهای BBC، CNN، Reuters، TechCrunch، ESPN و ... – بدون نیاز به API Key
  </footer>

  <!-- Google Translate Widget -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'fa,en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    // ====================== منابع RSS ======================
    const RSS_FEEDS = {
      world: [
        'https://feeds.bbci.co.uk/news/world/rss.xml',
        'https://rss.nytimes.com/services/xml/rss/nyt/World.xml'
      ],
      technology: [
        'https://feeds.bbci.co.uk/news/technology/rss.xml',
        'https://techcrunch.com/feed/'
      ],
      sports: [
        'https://feeds.bbci.co.uk/sport/rss.xml',
        'https://www.espn.com/espn/rss/news'
      ],
      business: [
        'https://feeds.bbci.co.uk/news/business/rss.xml',
        'https://www.cnbc.com/id/10001147/device/rss/rss.html'
      ],
      health: [
        'https://feeds.bbci.co.uk/news/health/rss.xml',
        'https://www.medicalnewstoday.com/newsfeeds/rss/health'
      ],
      science: [
        'https://feeds.bbci.co.uk/news/science_and_environment/rss.xml',
        'https://www.sciencedaily.com/rss/all.xml'
      ]
    };

    let allArticles = [];
    let displayedArticles = [];
    let currentCategory = 'all';
    let currentSearchTerm = '';
    let pageSize = 12;
    let currentPage = 0;

    // ====================== Fetch RSS via rss2json ======================
    async function fetchFeed(url) {
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        if (data.status === 'ok') {
          return data.items.map(item => ({
            title: item.title,
            link: item.link,
            description: item.description,
            image: item.thumbnail || item.enclosure?.link || extractImage(item.description) || 'https://via.placeholder.com/400x200?text=No+Image',
            pubDate: item.pubDate,
            source: data.feed.title,
            category: currentCategory
          }));
        }
      } catch (e) {
        console.warn('Could not fetch feed:', url, e);
      }
      return [];
    }

    function extractImage(html) {
      if (!html) return null;
      const match = html.match(/<img[^>]+src="([^">]+)"/);
      return match ? match[1] : null;
    }

    async function loadArticles(category = 'all') {
      currentCategory = category;
      const feedUrls = category === 'all'
        ? Object.values(RSS_FEEDS).flat()
        : RSS_FEEDS[category] || [];

      document.getElementById('news-grid').innerHTML = '<p style="text-align:center; padding:40px;">در حال دریافت اخبار...</p>';
      document.getElementById('load-more-btn').style.display = 'none';

      const promises = feedUrls.map(url => fetchFeed(url));
      const results = await Promise.all(promises);
      allArticles = results.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

      currentPage = 0;
      displayedArticles = [];
      applySearchAndDisplay();
    }

    function applySearchAndDisplay() {
      let filtered = allArticles;
      if (currentSearchTerm) {
        const term = currentSearchTerm.toLowerCase();
        filtered = filtered.filter(a => a.title.toLowerCase().includes(term) || (a.description && a.description.toLowerCase().includes(term)));
      }
      displayedArticles = filtered;
      renderPage(0);
    }

    function renderPage(page) {
      currentPage = page;
      const start = page * pageSize;
      const end = start + pageSize;
      const articlesToShow = displayedArticles.slice(start, end);

      const grid = document.getElementById('news-grid');
      if (page === 0) grid.innerHTML = '';

      if (articlesToShow.length === 0 && page === 0) {
        grid.innerHTML = '<p style="text-align:center; padding:40px;">خبری یافت نشد.</p>';
        document.getElementById('load-more-btn').style.display = 'none';
        return;
      }

      articlesToShow.forEach(article => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <img src="${article.image}" alt="${article.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
          <div class="card-body">
            <div class="source">${article.source}</div>
            <h3>${article.title}</h3>
            <div class="description">${article.description ? article.description.replace(/<[^>]+>/g, '').substring(0, 150) + '...' : ''}</div>
            <a href="${article.link}" target="_blank">مشاهده خبر کامل</a>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('load-more-btn').style.display = displayedArticles.length > end ? 'block' : 'none';
    }

    function loadMore() {
      renderPage(currentPage + 1);
    }

    function searchNews() {
      currentSearchTerm = document.getElementById('search-input').value.trim();
      applySearchAndDisplay();
    }

    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchNews();
    });

    // ====================== دکمه‌های دسته‌بندی ======================
    document.getElementById('category-nav').addEventListener('click', (e) => {
      if (e.target.classList.contains('cat-btn')) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const cat = e.target.dataset.category;
        loadArticles(cat);
      }
    });

    function resetToHome() {
      document.getElementById('search-input').value = '';
      currentSearchTerm = '';
      document.querySelector('.cat-btn[data-category="all"]').classList.add('active');
      loadArticles('all');
    }

    // ====================== حالت تاریک ======================
    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('news_theme', theme);
    }
    function toggleTheme() {
      const next = document.body.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(next);
    }
    applyTheme(localStorage.getItem('news_theme') || 'light');

    // راه‌اندازی اولیه
    loadArticles('all');
  </script>
</body>
</html>
