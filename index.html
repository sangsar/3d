<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقل‌قول‌سرای هوشمند | چندرباته</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0f14;
      --surface: #151e24;
      --text: #cbd5e0;
      --primary: #f4a261;
      --secondary: #e76f51;
      --accent: #2a9d8f;
      --glass-bg: rgba(21, 30, 36, 0.75);
      --glass-border: rgba(255,255,255,0.07);
      --font: 'Vazirmatn', sans-serif;
      --sent-pos: #2ecc71;
      --sent-neu: #f1c40f;
      --sent-neg: #e74c3c;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #particles {
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;
    }
    header {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--glass-border);
      padding: 0.8rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top:0; z-index:100;
    }
    .logo {
      font-size: 1.8rem; font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 2rem; color: var(--text);
      cursor: pointer; font-family: var(--font); font-size: 1rem;
      display: flex; align-items: center; gap: 0.3rem; transition: 0.2s;
    }
    .icon-btn:hover { background: var(--primary); color:#000; }
    .hamburger {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 0.5rem; cursor: pointer;
      display: flex; flex-direction: column; gap: 5px; width: 40px; height: 40px;
      justify-content: center; align-items: center;
    }
    .hamburger span { display:block; width:25px; height:3px; background:var(--text); transition:0.3s; }
    .sidebar {
      position: fixed; top:0; right:-100%; width:270px; height:100%;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border); z-index:120;
      transition: right 0.3s ease; padding:1rem; overflow-y:auto;
      display: flex; flex-direction: column; gap:1rem;
    }
    .sidebar.open { right:0; }
    .sidebar-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index:115; display:none;
    }
    .sidebar-overlay.open { display:block; }
    .close-sidebar { align-self: flex-end; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; }
    .category-list { display:flex; flex-direction:column; gap:0.5rem; }
    .category-btn {
      background: var(--surface); border:1px solid var(--glass-border);
      padding:0.5rem 1rem; border-radius:1.5rem; color:var(--text);
      cursor:pointer; font-family:var(--font); font-size:0.9rem; transition:0.2s;
    }
    .category-btn:hover, .category-btn.active { background:var(--accent); color:#000; }
    main {
      flex:1; padding:1rem 1.5rem; max-width:1300px; margin:0 auto; width:100%;
    }
    .commander-panel {
      background: var(--surface); border-radius: 1.2rem; padding: 1rem 1.5rem;
      margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap:1rem;
      justify-content: space-between;
    }
    .robot-status { display:flex; flex-wrap:wrap; gap:0.8rem; }
    .robot-badge {
      display: flex; align-items: center; gap:0.3rem;
      background: var(--glass-bg); padding:0.3rem 0.8rem; border-radius:1.5rem;
      font-size:0.8rem; border:1px solid var(--glass-border);
    }
    .robot-badge .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
    .quote-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:1rem;
    }
    .quote-card {
      background: var(--glass-bg); backdrop-filter: blur(10px);
      border:1px solid var(--glass-border); border-radius:1.2rem; padding:1.2rem;
      display:flex; flex-direction:column; gap:0.8rem;
      transition: transform 0.2s, box-shadow 0.2s; animation: fadeInUp 0.4s ease;
    }
    .quote-card:hover { transform:translateY(-4px); box-shadow:0 10px 25px rgba(0,0,0,0.3); }
    .quote-text { font-size:1.1rem; line-height:1.8; font-style:italic; }
    .quote-footer { display:flex; justify-content:space-between; align-items:center; }
    .sentiment { font-size:1.2rem; }
    .delete-btn {
      background: var(--danger, #e74c3c); border:none; padding:0.4rem 1.2rem;
      border-radius:2rem; color:white; font-family:var(--font); cursor:pointer;
      font-weight:bold; transition: background 0.2s;
    }
    .delete-btn:hover { background: #c0392b; }
    .log-area {
      background: var(--surface); border-radius:1rem; padding:0.8rem; margin-top:1.5rem;
      font-size:0.8rem; color:var(--secondary); max-height:120px; overflow-y:auto;
      border:1px solid var(--glass-border);
    }
    .log-area p { margin:0.2rem 0; border-right:2px solid var(--accent); padding-right:0.5rem; }
    footer { text-align:center; padding:1rem; color:#555; font-size:0.8rem; margin-top:auto; }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(15px); }
      to { opacity:1; transform:translateY(0); }
    }
    body.light-mode {
      --bg: #f5f0eb; --surface: #ffffff; --text: #2c3e50;
      --glass-bg: rgba(255,255,255,0.85); --glass-border: rgba(0,0,0,0.05);
    }
    @media (max-width: 600px) {
      .quote-grid { grid-template-columns: 1fr; }
      .logo { font-size:1.4rem; }
      .commander-panel { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <header>
    <div class="logo" id="logoText">📖 نقل‌قول‌سرا</div>
    <div class="header-actions">
      <button class="icon-btn" id="langToggle">🌐 <span id="langLabel">FA</span></button>
      <button class="icon-btn" id="themeToggle">🌓</button>
      <button class="icon-btn" id="fetchNowBtn">🔄 دریافت جمله</button>
      <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <button class="close-sidebar" id="closeSidebar">✕</button>
    <h3>🗂️ دسته‌بندی‌ها</h3>
    <div class="category-list" id="categoryList"></div>
    <hr style="border-color:var(--glass-border);">
    <div style="font-size:0.9rem;">
      <p>🤖 ربات‌ها</p>
      <p>📥 دروگر: <span id="harvesterStatus">فعال</span></p>
      <p>🧹 پالایشگر: <span id="cleanerStatus">آماده</span></p>
      <p>📊 تحلیل‌گر: <span id="sentimentStatus">فعال</span></p>
    </div>
  </div>

  <main>
    <!-- پنل فرمانده -->
    <div class="commander-panel">
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <span style="font-size:1.3rem;">🧠</span>
        <span>فرمانده هوش مصنوعی</span>
      </div>
      <div class="robot-status">
        <span class="robot-badge"><span class="dot"></span> دروگر</span>
        <span class="robot-badge"><span class="dot"></span> پالایشگر</span>
        <span class="robot-badge"><span class="dot"></span> تحلیل‌گر</span>
        <span class="robot-badge"><span class="dot"></span> دسته‌بند</span>
      </div>
      <span id="quoteCounter">۴۰ جمله</span>
    </div>

    <!-- شبکه جملات -->
    <div class="quote-grid" id="quoteGrid"></div>

    <!-- لاگ ربات‌ها -->
    <div class="log-area" id="logArea">
      <p>🤖 ربات‌ها آمادهٔ سرویس‌دهی هستند...</p>
    </div>
  </main>

  <footer>
    قدرت‌گرفته از Quotable API + هوش مصنوعی مرورگر | طراحی شده با ❤️
  </footer>

  <script>
    // ==================== پیکربندی ====================
    const MAX_DISPLAY = 40;
    const CATEGORIES = [
      'عشق', 'زمان', 'اخلاق', 'موفقیت', 'زندگی', 'مرگ', 'دوستی', 'امید', 'شجاعت', 'دانش',
      'قدرت', 'آرامش', 'هنر', 'طبیعت', 'سفر', 'کار', 'سلامتی', 'معنویت', 'خلاقیت', 'رهبری',
      'شادی', 'غم', 'صبر', 'آزادی', 'عدالت'
    ];

    // ==================== دیتابیس پایه (۵۰ جمله برای شروع) ====================
    const baseQuotes = [
      { id:1, cat:'عشق', fa:'عشق تنها پلی است که تاریکی را به روشنایی می‌رساند.', en:'Love is the only bridge that leads from darkness to light.', sentiment:'pos' },
      { id:2, cat:'زمان', fa:'زمان مانند رودخانه‌ایست که نمی‌توان دوبار در آن قدم گذاشت.', en:'Time is a river you cannot step into twice.', sentiment:'neu' },
      { id:3, cat:'اخلاق', fa:'اخلاق، در نبود قانون، چراغ راه انسان است.', en:'Ethics is the light in the absence of law.', sentiment:'pos' },
      { id:4, cat:'موفقیت', fa:'موفقیت حاصل پشتکار است، نه شانس.', en:'Success is the fruit of persistence, not luck.', sentiment:'pos' },
      { id:5, cat:'زندگی', fa:'زندگی یک سفر است، نه مقصد.', en:'Life is a journey, not a destination.', sentiment:'neu' }
      // (برای اختصار ۵ جمله گذاشتم – تو می‌تونی آرایه رو با جمله‌های واقعی پر کنی)
    ];
    // پر کردن جمله‌های ساختگی تا ۵۰ تا
    for (let i = baseQuotes.length + 1; i <= 50; i++) {
      let cat = CATEGORIES[i % CATEGORIES.length];
      baseQuotes.push({
        id: i,
        cat: cat,
        fa: `جملهٔ پایه #${i} دربارهٔ ${cat}.`,
        en: `Base quote #${i} about ${cat}.`,
        sentiment: (i % 3 === 0) ? 'neg' : ((i % 3 === 1) ? 'pos' : 'neu')
      });
    }

    // ==================== وضعیت کلی ====================
    let currentLang = localStorage.getItem('qlang') || 'fa';
    let currentCategory = 'all';
    let displayedQuotes = [];          // آرایه‌ای از آبجکت‌های quote که روی صفحه هستند
    let quotesPool = [...baseQuotes];  // مخزن کل (پایه + جملات دریافت‌شده)
    let nextId = baseQuotes.length + 1;
    let robotLogs = [];

    // ==================== المان‌های DOM ====================
    const quoteGrid = document.getElementById('quoteGrid');
    const categoryListEl = document.getElementById('categoryList');
    const quoteCounterEl = document.getElementById('quoteCounter');
    const logArea = document.getElementById('logArea');
    const harvesterStatus = document.getElementById('harvesterStatus');
    const cleanerStatus = document.getElementById('cleanerStatus');
    const sentimentStatus = document.getElementById('sentimentStatus');

    // ==================== ذرات پس‌زمینه ====================
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.fillStyle = 'rgba(244, 162, 97, 0.5)';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
      }
    }
    for (let i=0; i<60; i++) particlesArray.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particlesArray.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ==================== رابط کاربری ====================
    const ui = {
      fa: { logo:'📖 نقل‌قول‌سرا', counter:(n)=>`${n} جمله`, deleteBtn:'حذف', fetchNow:'🔄 دریافت جمله',
            harvesterActive:'فعال', cleanerReady:'آماده', sentimentActive:'فعال' },
      en: { logo:'📖 QuoteVault', counter:(n)=>`${n} quotes`, deleteBtn:'Remove', fetchNow:'🔄 Fetch quote',
            harvesterActive:'Active', cleanerReady:'Ready', sentimentActive:'Active' }
    };
    function t(key, ...args) {
      let str = (ui[currentLang] && ui[currentLang][key]) || key;
      if (typeof str === 'function') return str(...args);
      return str;
    }

    function updateUILanguage() {
      document.getElementById('logoText').textContent = t('logo');
      document.getElementById('langLabel').textContent = currentLang === 'fa' ? 'FA' : 'EN';
      document.getElementById('fetchNowBtn').textContent = t('fetchNow');
      quoteCounterEl.textContent = t('counter', displayedQuotes.length);
      harvesterStatus.textContent = t('harvesterActive');
      cleanerStatus.textContent = t('cleanerReady');
      sentimentStatus.textContent = t('sentimentActive');
      renderCategoryList();
      renderQuotes();
    }

    // ==================== منو همبرگری ====================
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }
    document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);

    function renderCategoryList() {
      let html = `<button class="category-btn ${currentCategory==='all'?'active':''}" data-cat="all">${currentLang==='fa'?'همه':'All'}</button>`;
      CATEGORIES.forEach(cat => {
        html += `<button class="category-btn ${cat===currentCategory?'active':''}" data-cat="${cat}">${cat}</button>`;
      });
      categoryListEl.innerHTML = html;
      categoryListEl.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.cat;
          renderCategoryList();
          refreshDisplay();
          toggleSidebar();
        });
      });
    }

    // ==================== مدیریت جملات ====================
    function getAvailableQuotes() {
      // مخزن جملات غیر تکراری که در حال حاضر نمایش داده نشده‌اند
      let filtered = currentCategory === 'all' ? quotesPool : quotesPool.filter(q => q.cat === currentCategory);
      const displayedIds = new Set(displayedQuotes.map(q => q.id));
      return filtered.filter(q => !displayedIds.has(q.id));
    }

    function refreshDisplay() {
      const available = getAvailableQuotes();
      // کمبود تا MAX_DISPLAY
      const needed = MAX_DISPLAY - displayedQuotes.length;
      if (needed > 0 && available.length > 0) {
        const shuffled = [...available].sort(() => Math.random() - 0.5);
        const toAdd = shuffled.slice(0, Math.min(needed, shuffled.length));
        displayedQuotes.push(...toAdd);
      }
      // حذف اضافی اگر بیش از MAX_DISPLAY
      if (displayedQuotes.length > MAX_DISPLAY) {
        displayedQuotes.length = MAX_DISPLAY;
      }
      quoteCounterEl.textContent = t('counter', displayedQuotes.length);
      renderQuotes();
    }

    function deleteQuote(quoteId) {
      const index = displayedQuotes.findIndex(q => q.id === quoteId);
      if (index !== -1) {
        const removed = displayedQuotes.splice(index, 1)[0];
        // پیدا کردن یک جملهٔ جدید از مخزن
        const available = getAvailableQuotes();
        if (available.length > 0) {
          const newQuote = available[Math.floor(Math.random() * available.length)];
          displayedQuotes.push(newQuote);
        }
        // ثبت در لاگ
        addLog(`🗑️ جمله حذف شد: «${removed.fa.substring(0,30)}...» و جملهٔ جدید جایگزین شد.`);
        quoteCounterEl.textContent = t('counter', displayedQuotes.length);
        renderQuotes();
      }
    }

    function renderQuotes() {
      quoteGrid.innerHTML = '';
      displayedQuotes.forEach(q => {
        const card = document.createElement('div');
        card.className = 'quote-card';
        const text = currentLang === 'fa' ? q.fa : q.en;
        const sentEmoji = { pos:'😊', neu:'😐', neg:'😞' };
        card.innerHTML = `
          <div class="quote-text">“${text}”</div>
          <div class="quote-footer">
            <span class="sentiment">${sentEmoji[q.sentiment] || '😐'}</span>
            <span style="font-size:0.8rem; color:var(--accent);">${q.cat}</span>
            <button class="delete-btn" data-id="${q.id}">${t('deleteBtn')}</button>
          </div>
        `;
        card.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteQuote(q.id);
        });
        quoteGrid.appendChild(card);
      });
    }

    // ==================== ربات‌ها ====================
    function addLog(msg) {
      const time = new Date().toLocaleTimeString('fa-IR');
      robotLogs.push(`[${time}] ${msg}`);
      if (robotLogs.length > 20) robotLogs.shift();
      logArea.innerHTML = robotLogs.map(m => `<p>${m}</p>`).join('');
      logArea.scrollTop = logArea.scrollHeight;
    }

    function simpleSentiment(text) {
      const positiveWords = ['خوب', 'عالی', 'زیبا', 'عشق', 'امید', 'شادی', 'موفقیت', 'love', 'hope', 'joy', 'success'];
      const negativeWords = ['بد', 'غم', 'ترس', 'شکست', 'مرگ', 'درد', 'sad', 'fear', 'failure', 'death'];
      const lower = text.toLowerCase();
      let pos = 0, neg = 0;
      positiveWords.forEach(w => { if (lower.includes(w)) pos++; });
      negativeWords.forEach(w => { if (lower.includes(w)) neg++; });
      if (pos > neg) return 'pos';
      if (neg > pos) return 'neg';
      return 'neu';
    }

    function categorizeQuote(text) {
      const lower = text.toLowerCase();
      for (let cat of CATEGORIES) {
        if (lower.includes(cat)) return cat;
      }
      return CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
    }

    // ربات دروگر: جمع‌آوری جملات از API
    async function fetchQuotesFromAPI() {
      try {
        addLog('📡 ربات دروگر: در حال دریافت جملات جدید...');
        const res = await fetch('https://api.quotable.io/quotes/random?limit=5');
        const data = await res.json();
        if (data && data.length) {
          let added = 0;
          data.forEach(item => {
            const textFa = item.content; // Quotable فقط انگلیسی داره
            const textEn = item.content;
            // جلوگیری از تکراری (با id یا محتوا)
            if (!quotesPool.some(q => q.en === textEn)) {
              const cat = categorizeQuote(textEn);
              const sent = simpleSentiment(textEn);
              quotesPool.push({
                id: nextId++,
                cat: cat,
                fa: textFa, // ترجمه نداریم، همون انگلیسی رو نمایش می‌دهیم (می‌توان بعداً با MyMemory ترجمه کرد)
                en: textEn,
                sentiment: sent
              });
              added++;
            }
          });
          addLog(`✅ ربات دروگر: ${added} جملهٔ جدید به مخزن اضافه کرد.`);
          // اگر صفحه جا دارد، نمایش را به‌روزرسانی کن
          if (displayedQuotes.length < MAX_DISPLAY) refreshDisplay();
        }
      } catch (e) {
        addLog('⚠️ ربات دروگر: خطا در دریافت جملات.');
      }
    }

    // ربات پالایشگر: حذف تکراری‌ها
    function cleanDuplicates() {
      const unique = [];
      const seen = new Set();
      quotesPool.forEach(q => {
        const key = q.en.toLowerCase().trim();
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(q);
        }
      });
      const removed = quotesPool.length - unique.length;
      if (removed > 0) {
        quotesPool = unique;
        addLog(`🧹 ربات پالایشگر: ${removed} جملهٔ تکراری را حذف کرد.`);
      }
    }

    // حلقهٔ مدیریت ربات‌ها
    function runRobots() {
      cleanDuplicates();
      // دروگر هر ۱۰ دقیقه یک‌بار توسط setInterval صدا زده می‌شود، اینجا فقط وضعیت را نشان می‌دهیم
    }

    // راه‌اندازی زمان‌بندی ربات دروگر
    setInterval(fetchQuotesFromAPI, 10 * 60 * 1000); // هر ۱۰ دقیقه
    setInterval(runRobots, 30000); // پالایش هر ۳۰ ثانیه

    // ==================== تغییر زبان و تم ====================
    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      localStorage.setItem('qlang', currentLang);
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      updateUILanguage();
    }
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('qtheme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    document.getElementById('langToggle').addEventListener('click', toggleLanguage);
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('fetchNowBtn').addEventListener('click', fetchQuotesFromAPI);

    // بارگذاری تم ذخیره شده
    if (localStorage.getItem('qtheme') === 'light') document.body.classList.add('light-mode');

    // ==================== راه‌اندازی اولیه ====================
    function init() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      renderCategoryList();
      // انتخاب ۴۰ جملهٔ تصادفی اولیه
      const shuffled = [...quotesPool].sort(() => Math.random() - 0.5);
      displayedQuotes = shuffled.slice(0, Math.min(MAX_DISPLAY, shuffled.length));
      updateUILanguage();
      runRobots(); // اجرای اولیهٔ پالایش
      fetchQuotesFromAPI(); // اولین برداشت
      addLog('🤖 فرمانده: همهٔ ربات‌ها فعال شدند.');
    }
    init();
  </script>
</body>
</html>
