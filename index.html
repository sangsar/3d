<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فیلم‌نما | آرشیو فیلم و سریال</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #0a0f1c;
      --surface: #141b2b;
      --text: #e0e6f0;
      --primary: #e94560;
      --secondary: #f4a261;
      --glass-bg: rgba(20, 27, 43, 0.8);
      --glass-border: rgba(255, 255, 255, 0.08);
      --font: 'Vazirmatn', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      transition: background 0.3s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }
    nav {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .search-box {
      background: var(--surface);
      border-radius: 2rem;
      padding: 0.3rem 0.3rem 0.3rem 1rem;
      display: flex;
      align-items: center;
      border: 1px solid var(--glass-border);
    }
    .search-box input {
      background: none;
      border: none;
      color: var(--text);
      padding: 0.5rem;
      font-family: var(--font);
      width: 150px;
      outline: none;
    }
    .search-box button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-family: var(--font);
      cursor: pointer;
      font-weight: bold;
    }
    .btn {
      background: var(--surface);
      border: 1px solid var(--glass-border);
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      color: var(--text);
      font-family: var(--font);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .genre-filter {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .genre-btn {
      background: var(--surface);
      border: 1px solid var(--glass-border);
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      color: var(--text);
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .genre-btn.active, .genre-btn:hover {
      background: var(--secondary);
      color: #000;
      border-color: var(--secondary);
    }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
    }
    .movie-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 1rem;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.4s ease;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(233, 69, 96, 0.2);
    }
    .movie-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .card-body {
      padding: 0.8rem;
    }
    .card-body h3 {
      font-size: 1rem;
      margin-bottom: 0.3rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-body .year {
      font-size: 0.8rem;
      color: var(--secondary);
    }
    .detail-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .detail-content {
      background: var(--surface);
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      color: var(--text);
      position: relative;
      max-height: 80vh;
      overflow-y: auto;
    }
    .detail-content img {
      width: 100%;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }
    .detail-content h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .detail-content .meta {
      display: flex;
      gap: 1rem;
      color: var(--secondary);
      margin-bottom: 1rem;
    }
    .detail-content .desc {
      line-height: 1.8;
    }
    .close-btn, .fav-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      margin-top: 1rem;
      cursor: pointer;
      font-family: var(--font);
    }
    .fav-btn {
      background: var(--secondary);
      color: #000;
    }
    footer {
      text-align: center;
      padding: 1rem;
      color: #555;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    body.light-mode {
      --bg: #f5f0eb;
      --surface: #ffffff;
      --text: #2c3e50;
      --glass-bg: rgba(255,255,255,0.9);
      --glass-border: rgba(0,0,0,0.05);
    }
    @media (max-width: 600px) {
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
      .movie-card img {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="resetFilters()">🎬 فیلم‌نما</div>
    <nav>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجوی فیلم...">
        <button onclick="filterMovies()">🔍</button>
      </div>
      <button class="btn" onclick="toggleTheme()">🌓</button>
      <button class="btn" onclick="showFavorites()">❤️ موردعلاقه‌ها</button>
    </nav>
  </header>

  <main>
    <div class="genre-filter" id="genreFilter"></div>
    <div class="movie-grid" id="movieGrid"></div>
  </main>

  <div class="detail-modal" id="detailModal">
    <div class="detail-content" id="detailContent"></div>
  </div>

  <footer>تمامی اطلاعات این سایت ساختگی و برای نمایش قدرت طراحی است.</footer>

  <script>

      { title: "ارباب حلقه‌ها: بازگشت پادشاه", genre: "فانتزی", year: 2003, desc: "نبرد نهایی برای نابودی حلقه یگانه و نجات سرزمین میانه.", img: "https://picsum.photos/seed/lotr3/400/600" },
      { title: "باشگاه مشت‌زنی", genre: "درام", year: 1999, desc: "یک کارمند بی‌خواب با یک فروشنده صابون مرموز باشگاه زیرزمینی مشت‌زنی راه می‌اندازند.", img: "https://picsum.photos/seed/fightclub/400/600" },
      { title: "فارست گامپ", genre: "درام", year: 1994, desc: "مردی ساده‌دل با قلبی از طلا در میان رویدادهای بزرگ تاریخ آمریکا.", img: "https://picsum.photos/seed/forrest/400/600" },

      { title: "ماتریکس", genre: "علمی-تخیلی", year: 1999, desc: "هکری به نام نئو حقیقت دنیای شبیه‌سازی شده را کشف می‌کند.", img: "https://picsum.photos/seed/matrix/400/600" },
      { title: "هفت", genre: "جنایی", year: 1995, desc: "دو کارآگاه به دنبال قاتلی زنجیره‌ای که بر اساس هفت گناه کبیره می‌کشد.", img: "https://picsum.photos/seed/seven/400/600" },

      { title: "گلادیاتور", genre: "اکشن", year: 2000, desc: "ژنرالی رومی که به بردگی گرفته می‌شود و برای انتقام به عنوان گلادیاتور می‌جنگد.", img: "https://picsum.photos/seed/gladiator/400/600" },

      { title: "تایتانیک", genre: "عاشقانه", year: 1997, desc: "داستان عشق ممنوعه در کشتی غرق‌شونده تایتانیک.", img: "https://picsum.photos/seed/titanic/400/600" },
      { title: "جویندگان", genre: "وسترن", year: 1956, desc: "کهنه‌سربازی به دنبال خواهرزاده ربوده‌شده‌اش در غرب وحشی می‌گردد.", img: "https://picsum.photos/seed/searchers/400/600" },
      { title: "همشهری کین", genre: "درام", year: 1941, desc: "زندگی غول رسانه‌ای که با کلمهٔ «رزباد» می‌میرد و خبرنگاری به راز آن پی می‌برد.", img: "https://picsum.photos/seed/citizenkane/400/600" },

      { title: "بیگانه", genre: "ترسناک", year: 1979, desc: "خدمهٔ یک سفینه فضایی با موجودی بیگانه و مرگبار روبرو می‌شوند.", img: "https://picsum.photos/seed/alien/400/600" },

      { title: "جوی", genre: "درام", year: 2015, desc: "داستان واقعی زنی که با اختراع یک تیِ جدید امپراتوری تجاری می‌سازد.", img: "https://picsum.photos/seed/joy/400/600" },
      { title: "لا لا لند", genre: "موزیکال", year: 2016, desc: "داستان عشق یک پیانیست جاز و یک هنرپیشهٔ مشتاق در لس‌آنجلس.", img: "https://picsum.photos/seed/lalaland/400/600" },
      { title: "انگل", genre: "درام", year: 2019, desc: "خانواده‌ای فقیر به تدریج خود را به زندگی یک خانواده ثروتمند وارد می‌کنند.", img: "https://picsum.photos/seed/parasite/400/600" },
      { title: "شکافت", genre: "ترسناک", year: 2017, desc: "مردی با ۲۳ شخصیت مختلف، سه دختر را می‌رباید.", img: "https://picsum.photos/seed/split/400/600" },
      { title: "داستان عامه‌پسند", genre: "جنایی", year: 1994, desc: "چند داستان درهم‌تنیده از تبهکاران، بوکسوری و یک کیف مرموز.", img: "https://picsum.photos/seed/pulp2/400/600" },
      { title: "رفتگان", genre: "جنایی", year: 2006, desc: "پلیسی مخفی و خلافکاری که در سازمان پلیس نفوذ کرده‌اند، همدیگر را تعقیب می‌کنند.", img: "https://picsum.photos/seed/departed/400/600" },
      { title: "شوالیه تاریکی برمی‌خیزد", genre: "اکشن", year: 2012, desc: "بتمن پس از سال‌ها غیبت برای مقابله با تهدیدی جدید بازمی‌گردد.", img: "https://picsum.photos/seed/darkknightrises/400/600" },
      { title: "وال-ای", genre: "انیمیشن", year: 2008, desc: "رباتی کوچک روی زمین متروک می‌ماند و عاشق رباتی پیشرفته می‌شود.", img: "https://picsum.photos/seed/walle/400/600" },

      { title: "هری پاتر و سنگ جادو", genre: "فانتزی", year: 2001, desc: "پسری جادوگر به مدرسهٔ هاگوارتز می‌رود و با راز سنگ جادو روبرو می‌شود.", img: "https://picsum.photos/seed/harrypotter1/400/600" },
      { title: "بازی های گرسنگی", genre: "علمی-تخیلی", year: 2012, desc: "در آینده‌ای دیستوپیایی، نوجوانان برای سرگرمی تلویزیونی تا سرحد مرگ مبارزه می‌کنند.", img: "https://picsum.photos/seed/hungergames/400/600" },
      { title: "مرد آهنی", genre: "اکشن", year: 2008, desc: "مهندسی نابغه زرهی پیشرفته می‌سازد و تبدیل به ابرقهرمان می‌شود.", img: "https://picsum.photos/seed/ironman/400/600" },

      { title: "ددپول", genre: "کمدی", year: 2016, desc: "مزدوری که به سرطان مبتلا می‌شود و تحت آزمایشی قرار می‌گیرد که قدرت‌های ویژه می‌دهد.", img: "https://picsum.photos/seed/deadpool/400/600" },

      { title: "تلماسه", genre: "علمی-تخیلی", year: 2021, desc: "پسر جوانی در سیاره‌ای بیابانی از خانواده‌اش محافظت می‌کند و سرنوشت بشریت را رقم می‌زند.", img: "https://picsum.photos/seed/dune/400/600" },
      { title: "همه چیز همه جا یکباره", genre: "علمی-تخیلی", year: 2022, desc: "زنی میانسال می‌تواند به جهان‌های موازی سفر کند تا دنیا را نجات دهد.", img: "https://picsum.photos/seed/everything/400/600" },
      { title: "باربی", genre: "کمدی", year: 2023, desc: "باربی و کن دنیای واقعی را تجربه می‌کنند.", img: "https://picsum.photos/seed/barbie/400/600" },
      { title: "اوپنهایمر", genre: "درام", year: 2023, desc: "داستان زندگی جی. رابرت اوپنهایمر، پدر بمب اتم.", img: "https://picsum.photos/seed/oppenheimer/400/600" }
    ];

    let currentGenre = 'all';
    let searchTerm = '';
    let favorites = JSON.parse(localStorage.getItem('fav_movies') || '[]');

    // ==================== ژانرها ====================
    const genres = [...new Set(movies.map(m => m.genre))].sort();
    genres.unshift('all');

    function renderGenres() {
      const container = document.getElementById('genreFilter');
      container.innerHTML = genres.map(g => 
        `<button class="genre-btn ${g === currentGenre ? 'active' : ''}" onclick="setGenre('${g}')">${g === 'all' ? 'همه' : g}</button>`
      ).join('');
    }

    function filterMovies() {
      searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = movies;
      if (currentGenre !== 'all') {
        filtered = filtered.filter(m => m.genre === currentGenre);
      }
      if (searchTerm) {
        filtered = filtered.filter(m => m.title.toLowerCase().includes(searchTerm));
      }
      renderMovies(filtered);
    }

    function renderMovies(list) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">فیلمی پیدا نشد.</p>';
        return;
      }
      list.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${movie.img}" alt="${movie.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x600?text=بدون+پوستر'">
          <div class="card-body">
            <h3>${movie.title}</h3>
            <span class="year">${movie.year} | ${movie.genre}</span>
          </div>
        `;
        card.addEventListener('click', () => showDetail(movie));
        grid.appendChild(card);
      });
    }

    function setGenre(genre) {
      currentGenre = genre;
      document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.genre-btn[onclick="setGenre('${genre}')"]`).classList.add('active');
      filterMovies();
    }

    function showDetail(movie) {
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('detailContent');
      const isFav = favorites.includes(movie.title);
      content.innerHTML = `
        <img src="${movie.img}" alt="${movie.title}">
        <h2>${movie.title}</h2>
        <div class="meta">
          <span>${movie.year}</span>
          <span>${movie.genre}</span>
        </div>
        <p class="desc">${movie.desc}</p>
        <button class="fav-btn" id="favToggle">${isFav ? '❤️ از علاقه‌مندی‌ها حذف کن' : '🤍 افزودن به علاقه‌مندی‌ها'}</button>
        <button class="close-btn" onclick="closeDetail()">بستن</button>
      `;
      modal.style.display = 'flex';
      document.getElementById('favToggle').addEventListener('click', () => {
        toggleFavorite(movie.title);
        showDetail(movie); // refresh modal
      });
    }

    function closeDetail() {
      document.getElementById('detailModal').style.display = 'none';
    }

    function toggleFavorite(title) {
      if (favorites.includes(title)) {
        favorites = favorites.filter(f => f !== title);
      } else {
        favorites.push(title);
      }
      localStorage.setItem('fav_movies', JSON.stringify(favorites));
    }

    function showFavorites() {
      currentGenre = 'all';
      searchTerm = '';
      document.getElementById('searchInput').value = '';
      renderGenres();
      const favMovies = movies.filter(m => favorites.includes(m.title));
      renderMovies(favMovies);
    }

    function resetFilters() {
      currentGenre = 'all';
      searchTerm = '';
      document.getElementById('searchInput').value = '';
      renderGenres();
      filterMovies();
    }

    // ==================== حالت تاریک ====================
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('film_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }
    if (localStorage.getItem('film_theme') === 'light') document.body.classList.add('light-mode');

    // ==================== راه‌اندازی ====================
    function init() {
      renderGenres();
      filterMovies();
      // جستجو با Enter
      document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') filterMovies();
      });
      // بستن مودال با کلیک بیرون
      window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailModal')) closeDetail();
      });
    }
    init();
  </script>
</body>
</html>
