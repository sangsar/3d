<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جملات ناب | Samisaki</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(20, 10, 40, 0.8);
            --pink: #ff99c8;
            --purple: #b388eb;
            --gold: #f5c518;
            --text: #e0d6ff;
            --shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            direction: rtl;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        .particles {
            position: fixed; top:0; left:0; width:100%; height:100%;
            pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute; border-radius: 50%;
            background: var(--pink);
            box-shadow: 0 0 15px var(--pink), 0 0 30px var(--purple);
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0%,100% { transform: translateY(0) scale(1); opacity:0.6; }
            50% { transform: translateY(-30px) scale(1.3); opacity:1; }
        }
        .container {
            position: relative; z-index: 1;
            max-width: 650px;
            width: 100%;
            margin: 80px 0 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 15px 25px;
            box-shadow: var(--shadow);
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 650px;
            z-index: 100;
        }
        .header h2 {
            font-size: 1.2rem;
            color: var(--gold);
            margin: 0;
        }
        .hamburger {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--pink);
            color: var(--pink);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .hamburger:hover { background: var(--pink); color: #0a0a0c; }
        .quote-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .quote-item {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .quote-item:hover {
            border-color: var(--pink);
            box-shadow: 0 0 20px rgba(255,153,200,0.2);
        }
        .quote-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .quote-item-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #fff;
        }
        .quote-item-author {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 500;
        }
        .item-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .mini-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.08);
            color: #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .mini-btn:hover {
            background: var(--pink);
            color: #0a0a0c;
            border-color: var(--pink);
            transform: scale(1.1);
        }
        .mini-btn.heart { color: #ff6b6b; }
        .mini-btn.heart.liked { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }
        .mini-btn.delete { color: #ff8888; }
        .mini-btn.remove { color: #aaa; }
        .mini-btn.remove:hover { background: #ff4444; color: #fff; border-color: #ff4444; }
        .sidebar {
            position: fixed;
            top: 0; right: -320px;
            width: 300px; height: 100vh;
            background: rgba(10,10,12,0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 999;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 80px 20px 30px;
            gap: 14px;
            overflow-y: auto;
        }
        .sidebar.open { right: 0; }
        .sidebar-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            padding: 12px 18px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .sidebar-btn:hover, .sidebar-btn.active {
            background: var(--pink);
            color: #0a0a0c;
            border-color: var(--pink);
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        @media (max-width: 600px) {
            .header { padding: 12px 18px; }
            .header h2 { font-size: 1rem; }
            .quote-item { padding: 12px 14px; }
            .quote-item-text { font-size: 0.85rem; }
            .mini-btn { width: 24px; height: 24px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particlesContainer"></div>
    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <button class="sidebar-btn active" data-category="all">📜 همه</button>
        <button class="sidebar-btn" data-category="famous">🌟 بزرگان (۱-۳۰۰)</button>
        <button class="sidebar-btn" data-category="book">📚 تکه کتاب (۳۰۱-۶۰۰)</button>
        <button class="sidebar-btn" data-category="dialogue">🎬 دیالوگ (۶۰۱-۹۰۰)</button>
        <button class="sidebar-btn" data-category="psychology">🧠 روانشناسی و فلسفه (۹۰۱-۱۰۰۰)</button>
        <button class="sidebar-btn" data-category="favorites">❤️ علاقه‌مندی‌ها</button>
        <button class="sidebar-btn" data-category="blacklist">🚫 لیست سیاه</button>
        <button class="sidebar-btn" id="clearBlacklistBtn" style="background:rgba(255,100,100,0.2); border-color:#ff4444; color:#ff8888;">🗑️ پاک‌کردن لیست سیاه</button>
    </div>

    <div class="header">
        <h2>✨ جملات ناب</h2>
        <button class="hamburger" id="hamburgerBtn">☰</button>
    </div>

    <div class="container">
        <div class="quote-list" id="quoteList"></div>
    </div>

    <script src="quotes.js"></script>
    <script>
        // ==================== مدیریت داده‌ها ====================
        let blacklist = JSON.parse(localStorage.getItem('quoteBlacklist')) || [];
        let favorites = JSON.parse(localStorage.getItem('quoteFavorites')) || [];
        let currentCategory = 'all';
        let visibleQuotes = [];

        function saveData() {
            localStorage.setItem('quoteBlacklist', JSON.stringify(blacklist));
            localStorage.setItem('quoteFavorites', JSON.stringify(favorites));
        }

        function getAvailableQuotes() {
            let pool = [];
            switch(currentCategory) {
                case 'famous': pool = quotes.filter(q => q.id >= 1 && q.id <= 300); break;
                case 'book': pool = quotes.filter(q => q.id >= 301 && q.id <= 600); break;
                case 'dialogue': pool = quotes.filter(q => q.id >= 601 && q.id <= 900); break;
                case 'psychology': pool = quotes.filter(q => q.id >= 901 && q.id <= 1000); break;
                case 'favorites': pool = quotes.filter(q => favorites.includes(q.id) && !blacklist.includes(q.id)); break;
                case 'blacklist': pool = quotes.filter(q => blacklist.includes(q.id)); break;
                default: pool = quotes.filter(q => !blacklist.includes(q.id));
            }
            return pool;
        }

        function refreshVisibleQuotes() {
            const pool = getAvailableQuotes();
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            visibleQuotes = shuffled.slice(0, 100);
        }

        function replaceQuote(oldId) {
            const pool = getAvailableQuotes();
            const usedIds = visibleQuotes.map(q => q.id);
            const available = pool.filter(q => !usedIds.includes(q.id) && q.id !== oldId);
            if (available.length > 0) {
                const randomIndex = Math.floor(Math.random() * available.length);
                const idx = visibleQuotes.findIndex(q => q.id === oldId);
                if (idx > -1) visibleQuotes[idx] = available[randomIndex];
            }
        }

        function renderQuotes() {
            const container = document.getElementById('quoteList');
            container.innerHTML = '';
            if (visibleQuotes.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#aaa; padding:40px;">جمله‌ای برای نمایش وجود ندارد.</div>';
                return;
            }
            visibleQuotes.forEach((q) => {
                const item = document.createElement('div');
                item.className = 'quote-item';
                item.setAttribute('data-id', q.id);
                const isFav = favorites.includes(q.id);
                item.innerHTML = `
                    <div class="quote-content">
                        <div class="quote-item-text">"${q.text}"</div>
                        <div class="quote-item-author">— ${q.author}</div>
                    </div>
                    <div class="item-buttons">
                        <button class="mini-btn heart ${isFav ? 'liked' : ''}" data-action="heart" title="علاقه‌مندی">${isFav ? '❤️' : '🤍'}</button>
                        <button class="mini-btn remove" data-action="remove" title="حذف از لیست">✕</button>
                        <button class="mini-btn delete" data-action="delete" title="حذف دائمی">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });

            // رویدادهای دکمه‌ها
            document.querySelectorAll('.quote-item').forEach(item => {
                const qid = parseInt(item.getAttribute('data-id'));
                item.querySelector('[data-action="heart"]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = favorites.indexOf(qid);
                    if (idx > -1) favorites.splice(idx, 1);
                    else favorites.push(qid);
                    saveData();
                    renderQuotes();
                });
                item.querySelector('[data-action="remove"]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    visibleQuotes = visibleQuotes.filter(q => q.id !== qid);
                    replaceQuote(qid);
                    renderQuotes();
                });
                item.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!blacklist.includes(qid)) blacklist.push(qid);
                    saveData();
                    visibleQuotes = visibleQuotes.filter(q => q.id !== qid);
                    if (currentCategory === 'blacklist') refreshVisibleQuotes();
                    else replaceQuote(qid);
                    renderQuotes();
                });
            });
        }

        function updateUI() {
            document.querySelectorAll('.sidebar-btn[data-category]').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-category') === currentCategory) btn.classList.add('active');
            });
        }

        // ==================== سایدبار ====================
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        document.getElementById('hamburgerBtn').addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });

        document.querySelectorAll('.sidebar-btn[data-category]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.getAttribute('data-category');
                refreshVisibleQuotes();
                renderQuotes();
                updateUI();
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            });
        });

        document.getElementById('clearBlacklistBtn').addEventListener('click', () => {
            if (confirm('آیا مطمئنید که می‌خواهید لیست سیاه را پاک کنید؟')) {
                blacklist = [];
                saveData();
                refreshVisibleQuotes();
                renderQuotes();
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        });

        // ==================== ذرات پس‌زمینه ====================
        const particlesContainer = document.getElementById('particlesContainer');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 6 + 3;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.top = Math.random() * 100 + '%';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 8 + 's';
            particlesContainer.appendChild(p);
        }

        // ==================== راه‌اندازی ====================
        refreshVisibleQuotes();
        renderQuotes();
        updateUI();
    </script>
</body>
</html>
