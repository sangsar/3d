<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل‌قول‌های ماندگار | سینمای کلمات</title>
    <link href="https://cdn.jsdelivr.net/gh/vhidvz/iransans@latest/fonts/IRANSansWeb(FaNum).woff2" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --gold: #c9a84c;
            --gold-light: #e0c97f;
            --text: #e0d5c1;
            --text-dim: #8a8070;
            --red: #c0392b;
            --red-light: #e74c3c;
            --heart: #e74c3c;
            --glass: rgba(20, 18, 30, 0.75);
            --border: rgba(201, 168, 76, 0.15);
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            --radius: 18px;
            --transition: 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSansWeb(FaNum)', 'Tahoma', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(201, 168, 76, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 90%, rgba(180, 130, 50, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(100, 80, 60, 0.03) 0%, transparent 80%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.8;
            position: relative;
        }

        /* floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 8s infinite;
        }
        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1.5);
            }
        }

        /* header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .category-badge {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--gold-light);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        .hamburger {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--gold);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
            z-index: 200;
        }
        .hamburger:hover {
            background: rgba(201, 168, 76, 0.15);
            border-color: var(--gold);
        }

        /* sidebar overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -380px;
            width: 360px;
            max-width: 85vw;
            height: 100vh;
            background: rgba(15, 13, 22, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--border);
            z-index: 160;
            padding: 30px 24px;
            overflow-y: auto;
            transition: right 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .sidebar.active {
            right: 0;
        }
        .sidebar h3 {
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 1px;
        }
        .sidebar .section-title {
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 12px;
            padding-right: 8px;
        }
        .sidebar button,
        .sidebar .menu-link {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 13px 18px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            text-align: right;
        }
        .sidebar button:hover,
        .sidebar .menu-link:hover {
            background: rgba(201, 168, 76, 0.08);
            border-color: var(--border);
            color: var(--gold-light);
        }
        .sidebar button.active-cat {
            background: rgba(201, 168, 76, 0.12);
            border-color: var(--gold);
            color: var(--gold);
            font-weight: bold;
        }
        .sidebar .icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }
        .danger-btn {
            color: var(--red-light) !important;
            border-color: rgba(231, 76, 60, 0.3) !important;
        }
        .danger-btn:hover {
            background: rgba(231, 76, 60, 0.1) !important;
            border-color: var(--red) !important;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .sidebar .close-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        /* main grid */
        .main-container {
            position: relative;
            z-index: 1;
            padding: 30px 20px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .quotes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        @media (max-width: 700px) {
            .quotes-grid {
                grid-template-columns: 1fr;
            }
            .header {
                padding: 10px 14px;
            }
            .logo {
                font-size: 1.2rem;
            }
        }

        /* quote card */
        .quote-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeInUp 0.6s ease backwards;
            cursor: default;
        }
        .quote-card:hover {
            border-color: rgba(201, 168, 76, 0.35);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(201, 168, 76, 0.1) inset;
            transform: translateY(-4px);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .quote-text {
            font-size: 1.05rem;
            line-height: 2;
            color: #f0e6d3;
            position: relative;
            padding-right: 8px;
        }
        .quote-text::before {
            content: '«';
            color: var(--gold);
            font-size: 2.5rem;
            position: absolute;
            right: -6px;
            top: -12px;
            opacity: 0.5;
            font-family: serif;
        }
        .quote-author {
            font-size: 0.85rem;
            color: var(--gold-light);
            font-weight: 600;
            margin-top: auto;
        }
        .quote-category {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .card-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .card-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(201, 168, 76, 0.1);
        }
        .card-btn.fav-btn.liked {
            color: var(--heart);
            border-color: var(--heart);
            background: rgba(231, 76, 60, 0.1);
            animation: heartBeat 0.5s ease;
        }
        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.25);
            }
        }
        .card-btn.delete-btn:hover {
            border-color: var(--red);
            color: var(--red-light);
            background: rgba(231, 76, 60, 0.1);
        }

        /* empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            font-size: 1.2rem;
        }
        .empty-state .icon-big {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        /* toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 18, 30, 0.9);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 300;
            backdrop-filter: blur(16px);
            font-size: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-8px);
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(201, 168, 76, 0.25);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="header">
        <div class="logo">🎬 نقل‌قول‌های ماندگار</div>
        <div class="header-actions">
            <span class="category-badge" id="categoryBadge">✨ همه</span>
            <button class="hamburger" id="hamburgerBtn" title="منو">☰</button>
        </div>
    </header>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebar">✕</button>
        <h3>🎭 منوی گنجینه</h3>

        <div class="section-title">📂 دسته‌بندی</div>
        <button class="menu-link active-cat" data-category="all"><span class="icon">📚</span> همه نقل‌قول‌ها</button>
        <button class="menu-link" data-category="famous"><span class="icon">🌟</span> سخنان بزرگان</button>
        <button class="menu-link" data-category="book"><span class="icon">📖</span> تکه‌های کتاب</button>
        <button class="menu-link" data-category="dialogue"><span class="icon">🎬</span> دیالوگ‌های ماندگار</button>
        <button class="menu-link" data-category="philosophy"><span class="icon">🏛️</span> فلسفی</button>
        <button class="menu-link" data-category="psychology"><span class="icon">🧠</span> روانشناسی</button>

        <div class="section-title">❤️ مجموعه‌های من</div>
        <button class="menu-link" id="showFavorites"><span class="icon">❤️</span> علاقه‌مندی‌ها <span id="favCount">(0)</span></button>
        <button class="menu-link" id="showBlacklist"><span class="icon">🚫</span> بلک‌لیست <span id="blacklistCount">(0)</span></button>
        <button class="menu-link danger-btn" id="clearBlacklist"><span class="icon">🔓</span> آزادسازی بلک‌لیست</button>
    </aside>

    <!-- Main Content -->
    <main class="main-container">
        <div class="quotes-grid" id="quotesGrid"></div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Load quotes data -->
    <script src="quotes.js"></script>
    <script>
        (function() {
            // ──────────────────────────────────────
            // DOM refs
            // ──────────────────────────────────────
            const grid = document.getElementById('quotesGrid');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const closeSidebarBtn = document.getElementById('closeSidebar');
            const categoryBadge = document.getElementById('categoryBadge');
            const toast = document.getElementById('toast');
            const favCountEl = document.getElementById('favCount');
            const blacklistCountEl = document.getElementById('blacklistCount');
            const showFavoritesBtn = document.getElementById('showFavorites');
            const showBlacklistBtn = document.getElementById('showBlacklist');
            const clearBlacklistBtn = document.getElementById('clearBlacklist');
            const particlesContainer = document.getElementById('particles');

            // ──────────────────────────────────────
            // State
            // ──────────────────────────────────────
            const STORAGE_KEY = 'cinema_quotes_app';
            let currentCategory = 'all';
            let displayedIds = [];
            let blacklist = new Set();
            let favorites = new Set();
            let allQuotes = [];

            // Initialize allQuotes from loaded quotes.js
            if (typeof quotes !== 'undefined' && Array.isArray(quotes)) {
                allQuotes = [...quotes];
            } else {
                allQuotes = [];
                console.error('فایل quotes.js بارگذاری نشده است.');
            }

            // ──────────────────────────────────────
            // Load / Save state
            // ──────────────────────────────────────
            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data.blacklist) blacklist = new Set(data.blacklist);
                        if (data.favorites) favorites = new Set(data.favorites);
                        if (data.currentCategory) currentCategory = data.currentCategory;
                        if (data.displayedIds) displayedIds = data.displayedIds;
                    }
                } catch (e) {
                    console.warn('خطا در خواندن localStorage:', e);
                }
            }

            function saveState() {
                try {
                    const data = {
                        blacklist: [...blacklist],
                        favorites: [...favorites],
                        currentCategory,
                        displayedIds,
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    console.warn('خطا در ذخیره‌سازی:', e);
                }
            }

            // ──────────────────────────────────────
            // Helpers
            // ──────────────────────────────────────
            function getQuotesByCategory(cat) {
                if (cat === 'all') return [...allQuotes];
                return allQuotes.filter(q => q.category === cat);
            }

            function getAvailableQuoteIds(cat) {
                const pool = getQuotesByCategory(cat);
                const poolIds = new Set(pool.map(q => q.id));
                const available = [];
                for (const id of poolIds) {
                    if (!blacklist.has(id) && !displayedIds.includes(id)) {
                        available.push(id);
                    }
                }
                // shuffle
                for (let i = available.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [available[i], available[j]] = [available[j], available[i]];
                }
                return available;
            }

            function findQuoteById(id) {
                return allQuotes.find(q => q.id === id);
            }

            const categoryNames = {
                all: '✨ همه',
                famous: '🌟 سخنان بزرگان',
                book: '📖 تکه‌های کتاب',
                dialogue: '🎬 دیالوگ‌های ماندگار',
                philosophy: '🏛️ فلسفی',
                psychology: '🧠 روانشناسی',
                favorites: '❤️ علاقه‌مندی‌ها',
                blacklist: '🚫 بلک‌لیست',
            };

            // ──────────────────────────────────────
            // Toast
            // ──────────────────────────────────────
            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            // ──────────────────────────────────────
            // Initialize displayed IDs
            // ──────────────────────────────────────
            function initDisplayedIds(cat) {
                const available = getAvailableQuoteIds(cat);
                const count = Math.min(100, available.length);
                displayedIds = available.slice(0, count);
            }

            function refillDisplayedIds(cat) {
                const needed = 100 - displayedIds.length;
                if (needed <= 0) return;
                const available = getAvailableQuoteIds(cat);
                const toAdd = available.slice(0, needed);
                displayedIds.push(...toAdd);
            }

            // ──────────────────────────────────────
            // Render
            // ──────────────────────────────────────
            function renderGrid() {
                grid.innerHTML = '';
                if (displayedIds.length === 0) {
                    const emptyMsg = currentCategory === 'favorites' ?
                        '❤️ هنوز نقل‌قولی به علاقه‌مندی‌ها اضافه نکردی.' :
                        currentCategory === 'blacklist' ?
                        '🚫 بلک‌لیست خالی است. نقل‌قول‌ها را آزاد کن.' :
                        '📭 نقل‌قولی برای نمایش وجود ندارد.';
                    grid.innerHTML = `<div class="empty-state"><span class="icon-big">${currentCategory==='favorites'?'💔':currentCategory==='blacklist'?'🕊️':'🎭'}</span>${emptyMsg}</div>`;
                    return;
                }

                const fragment = document.createDocumentFragment();
                displayedIds.forEach((id, index) => {
                    const quote = findQuoteById(id);
                    if (!quote) return;
                    const isFav = favorites.has(id);
                    const card = document.createElement('div');
                    card.className = 'quote-card';
                    card.style.animationDelay = `${(index % 20) * 0.03}s`;
                    card.innerHTML = `
                        <div class="quote-text">${escapeHTML(quote.text)}</div>
                        <div class="quote-author">— ${escapeHTML(quote.author)}</div>
                        <div class="quote-category">📂 ${categoryNames[quote.category] || quote.category}</div>
                        <div class="card-actions">
                            <button class="card-btn fav-btn ${isFav ? 'liked' : ''}" data-id="${id}" title="${isFav ? 'حذف از علاقه‌مندی‌ها' : 'افزودن به علاقه‌مندی‌ها'}">
                                ${isFav ? '❤️' : '🤍'}
                            </button>
                            <button class="card-btn delete-btn" data-id="${id}" title="حذف و انتقال به بلک‌لیست">🗑️</button>
                        </div>
                    `;
                    fragment.appendChild(card);
                });
                grid.appendChild(fragment);
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updateCounts() {
                favCountEl.textContent = `(${favorites.size})`;
                blacklistCountEl.textContent = `(${blacklist.size})`;
            }

            function updateBadge() {
                categoryBadge.textContent = categoryNames[currentCategory] || '✨ همه';
            }

            function updateSidebarActive() {
                document.querySelectorAll('.sidebar button[data-category]').forEach(btn => {
                    btn.classList.toggle('active-cat', btn.dataset.category === currentCategory);
                });
            }

            // ──────────────────────────────────────
            // Actions
            // ──────────────────────────────────────
            function switchCategory(cat) {
                if (cat === 'favorites') {
                    currentCategory = 'favorites';
                    displayedIds = [...favorites];
                    updateBadge();
                    updateSidebarActive();
                    renderGrid();
                    updateCounts();
                    closeSidebar();
                    saveState();
                    return;
                }
                if (cat === 'blacklist') {
                    currentCategory = 'blacklist';
                    displayedIds = [...blacklist];
                    updateBadge();
                    updateSidebarActive();
                    renderGrid();
                    updateCounts();
                    closeSidebar();
                    saveState();
                    return;
                }
                currentCategory = cat;
                initDisplayedIds(cat);
                refillDisplayedIds(cat);
                updateBadge();
                updateSidebarActive();
                renderGrid();
                updateCounts();
                closeSidebar();
                saveState();
            }

            function toggleFavorite(id) {
                if (favorites.has(id)) {
                    favorites.delete(id);
                    showToast('🤍 از علاقه‌مندی‌ها حذف شد');
                } else {
                    favorites.add(id);
                    showToast('❤️ به علاقه‌مندی‌ها اضافه شد');
                }
                updateCounts();
                if (currentCategory === 'favorites') {
                    displayedIds = [...favorites];
                }
                renderGrid();
                saveState();
            }

            function deleteQuote(id) {
                if (blacklist.has(id)) return;
                // Remove from displayed
                displayedIds = displayedIds.filter(did => did !== id);
                // Add to blacklist
                blacklist.add(id);
                // Also remove from favorites if present
                favorites.delete(id);
                // Refill
                refillDisplayedIds(currentCategory === 'favorites' ? 'all' : currentCategory);
                if (currentCategory === 'favorites') {
                    displayedIds = [...favorites];
                }
                if (currentCategory === 'blacklist') {
                    displayedIds = [...blacklist];
                }
                updateCounts();
                renderGrid();
                saveState();
                showToast('🗑️ نقل‌قول به بلک‌لیست منتقل شد و جایگزین گردید');
            }

            function clearBlacklistAction() {
                if (blacklist.size === 0) {
                    showToast('🚫 بلک‌لیست در حال حاضر خالی است');
                    return;
                }
                const count = blacklist.size;
                blacklist.clear();
                if (currentCategory === 'blacklist') {
                    displayedIds = [];
                }
                if (currentCategory !== 'favorites' && currentCategory !== 'blacklist') {
                    initDisplayedIds(currentCategory);
                    refillDisplayedIds(currentCategory);
                }
                updateCounts();
                renderGrid();
                saveState();
                showToast(`🔓 ${count} نقل‌قول از بلک‌لیست آزاد شدند`);
            }

            // ──────────────────────────────────────
            // Event delegation
            // ──────────────────────────────────────
            grid.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const id = parseInt(btn.dataset.id);
                if (isNaN(id)) return;
                if (btn.classList.contains('fav-btn')) {
                    toggleFavorite(id);
                } else if (btn.classList.contains('delete-btn')) {
                    deleteQuote(id);
                }
            });

            // Sidebar category buttons
            document.querySelectorAll('.sidebar button[data-category]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.dataset.category;
                    switchCategory(cat);
                });
            });

            // Show favorites / blacklist
            showFavoritesBtn.addEventListener('click', () => switchCategory('favorites'));
            showBlacklistBtn.addEventListener('click', () => switchCategory('blacklist'));
            clearBlacklistBtn.addEventListener('click', clearBlacklistAction);

            // Hamburger / sidebar
            function openSidebar() {
                sidebar.classList.add('active');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
            hamburgerBtn.addEventListener('click', openSidebar);
            closeSidebarBtn.addEventListener('click', closeSidebar);
            overlay.addEventListener('click', closeSidebar);

            // Close sidebar with Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sidebar.classList.contains('active')) {
                    closeSidebar();
                }
            });

            // ──────────────────────────────────────
            // Particles
            // ──────────────────────────────────────
            function createParticles() {
                const count = 25;
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = Math.random() * 3 + 1.5;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 10 + 's';
                    p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                    particlesContainer.appendChild(p);
                }
            }

            // ──────────────────────────────────────
            // Init
            // ──────────────────────────────────────
            function init() {
                createParticles();
                loadState();
                if (displayedIds.length === 0 && currentCategory !== 'favorites' && currentCategory !==
                    'blacklist') {
                    initDisplayedIds(currentCategory);
                    refillDisplayedIds(currentCategory);
                }
                if (currentCategory === 'favorites') {
                    displayedIds = [...favorites];
                }
                if (currentCategory === 'blacklist') {
                    displayedIds = [...blacklist];
                }
                updateBadge();
                updateCounts();
                updateSidebarActive();
                renderGrid();
                saveState();
            }

            init();
        })();
    </script>
</body>
</html>
