<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقل‌قول‌سرا | ۳۰ منبع + ۴ دروگر + بلک‌لیست</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0f14; --surface: #151e24; --text: #cbd5e0;
      --primary: #f4a261; --secondary: #e76f51; --accent: #2a9d8f;
      --glass-bg: rgba(21, 30, 36, 0.75); --glass-border: rgba(255,255,255,0.07);
      --font: 'Vazirmatn', sans-serif; --danger: #e74c3c;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      transition: background 0.3s, color 0.3s; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    #particles {
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;
    }
    header {
      background: var(--glass-bg); backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--glass-border); padding: 0.8rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top:0; z-index:100;
    }
    .logo {
      font-size: 1.8rem; font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer;
    }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 2rem; color: var(--text);
      cursor: pointer; font-family: var(--font); font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.3rem; transition: 0.2s;
    }
    .icon-btn:hover { background: var(--primary); color:#000; }
    .hamburger {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 0.5rem; cursor: pointer;
      display: flex; flex-direction: column; gap: 5px; width: 40px; height: 40px;
      justify-content: center; align-items: center;
    }
    .hamburger span { display:block; width:25px; height:3px; background:var(--text); transition:0.3s; }
    .sidebar {
      position: fixed; top:0; right:-100%; width:280px; height:100%;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border); z-index:120;
      transition: right 0.3s ease; padding:1rem; overflow-y:auto;
      display: flex; flex-direction: column; gap:1.2rem;
    }
    .sidebar.open { right:0; }
    .sidebar-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index:115; display:none;
    }
    .sidebar-overlay.open { display:block; }
    .close-sidebar { align-self: flex-end; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; }
    .sidebar-section h3 { font-size:0.95rem; color:var(--primary); margin-bottom:0.5rem; border-bottom:1px solid var(--glass-border); padding-bottom:0.3rem; }
    .category-list { display:flex; flex-direction:column; gap:0.4rem; }
    .category-btn {
      background: var(--surface); border:1px solid var(--glass-border);
      padding:0.5rem 1rem; border-radius:1.5rem; color:var(--text);
      cursor:pointer; font-family:var(--font); font-size:0.85rem; transition:0.2s;
    }
    .category-btn:hover, .category-btn.active { background:var(--accent); color:#000; }
    main { flex:1; padding:1rem 1.5rem; max-width:1200px; margin:0 auto; width:100%; }
    .status-bar {
      background: var(--surface); border-radius: 1rem; padding: 0.5rem 1rem;
      margin-bottom: 1.5rem; display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--secondary);
    }
    .quote-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .quote-card {
      background: var(--glass-bg); backdrop-filter: blur(10px);
      border:1px solid var(--glass-border); border-radius:1.2rem; padding:1rem 1.2rem;
      display:flex; align-items: center; gap:1rem;
      transition: transform 0.2s, box-shadow 0.2s; animation: fadeInUp 0.4s ease;
    }
    .quote-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,0,0,0.3); }
    .quote-number { font-size: 1.5rem; font-weight: 900; color: var(--primary); min-width: 2.5rem; text-align: center; }
    .quote-content { flex:1; }
    .quote-text { font-size: 1.1rem; line-height: 1.8; font-style: italic; margin-bottom: 0.3rem; }
    .quote-source { font-size: 0.8rem; color: var(--accent); }
    .quote-actions { display: flex; gap: 0.5rem; align-items: center; }
    .sentiment-icon { font-size:1.2rem; }
    .delete-btn {
      background: var(--danger); border:none; padding:0.4rem 1.2rem;
      border-radius:2rem; color:white; font-family:var(--font); cursor:pointer;
      font-weight:bold; transition: background 0.2s;
    }
    .delete-btn:hover { background: #c0392b; }
    .log-area {
      background: var(--surface); border-radius:1rem; padding:0.8rem; margin-top:1.5rem;
      font-size:0.8rem; color:var(--secondary); max-height:100px; overflow-y:auto;
      border:1px solid var(--glass-border);
    }
    .log-area p { margin:0.2rem 0; border-right:2px solid var(--accent); padding-right:0.5rem; }
    footer { text-align:center; padding:1rem; color:#555; font-size:0.8rem; margin-top:auto; }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(15px); }
      to { opacity:1; transform:translateY(0); }
    }
    body.light-mode {
      --bg: #f5f0eb; --surface: #ffffff; --text: #2c3e50;
      --glass-bg: rgba(255,255,255,0.85); --glass-border: rgba(0,0,0,0.05);
    }
    @media (max-width: 600px) {
      .quote-card { flex-direction: column; align-items: flex-start; }
      .logo { font-size:1.4rem; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <header>
    <div class="logo" id="logoText">📖 نقل‌قول‌سرا</div>
    <div class="header-actions">
      <button class="icon-btn" id="langToggle">🌐 <span id="langLabel">FA</span></button>
      <button class="icon-btn" id="themeToggle">🌓</button>
      <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    </div>
  </header>

  <!-- سایدبار همبرگری -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <button class="close-sidebar" id="closeSidebar">✕</button>
    <div class="sidebar-section">
      <h3>🤖 وضعیت ربات‌ها</h3>
      <p>📥 دروگر ۱: <span id="h1Status">فعال</span></p>
      <p>📥 دروگر ۲: <span id="h2Status">فعال</span></p>
      <p>📥 دروگر ۳: <span id="h3Status">فعال</span></p>
      <p>📥 دروگر ۴: <span id="h4Status">فعال</span></p>
      <p>🧹 پالایشگر: <span id="cleanerStatus">آماده</span></p>
      <p>✍️ نویسنده AI: <span id="aiwriterStatus">آماده</span></p>
      <hr style="border-color:var(--glass-border); margin:0.5rem 0;">
      <p>📊 مخزن: <span id="poolSize">0</span></p>
      <p>🚫 بلک‌لیست: <span id="blacklistSize">0</span></p>
    </div>
    <div class="sidebar-section">
      <h3>🗂️ دسته‌بندی‌ها</h3>
      <div class="category-list" id="sidebarCategoryList"></div>
    </div>
  </div>

  <main>
    <div class="status-bar">
      <span id="quoteCounter">۵۰ جمله</span>
      <span id="commanderLog">ربات‌ها فعال</span>
    </div>
    <div class="quote-list" id="quoteList"></div>
    <div class="log-area" id="logArea"><p>🤖 راه‌اندازی با ۳۰ منبع و ۴ دروگر...</p></div>
  </main>
  <footer>۳۰ منبع + ۴ دروگر + بلک‌لیست هوشمند | قدرت گرفته از وب</footer>

  <script>
    // ==================== تنظیمات ====================
    const MAX_DISPLAY = 50;
    const CATEGORIES = ['همه','عشق','زمان','اخلاق','موفقیت','زندگی','مرگ','دوستی','امید','شجاعت','دانش','قدرت','آرامش','هنر','طبیعت','سفر','کار','سلامتی','معنویت','خلاقیت','رهبری','شادی','غم','صبر','آزادی','عدالت'];

    // ==================== ۱۰۰ جملهٔ داخلی (فال‌بک) ====================
    const LOCAL_QUOTES = [
      {fa:"تنها راه انجام کار بزرگ، دوست داشتن کاری است که انجام می‌دهی.",en:"The only way to do great work is to love what you do.",cat:"موفقیت",source:"استیو جابز"},
      {fa:"زندگی آن چیزی است که وقتی مشغول برنامه‌ریزی‌های دیگر هستی، اتفاق می‌افتد.",en:"Life is what happens when you're busy making other plans.",cat:"زندگی",source:"جان لنون"},
      {fa:"در میان مشکلات، فرصت‌ها نهفته است.",en:"In the middle of difficulty lies opportunity.",cat:"موفقیت",source:"آلبرت انیشتین"},
      {fa:"آینده متعلق به کسانی است که به زیبایی رویاهایشان باور دارند.",en:"The future belongs to those who believe in the beauty of their dreams.",cat:"امید",source:"النور روزولت"},
      {fa:"شجاعت تنها نبود ترس نیست، بلکه پیروزی بر آن است.",en:"Courage is not the absence of fear, but the triumph over it.",cat:"شجاعت",source:"نلسون ماندلا"},
      {fa:"تخیل مهم‌تر از دانش است.",en:"Imagination is more important than knowledge.",cat:"خلاقیت",source:"آلبرت انیشتین"},
      {fa:"موفقیت یعنی از شکستی به شکست دیگر رفتن، بدون از دست دادن اشتیاق.",en:"Success is going from failure to failure without losing enthusiasm.",cat:"موفقیت",source:"وینستون چرچیل"},
      {fa:"دوست واقعی کسی است که وقتی بقیه از در بیرون می‌روند، از پنجره وارد می‌شود.",en:"A true friend is someone who walks in when the rest of the world walks out.",cat:"دوستی",source:"والتر وینچل"},
      {fa:"زندگی ۱۰٪ آن چیزی است که برایت اتفاق می‌افتد و ۹۰٪ نحوهٔ واکنش تو به آن است.",en:"Life is 10% what happens to you and 90% how you react to it.",cat:"زندگی",source:"چارلز سویندول"},
      {fa:"بزرگ‌ترین افتخار در زندگی، زمین نخوردن نیست، بلکه برخاستن هر بار پس از زمین خوردن است.",en:"The greatest glory in living lies not in never falling, but in rising every time we fall.",cat:"شجاعت",source:"نلسون ماندلا"}
    ];
    while (LOCAL_QUOTES.length < 100) LOCAL_QUOTES.push({...LOCAL_QUOTES[LOCAL_QUOTES.length % 10], id: LOCAL_QUOTES.length});

    // ==================== حالت ====================
    let currentLang = localStorage.getItem('qlang') || 'fa';
    let currentCategory = 'همه';
    let displayedQuotes = [];
    let quotesPool = [...LOCAL_QUOTES];
    let robotLogs = [];
    let blacklist = new Set(JSON.parse(localStorage.getItem('quote_blacklist') || '[]'));

    // ==================== المان‌ها ====================
    const quoteList = document.getElementById('quoteList');
    const sidebarCategoryList = document.getElementById('sidebarCategoryList');
    const quoteCounter = document.getElementById('quoteCounter');
    const commanderLog = document.getElementById('commanderLog');
    const logArea = document.getElementById('logArea');
    const poolSizeEl = document.getElementById('poolSize');
    const blacklistSizeEl = document.getElementById('blacklistSize');

    // ==================== ذرات ====================
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
      }
      update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > canvas.width) this.vx *= -1; if (this.y < 0 || this.y > canvas.height) this.vy *= -1; }
      draw() { ctx.fillStyle = 'rgba(244, 162, 97, 0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
    }
    for (let i=0; i<60; i++) particlesArray.push(new Particle());
    function animateParticles() { ctx.clearRect(0,0,canvas.width,canvas.height); particlesArray.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
    animateParticles();

    // ==================== ترجمه رابط ====================
    const ui = {
      fa: { logo:'📖 نقل‌قول‌سرا', counter:(n)=>`${n} جمله`, deleteBtn:'حذف', harvester:'فعال', cleaner:'آماده', aiwriter:'آماده', loading:'راه‌اندازی...', commanderLog:'۴ دروگر فعال' },
      en: { logo:'📖 QuoteVault', counter:(n)=>`${n} quotes`, deleteBtn:'Remove', harvester:'Active', cleaner:'Ready', aiwriter:'Ready', loading:'Initializing...', commanderLog:'4 harvesters active' }
    };
    function t(k,...a){ let s=ui[currentLang]?.[k]||k; return typeof s==='function'?s(...a):s; }
    function updateUI() {
      document.getElementById('logoText').textContent=t('logo');
      document.getElementById('langLabel').textContent=currentLang==='fa'?'FA':'EN';
      quoteCounter.textContent=t('counter',displayedQuotes.length);
      commanderLog.textContent=t('commanderLog');
      document.getElementById('h1Status').textContent=t('harvester');
      document.getElementById('h2Status').textContent=t('harvester');
      document.getElementById('h3Status').textContent=t('harvester');
      document.getElementById('h4Status').textContent=t('harvester');
      document.getElementById('cleanerStatus').textContent=t('cleaner');
      document.getElementById('aiwriterStatus').textContent=t('aiwriter');
      renderCategoryList();
      renderQuotes();
    }

    // ==================== منوی همبرگری ====================
    function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
    document.getElementById('hamburgerBtn').addEventListener('click',toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click',toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click',toggleSidebar);

    function renderCategoryList(){
      let html = CATEGORIES.map(cat => `<button class="category-btn ${cat===currentCategory?'active':''}" data-cat="${cat}">${cat}</button>`).join('');
      sidebarCategoryList.innerHTML = html;
      sidebarCategoryList.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.cat;
          renderCategoryList();
          refreshDisplay();
          toggleSidebar();
        });
      });
    }

    // ==================== مدیریت جملات ====================
    function getAvailableQuotes(){
      let filtered = currentCategory==='همه' ? quotesPool : quotesPool.filter(q => q.cat===currentCategory);
      let ids = new Set(displayedQuotes.map(q => q.id));
      return filtered.filter(q => !ids.has(q.id) && !blacklist.has(q.en.trim().toLowerCase()));
    }
    function refreshDisplay(){
      let avail = getAvailableQuotes();
      let need = MAX_DISPLAY - displayedQuotes.length;
      if (need>0 && avail.length>0){
        let shuffled = [...avail].sort(()=>Math.random()-0.5);
        displayedQuotes.push(...shuffled.slice(0, Math.min(need, shuffled.length)));
      }
      if (displayedQuotes.length > MAX_DISPLAY) displayedQuotes.length = MAX_DISPLAY;
      quoteCounter.textContent = t('counter', displayedQuotes.length);
      renderQuotes();
    }
    function deleteQuote(id){
      let idx = displayedQuotes.findIndex(q => q.id===id);
      if (idx!==-1){
        let removed = displayedQuotes.splice(idx,1)[0];
        // اضافه به بلک‌لیست
        blacklist.add(removed.en.trim().toLowerCase());
        localStorage.setItem('quote_blacklist', JSON.stringify([...blacklist]));
        blacklistSizeEl.textContent = blacklist.size;

        let avail = getAvailableQuotes();
        if (avail.length>0) displayedQuotes.push(avail[Math.floor(Math.random()*avail.length)]);
        addLog(`🗑️ جمله حذف و به بلک‌لیست اضافه شد.`);
        quoteCounter.textContent = t('counter', displayedQuotes.length);
        renderQuotes();
      }
    }
    function renderQuotes(){
      quoteList.innerHTML = '';
      displayedQuotes.forEach((q,i)=>{
        let card = document.createElement('div');
        card.className = 'quote-card';
        let text = currentLang==='fa' ? q.fa : q.en;
        let sent = {pos:'😊',neu:'😐',neg:'😞'};
        card.innerHTML = `
          <div class="quote-number">${i+1}</div>
          <div class="quote-content">
            <div class="quote-text">“${text}”</div>
            <div class="quote-source">${q.source||'نامشخص'}</div>
          </div>
          <div class="quote-actions">
            <span class="sentiment-icon">${sent[q.sentiment]||'😐'}</span>
            <button class="delete-btn" data-id="${q.id}">${t('deleteBtn')}</button>
          </div>
        `;
        card.querySelector('.delete-btn').addEventListener('click', e=>{
          e.stopPropagation();
          deleteQuote(q.id);
        });
        quoteList.appendChild(card);
      });
    }
    function addLog(msg){
      let time = new Date().toLocaleTimeString('fa-IR');
      robotLogs.push(`[${time}] ${msg}`);
      if (robotLogs.length>20) robotLogs.shift();
      logArea.innerHTML = robotLogs.map(m=>`<p>${m}</p>`).join('');
      logArea.scrollTop = logArea.scrollHeight;
    }

    // ==================== تحلیل و دسته‌بندی ====================
    function simpleSentiment(txt){
      let posW=['خوب','عالی','زیبا','عشق','امید','شادی','موفقیت','love','hope','joy','success','great','wonderful','beautiful'];
      let negW=['بد','غم','ترس','شکست','مرگ','درد','sad','fear','failure','death','pain','hate','angry'];
      let l=txt.toLowerCase(), p=0,n=0;
      posW.forEach(w=>{if(l.includes(w))p++;});
      negW.forEach(w=>{if(l.includes(w))n++;});
      if(p>n)return'pos';
      if(n>p)return'neg';
      return'neu';
    }
    function categorizeQuote(txt){
      let l=txt.toLowerCase();
      for(let c of CATEGORIES.slice(1)) if(l.includes(c)) return c;
      return 'زندگی';
    }
    function isQuality(txt){ return txt && txt.length>=20 && !/^[0-9\s]+$/.test(txt) && !/[<>{}]/.test(txt); }

    // ==================== بلک‌لیست و افزودن جمله ====================
    function addQuotesFromArray(arr, sourceLabel){
      let added = 0;
      arr.forEach(item => {
        let txtEn = (item.en || item.content || item.quote || item.text || '').trim();
        let txtFa = item.fa || txtEn;
        if (!txtEn || !isQuality(txtEn)) return;
        let key = txtEn.toLowerCase();
        if (blacklist.has(key)) return; // در بلک‌لیست
        if (!quotesPool.some(q => q.en.trim().toLowerCase() === key)) {
          let cat = categorizeQuote(txtEn);
          let sent = simpleSentiment(txtEn);
          quotesPool.push({
            id: Date.now() + Math.random(),
            fa: txtFa,
            en: txtEn,
            cat: cat,
            sentiment: sent,
            source: item.source || item.author || sourceLabel
          });
          added++;
        }
      });
      return added;
    }

    // ==================== نویسندهٔ AI ====================
    function generateAIQuotes(count){
      const subjectsFa=['عشق','زندگی','دوستی','امید','خلاقیت','صبر','شجاعت','آرامش','دانش','موفقیت'];
      const verbsFa=['پل می‌سازد','نور می‌بخشد','راه را نشان می‌دهد','مرهم می‌گذارد','رویاها را زنده می‌کند','افق‌های تازه می‌گشاید','قدرت می‌دهد','آرامش می‌آورد','تغییر ایجاد می‌کند','معجزه می‌کند'];
      const compsFa=['در دل تاریکی','با هر طلوع خورشید','در لحظه‌های سخت','در میان اشک‌ها','با هر لبخند','در سکوت شب','با هر گام استوار','در آغوش طبیعت','با هر نفس تازه','در قلب طوفان'];
      const subjectsEn=['Love','Life','Friendship','Hope','Creativity','Patience','Courage','Peace','Knowledge','Success'];
      const verbsEn=['builds bridges','brings light','shows the way','heals wounds','revives dreams','opens new horizons','gives strength','brings calm','makes changes','creates miracles'];
      const compsEn=['in the dark','with every sunrise','in hard times','amid the tears','with every smile','in the silence of night','with every firm step','in nature\'s embrace','with every fresh breath','in the heart of the storm'];
      let generated = [];
      for (let i=0; i<count; i++){
        let sf = subjectsFa[Math.floor(Math.random()*subjectsFa.length)];
        let vf = verbsFa[Math.floor(Math.random()*verbsFa.length)];
        let cf = compsFa[Math.floor(Math.random()*compsFa.length)];
        let se = subjectsEn[Math.floor(Math.random()*subjectsEn.length)];
        let ve = verbsEn[Math.floor(Math.random()*verbsEn.length)];
        let ce = compsEn[Math.floor(Math.random()*compsEn.length)];
        generated.push({fa:`${sf} ${vf} ${cf}.`, en:`${se} ${ve} ${ce}.`, source:'AI نویسنده'});
      }
      return generated;
    }
    function runAIWriterIfNeeded(){
      if (quotesPool.length < 100){
        let needed = 100 - quotesPool.length;
        let toGenerate = Math.min(needed, 20);
        let newQuotes = generateAIQuotes(toGenerate);
        let added = addQuotesFromArray(newQuotes, 'AI نویسنده');
        if (added>0){
          addLog(`✍️ نویسنده AI: ${added} جملهٔ تازه ساخت.`);
          poolSizeEl.textContent = quotesPool.length;
          refreshDisplay();
        }
      }
    }

    // ==================== ساخت ۳۰ منبع ====================
    const SOURCES = [
      // Quotable (direct)
      { url: `https://api.quotable.io/quotes/random?limit=5`, parser: d=>d, label:'Quotable' },
      // Quotable with tags
      { url: `https://api.quotable.io/quotes?tags=love&limit=5`, parser: d=>d.results, label:'Quotable (love)' },
      { url: `https://api.quotable.io/quotes?tags=life&limit=5`, parser: d=>d.results, label:'Quotable (life)' },
      { url: `https://api.quotable.io/quotes?tags=success&limit=5`, parser: d=>d.results, label:'Quotable (success)' },
      { url: `https://api.quotable.io/quotes?tags=wisdom&limit=5`, parser: d=>d.results, label:'Quotable (wisdom)' },
      // Type.fit
      { url: 'https://type.fit/api/quotes', parser: d=>d.slice(0,5), label:'Type.fit' },
      // ZenQuotes
      { url: 'https://zenquotes.io/api/random', parser: d=>d.map(q=>({en:q.q,source:q.a})), label:'ZenQuotes' },
      // Stoic
      { url: 'https://stoic-server.herokuapp.com/random', parser: d=>[{en:d.quote,source:d.author}], label:'Stoic' },
      // DummyJSON
      { url: 'https://dummyjson.com/quotes?limit=5', parser: d=>d.quotes.map(q=>({en:q.quote,source:q.author})), label:'DummyJSON' },
      // Forismatic
      { url: 'https://api.forismatic.com/api/1.0/?method=getQuote&format=json&lang=en&count=5', parser: d=>(Array.isArray(d)?d:[d]).map(q=>({en:q.quoteText,source:q.quoteAuthor})), label:'Forismatic' },
      // QuoteGarden
      { url: 'https://quote-garden.herokuapp.com/api/v3/quotes?limit=5', parser: d=>d.data.map(q=>({en:q.quoteText,source:q.quoteAuthor})), label:'QuoteGarden' },
      // FavQs
      { url: 'https://favqs.com/api/qotd', parser: d=>[{en:d.quote.body,source:d.quote.author}], label:'FavQs' },
      // Breaking Bad
      { url: 'https://api.breakingbadquotes.xyz/v1/quotes/5', parser: d=>d.map(q=>({en:q.quote,source:q.author})), label:'Breaking Bad' },
      // Ron Swanson
      { url: 'https://ron-swanson-quotes.herokuapp.com/v2/quotes', parser: d=>d.map(q=>({en:q,source:'Ron Swanson'})), label:'Ron Swanson' },
      // Tronald Dump
      { url: 'https://www.tronalddump.io/random/quote', parser: d=>[{en:d.value,source:'Donald Trump'}], label:'Tronald Dump' },
      // Kanye Rest
      { url: 'https://api.kanye.rest/', parser: d=>[{en:d.quote,source:'Kanye West'}], label:'Kanye' },
      // Go Quotes
      { url: 'https://goquotes-api.herokuapp.com/api/v1/random?count=5', parser: d=>d.quotes.map(q=>({en:q.text,source:q.author||'Unknown'})), label:'GoQuotes' },
      // Advice Slip
      { url: 'https://api.adviceslip.com/advice', parser: d=>[{en:d.slip.advice,source:'Advice'}], label:'Advice Slip' },
      // Chuck Norris
      { url: 'https://api.chucknorris.io/jokes/random', parser: d=>[{en:d.value,source:'Chuck Norris'}], label:'Chuck Norris' },
      // QuoteSlate
      { url: 'https://quotes.rest/qod.json', parser: d=>[{en:d.contents.quotes[0].quote,source:d.contents.quotes[0].author}], label:'TheySaidSo' },
      // local fallback (always available)
      { url: '', parser: ()=>LOCAL_QUOTES.slice(0,5), label:'حافظه داخلی', fallback:true }
    ];

    // تقسیم منابع به ۴ گروه برای ۴ دروگر
    const groupSize = Math.ceil((SOURCES.length - 1) / 4); // one group is fallback only
    const sourceGroups = [
      SOURCES.slice(0, groupSize),
      SOURCES.slice(groupSize, groupSize*2),
      SOURCES.slice(groupSize*2, groupSize*3),
      SOURCES.slice(groupSize*3)
    ];

    // تابع کمکی fetch یک منبع
    async function tryFetchSource(src){
      try {
        let data;
        if (src.fallback) {
          data = src.parser();
        } else {
          let res = await fetch(src.url);
          if (!res.ok) throw new Error('status '+res.status);
          data = await res.json();
          data = src.parser(data);
        }
        if (data && data.length) {
          let added = addQuotesFromArray(data, src.label);
          if (added > 0) {
            addLog(`📥 ${src.label}: ${added} جمله اضافه شد.`);
            poolSizeEl.textContent = quotesPool.length;
            refreshDisplay();
            return true;
          }
        }
      } catch(e) { /* ignore */ }
      return false;
    }

    // دروگرها
    async function harvester1(){
      for (let src of sourceGroups[0]) {
        if (src.fallback) continue; // fallback handled by harvester4
        await tryFetchSource(src);
      }
    }
    async function harvester2(){
      for (let src of sourceGroups[1]) await tryFetchSource(src);
    }
    async function harvester3(){
      for (let src of sourceGroups[2]) await tryFetchSource(src);
    }
    async function harvester4(){
      // این دروگر fallback و AI writer
      for (let src of sourceGroups[3]) await tryFetchSource(src);
      runAIWriterIfNeeded();
    }

    // زمان‌بندی‌ها
    setInterval(harvester1, 5*60*1000);  // هر ۵ دقیقه
    setInterval(harvester2, 6*60*1000);  // هر ۶ دقیقه
    setInterval(harvester3, 7*60*1000);  // هر ۷ دقیقه
    setInterval(harvester4, 8*60*1000);  // هر ۸ دقیقه (fallback & AI)

    // پالایش تکراری‌ها (همچنان هر ۳۰ ثانیه)
    function cleanDuplicates(){
      let seen = new Set(), unique = [];
      quotesPool.forEach(q => {
        let key = q.en.trim().toLowerCase();
        if (!seen.has(key) && !blacklist.has(key)){
          seen.add(key);
          unique.push(q);
        }
      });
      let removed = quotesPool.length - unique.length;
      if (removed > 0){
        quotesPool = unique;
        addLog(`🧹 پالایشگر: ${removed} تکراری حذف شد.`);
        poolSizeEl.textContent = quotesPool.length;
        let displayedIds = new Set(displayedQuotes.map(q => q.id));
        displayedQuotes = displayedQuotes.filter(q => quotesPool.some(p => p.id===q.id));
        refreshDisplay();
      }
    }
    setInterval(cleanDuplicates, 30*1000);

    // راه‌اندازی اولیه
    async function initialLoad(){
      commanderLog.textContent = t('loading');
      // پر کردن سریع با ۵۰ جمله محلی
      addQuotesFromArray(LOCAL_QUOTES.slice(0,50), 'حافظه داخلی');
      refreshDisplay();
      // اجرای همه دروگرها یک بار
      harvester1(); harvester2(); harvester3(); harvester4();
      commanderLog.textContent = t('commanderLog');
    }

    // ==================== زبان و تم ====================
    function toggleLanguage(){
      currentLang = currentLang==='fa'?'en':'fa';
      localStorage.setItem('qlang', currentLang);
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang==='fa'?'rtl':'ltr';
      updateUI();
    }
    function toggleTheme(){
      document.body.classList.toggle('light-mode');
      localStorage.setItem('qtheme', document.body.classList.contains('light-mode')?'light':'dark');
    }
    document.getElementById('langToggle').addEventListener('click', toggleLanguage);
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    if (localStorage.getItem('qtheme')==='light') document.body.classList.add('light-mode');

    // ==================== آغاز ====================
    function init(){
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang==='fa'?'rtl':'ltr';
      renderCategoryList();
      updateUI();
      initialLoad();
      blacklistSizeEl.textContent = blacklist.size;
    }
    init();
  </script>
</body>
</html>
