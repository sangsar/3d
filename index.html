<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>momento | جملات ماندگار</title>
    <!-- فونت فرانسوی + فارسی -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        /* ==================== تم‌ها ==================== */
        :root,
        [data-theme="purple"] {
            --bg: #06050a;
            --bg-image: radial-gradient(ellipse at 30% 10%, rgba(179,136,255,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 90%, rgba(255,107,157,0.06) 0%, transparent 60%);
            --card-bg: rgba(18, 16, 28, 0.7);
            --accent: #b388ff;
            --accent2: #ff6b9d;
            --text: #e4e0f0;
            --text-dim: #8882a0;
            --border: rgba(179, 136, 255, 0.25);
            --glow: 0 0 30px rgba(179, 136, 255, 0.15);
            --card-hover-border: rgba(179,136,255,0.6);
            --card-glow: rgba(179,136,255,0.1);
            --btn-hover-bg: rgba(179,136,255,0.15);
            --btn-hover-shadow: 0 0 12px rgba(179,136,255,0.3);
            --fav-color: #ff5e7a;
            --fav-shadow: 0 0 14px rgba(255,94,122,0.3);
            --del-color: #ff7b7b;
            --del-shadow: 0 0 14px rgba(255,123,123,0.3);
            --scrollbar: rgba(179,136,255,0.3);
            --logo-gradient: linear-gradient(135deg, #e0c3ff, #b388ff, #ff8aab);
            --text-color-on-bg: #f0eaff;
        }

        [data-theme="emerald"] {
            --bg: #050a08;
            --bg-image: radial-gradient(ellipse at 30% 10%, rgba(52,211,153,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 90%, rgba(16,185,129,0.06) 0%, transparent 60%);
            --card-bg: rgba(16, 28, 22, 0.7);
            --accent: #34d399;
            --accent2: #10b981;
            --text: #e0f0e8;
            --text-dim: #6b8b7a;
            --border: rgba(52,211,153,0.25);
            --glow: 0 0 30px rgba(52,211,153,0.15);
            --card-hover-border: rgba(52,211,153,0.6);
            --card-glow: rgba(52,211,153,0.1);
            --btn-hover-bg: rgba(52,211,153,0.15);
            --btn-hover-shadow: 0 0 12px rgba(52,211,153,0.3);
            --fav-color: #f472b6;
            --fav-shadow: 0 0 14px rgba(244,114,182,0.3);
            --del-color: #f87171;
            --del-shadow: 0 0 14px rgba(248,113,113,0.3);
            --scrollbar: rgba(52,211,153,0.3);
            --logo-gradient: linear-gradient(135deg, #a7f3d0, #34d399, #6ee7b7);
            --text-color-on-bg: #eafff5;
        }

        [data-theme="ocean"] {
            --bg: #050a14;
            --bg-image: radial-gradient(ellipse at 30% 10%, rgba(56,189,248,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 90%, rgba(14,165,233,0.06) 0%, transparent 60%);
            --card-bg: rgba(16, 22, 38, 0.7);
            --accent: #38bdf8;
            --accent2: #0ea5e9;
            --text: #e0e8f8;
            --text-dim: #7a8ba8;
            --border: rgba(56,189,248,0.25);
            --glow: 0 0 30px rgba(56,189,248,0.15);
            --card-hover-border: rgba(56,189,248,0.6);
            --card-glow: rgba(56,189,248,0.1);
            --btn-hover-bg: rgba(56,189,248,0.15);
            --btn-hover-shadow: 0 0 12px rgba(56,189,248,0.3);
            --fav-color: #fb7185;
            --fav-shadow: 0 0 14px rgba(251,113,133,0.3);
            --del-color: #f87171;
            --del-shadow: 0 0 14px rgba(248,113,113,0.3);
            --scrollbar: rgba(56,189,248,0.3);
            --logo-gradient: linear-gradient(135deg, #bae6fd, #38bdf8, #7dd3fc);
            --text-color-on-bg: #eef6ff;
        }

        [data-theme="golden"] {
            --bg: #0f0a05;
            --bg-image: radial-gradient(ellipse at 30% 10%, rgba(251,191,36,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 90%, rgba(245,158,11,0.06) 0%, transparent 60%);
            --card-bg: rgba(30, 22, 14, 0.7);
            --accent: #fbbf24;
            --accent2: #f59e0b;
            --text: #f0e8d8;
            --text-dim: #a89870;
            --border: rgba(251,191,36,0.25);
            --glow: 0 0 30px rgba(251,191,36,0.15);
            --card-hover-border: rgba(251,191,36,0.6);
            --card-glow: rgba(251,191,36,0.1);
            --btn-hover-bg: rgba(251,191,36,0.15);
            --btn-hover-shadow: 0 0 12px rgba(251,191,36,0.3);
            --fav-color: #fb7185;
            --fav-shadow: 0 0 14px rgba(251,113,133,0.3);
            --del-color: #ef4444;
            --del-shadow: 0 0 14px rgba(239,68,68,0.3);
            --scrollbar: rgba(251,191,36,0.3);
            --logo-gradient: linear-gradient(135deg, #fde68a, #fbbf24, #f59e0b);
            --text-color-on-bg: #fff8e8;
        }

        [data-theme="rose"] {
            --bg: #0f0508;
            --bg-image: radial-gradient(ellipse at 30% 10%, rgba(251,113,133,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 90%, rgba(244,63,94,0.06) 0%, transparent 60%);
            --card-bg: rgba(30, 16, 20, 0.7);
            --accent: #fb7185;
            --accent2: #f43f5e;
            --text: #f0e0e4;
            --text-dim: #a87882;
            --border: rgba(251,113,133,0.25);
            --glow: 0 0 30px rgba(251,113,133,0.15);
            --card-hover-border: rgba(251,113,133,0.6);
            --card-glow: rgba(251,113,133,0.1);
            --btn-hover-bg: rgba(251,113,133,0.15);
            --btn-hover-shadow: 0 0 12px rgba(251,113,133,0.3);
            --fav-color: #fbbf24;
            --fav-shadow: 0 0 14px rgba(251,191,36,0.3);
            --del-color: #ef4444;
            --del-shadow: 0 0 14px rgba(239,68,68,0.3);
            --scrollbar: rgba(251,113,133,0.3);
            --logo-gradient: linear-gradient(135deg, #fecdd3, #fb7185, #e11d48);
            --text-color-on-bg: #ffeef0;
        }

        [data-theme="sepia"] {
            --bg: #1a1510;
            --bg-image: radial-gradient(ellipse at 30% 10%, rgba(180,130,80,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 90%, rgba(160,110,60,0.04) 0%, transparent 60%);
            --card-bg: rgba(35, 28, 20, 0.75);
            --accent: #d4a574;
            --accent2: #c4956a;
            --text: #e8ddd0;
            --text-dim: #9e8a72;
            --border: rgba(180,140,100,0.25);
            --glow: 0 0 30px rgba(180,140,100,0.12);
            --card-hover-border: rgba(200,160,120,0.6);
            --card-glow: rgba(180,140,100,0.08);
            --btn-hover-bg: rgba(200,160,120,0.15);
            --btn-hover-shadow: 0 0 12px rgba(200,160,120,0.25);
            --fav-color: #d4786a;
            --fav-shadow: 0 0 14px rgba(212,120,106,0.3);
            --del-color: #c06050;
            --del-shadow: 0 0 14px rgba(192,96,80,0.3);
            --scrollbar: rgba(180,140,100,0.3);
            --logo-gradient: linear-gradient(135deg, #e8d5c0, #d4a574, #c4956a);
            --text-color-on-bg: #f5efe8;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Playfair Display', 'Vazirmatn', serif;
            background: var(--bg);
            background-image: var(--bg-image);
            color: var(--text);
            min-height: 100vh;
            line-height: 2;
            position: relative;
            transition: background 0.5s, color 0.5s;
            overflow-x: hidden;
        }

        /* پس‌زمینهٔ متحرک ستاره و ابر */
        #sky {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .sky-element {
            position: absolute;
            opacity: 0.6;
            animation: floatSky linear infinite;
            will-change: transform;
        }
        @keyframes floatSky {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0.3; }
            20% { opacity: 0.7; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* هدر */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6,5,10,0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border);
            padding: 6px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
            transition: background 0.5s, border-color 0.5s;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 2rem;
            font-weight: 400;
            background: var(--logo-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            line-height: 1;
            text-shadow: 0 0 20px rgba(179,136,255,0.4);
            transition: all 0.5s;
        }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .theme-btn, .hamburger {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 200;
            backdrop-filter: blur(8px);
        }
        .theme-btn:hover, .hamburger:hover {
            background: var(--btn-hover-bg);
            border-color: var(--accent);
            color: #fff;
            box-shadow: var(--btn-hover-shadow);
        }
        .theme-indicator {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.7rem; color: var(--text-dim);
            margin: 0 4px;
        }
        .color-dots { display: flex; gap: 3px; }
        .color-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            transition: all 0.5s;
        }

        /* overlay */
        .overlay {
            position: fixed; inset:0; background: rgba(0,0,0,0.7); z-index:150;
            opacity:0; pointer-events:none; transition:opacity 0.3s;
        }
        .overlay.active { opacity:1; pointer-events:auto; }

        /* سایدبار */
        .sidebar {
            position: fixed; top:0; right:-380px; width:340px; max-width:85vw; height:100vh;
            background: rgba(14,12,24,0.96); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-left:1px solid var(--border); z-index:160; padding:24px 20px; overflow-y:auto;
            transition: right 0.4s cubic-bezier(0.22,0.61,0.36,1);
            display:flex; flex-direction:column; gap:12px;
        }
        .sidebar.active { right:0; }
        .sidebar h3 {
            color:var(--accent); text-align:center; font-size:1.3rem; margin-bottom:8px;
            font-family: 'Lalezar', cursive; letter-spacing:1px; transition: color 0.5s;
        }
        .sidebar .section-title { color:var(--text-dim); font-size:0.7rem; letter-spacing:2px; margin-top:12px; padding-right:8px; }
        .sidebar button {
            display:flex; align-items:center; gap:10px; width:100%; padding:13px 18px; border-radius:14px;
            border:1px solid transparent; background:rgba(255,255,255,0.03); color:var(--text);
            font-size:0.95rem; cursor:pointer; transition:0.3s; font-family:inherit; text-align:right;
        }
        .sidebar button:hover { background: var(--btn-hover-bg); border-color:var(--border); color:#fff; }
        .sidebar button.active-cat { background: var(--btn-hover-bg); border-color:var(--accent); color:var(--accent); font-weight:600; }
        .sidebar .icon { font-size:1.2rem; width:26px; }
        .danger-btn { color:var(--del-color) !important; border-color:rgba(255,123,123,0.3)!important; }
        .danger-btn:hover { background:rgba(255,123,123,0.15)!important; }
        .sidebar .close-btn {
            position:absolute; top:14px; left:14px; width:36px; height:36px; border-radius:50%;
            background:transparent; border:1px solid var(--border); color:var(--text-dim);
            cursor:pointer; font-size:1.2rem; display:flex; align-items:center; justify-content:center; transition:0.3s;
        }
        .sidebar .close-btn:hover { color:#fff; border-color:#fff; }

        /* محتوای اصلی */
        .main-container { padding: 24px 16px 60px; max-width:1500px; margin:0 auto; position: relative; z-index: 2; }
        .quotes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }
        @media (max-width: 700px) {
            .quotes-grid { grid-template-columns: 1fr; }
            .logo { font-size: 1.6rem; }
            .theme-indicator { display: none; }
        }

        /* کارت نقل‌قول */
        .quote-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px 22px 22px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: all 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            animation: fadeCard 0.6s ease backwards;
            position: relative;
            overflow: hidden;
        }
        .quote-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 30% 20%, var(--card-glow), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        .quote-card:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), var(--glow);
        }
        .quote-card:hover::after { opacity: 1; }

        @keyframes fadeCard {
            from { opacity:0; transform:translateY(30px) scale(0.96); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }

        .quote-text {
            font-size: 1.15rem;
            line-height: 2.1;
            color: var(--text-color-on-bg);
            font-weight: 400;
            max-width: 90%;
            z-index: 1;
            transition: color 0.5s;
            font-style: italic;
        }

        .quote-author {
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: auto;
            opacity: 0.85;
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 1;
            transition: color 0.5s;
        }

        .card-actions { display: flex; gap: 8px; z-index: 1; }
        .card-btn {
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .card-btn:hover {
            border-color: var(--accent);
            color: #fff;
            background: var(--btn-hover-bg);
            box-shadow: var(--btn-hover-shadow);
        }
        .card-btn.fav-btn.liked {
            color: #fff;
            border-color: var(--fav-color);
            background: rgba(255,94,122,0.25);
            animation: heartPop 0.4s ease;
            box-shadow: var(--fav-shadow);
        }
        @keyframes heartPop {
            0% { transform:scale(1); }
            40% { transform:scale(1.35); }
            100% { transform:scale(1); }
        }
        .card-btn.delete-btn:hover {
            border-color: var(--del-color);
            color: var(--del-color);
            background: rgba(255,123,123,0.2);
            box-shadow: var(--del-shadow);
        }

        .empty-state {
            grid-column:1/-1; text-align:center; padding:80px 20px; color:var(--text-dim); font-size:1.3rem;
        }
        .empty-state .icon-big { font-size:4rem; display:block; margin-bottom:16px; opacity:0.4; }

        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius:10px; }
    </style>
</head>
<body data-theme="purple">

    <!-- پس‌زمینهٔ ستاره‌ها و ابرها -->
    <div id="sky"></div>

    <header class="header">
        <div class="header-left">
            <span class="logo">momento</span>
        </div>
        <div class="header-actions">
            <div class="theme-indicator">
                <div class="color-dots">
                    <span class="color-dot" style="background:#b388ff;"></span>
                    <span class="color-dot" style="background:#34d399;"></span>
                    <span class="color-dot" style="background:#38bdf8;"></span>
                    <span class="color-dot" style="background:#fbbf24;"></span>
                    <span class="color-dot" style="background:#fb7185;"></span>
                    <span class="color-dot" style="background:#d4a574;"></span>
                </div>
            </div>
            <button class="theme-btn" id="themeBtn" title="تغییر تم">🎨</button>
            <button class="hamburger" id="hamburgerBtn" title="منو">☰</button>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebar">✕</button>
        <h3>📖 گنجینه</h3>

        <div class="section-title">📂 دسته‌بندی</div>
        <button class="menu-link active-cat" data-category="all"><span class="icon">📚</span> همه نقل‌قول‌ها</button>
        <button class="menu-link" data-category="famous"><span class="icon">🌟</span> سخنان بزرگان</button>
        <button class="menu-link" data-category="book"><span class="icon">📖</span> تکه‌های کتاب</button>
        <button class="menu-link" data-category="dialogue"><span class="icon">🎬</span> دیالوگ‌های ماندگار</button>
        <button class="menu-link" data-category="philosophy"><span class="icon">🏛️</span> فلسفی</button>
        <button class="menu-link" data-category="psychology"><span class="icon">🧠</span> روانشناسی</button>

        <div class="section-title">❤️ مجموعه‌های من</div>
        <button class="menu-link" id="showFavorites"><span class="icon">❤️</span> علاقه‌مندی‌ها <span id="favCount">(0)</span></button>
        <button class="menu-link" id="showBlacklist"><span class="icon">🚫</span> بلک‌لیست <span id="blacklistCount">(0)</span></button>
        <button class="menu-link danger-btn" id="clearBlacklist"><span class="icon">🔓</span> آزادسازی بلک‌لیست</button>
    </aside>

    <main class="main-container">
        <div class="quotes-grid" id="quotesGrid"></div>
    </main>

    <script src="quotes.js"></script>
    <script>
        (function() {
            const grid = document.getElementById('quotesGrid');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const closeSidebarBtn = document.getElementById('closeSidebar');
            const themeBtn = document.getElementById('themeBtn');
            const favCountEl = document.getElementById('favCount');
            const blacklistCountEl = document.getElementById('blacklistCount');
            const showFavoritesBtn = document.getElementById('showFavorites');
            const showBlacklistBtn = document.getElementById('showBlacklist');
            const clearBlacklistBtn = document.getElementById('clearBlacklist');

            const STORAGE_KEY = 'momento_quotes_v2';
            const THEME_STORAGE_KEY = 'momento_theme';
            const themes = ['purple', 'emerald', 'ocean', 'golden', 'rose', 'sepia'];
            const themeNames = {
                purple: 'بنفش نیمه‌شب',
                emerald: 'زمردین',
                ocean: 'اقیانوسی',
                golden: 'کهربایی',
                rose: 'مخملی',
                sepia: 'سپیا'
            };

            let currentCategory = 'all';
            let displayedIds = [];
            let blacklist = new Set();
            let favorites = new Set();
            let allQuotes = [];
            let currentThemeIndex = 0;

            if (typeof quotes !== 'undefined' && Array.isArray(quotes)) {
                allQuotes = [...quotes];
            } else {
                console.error('quotes.js یافت نشد.');
            }

            // پس‌زمینهٔ ستاره و ابر
            function createSky() {
                const sky = document.getElementById('sky');
                const symbols = ['★', '☁️'];
                for (let i = 0; i < 35; i++) {
                    const el = document.createElement('span');
                    el.className = 'sky-element';
                    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    el.style.left = Math.random() * 100 + '%';
                    el.style.fontSize = (Math.random() * 24 + 14) + 'px';
                    el.style.animationDuration = (Math.random() * 12 + 12) + 's';
                    el.style.animationDelay = Math.random() * 15 + 's';
                    el.style.opacity = Math.random() * 0.5 + 0.2;
                    sky.appendChild(el);
                }
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data.blacklist) blacklist = new Set(data.blacklist);
                        if (data.favorites) favorites = new Set(data.favorites);
                        if (data.currentCategory) currentCategory = data.currentCategory;
                        if (data.displayedIds) displayedIds = data.displayedIds;
                    }
                    const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
                    if (savedTheme && themes.includes(savedTheme)) {
                        currentThemeIndex = themes.indexOf(savedTheme);
                    } else {
                        currentThemeIndex = 0;
                    }
                } catch (e) {}
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        blacklist: [...blacklist],
                        favorites: [...favorites],
                        currentCategory,
                        displayedIds,
                    }));
                    localStorage.setItem(THEME_STORAGE_KEY, themes[currentThemeIndex]);
                } catch (e) {}
            }

            function applyTheme(index) {
                currentThemeIndex = index;
                const theme = themes[index];
                document.body.setAttribute('data-theme', theme);
                document.querySelectorAll('.color-dot').forEach((dot, i) => {
                    dot.style.opacity = i === index ? '1' : '0.35';
                    dot.style.transform = i === index ? 'scale(1.4)' : 'scale(1)';
                    dot.style.transition = 'all 0.5s';
                });
                saveState();
            }

            function cycleTheme() {
                const next = (currentThemeIndex + 1) % themes.length;
                applyTheme(next);
            }

            themeBtn.addEventListener('click', cycleTheme);

            function getQuotesByCategory(cat) {
                return cat === 'all' ? [...allQuotes] : allQuotes.filter(q => q.category === cat);
            }

            function getAvailableQuoteIds(cat) {
                const pool = getQuotesByCategory(cat);
                const poolIds = new Set(pool.map(q => q.id));
                const available = [];
                for (const id of poolIds) {
                    if (!blacklist.has(id) && !displayedIds.includes(id)) available.push(id);
                }
                for (let i = available.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [available[i], available[j]] = [available[j], available[i]];
                }
                return available;
            }

            function findQuoteById(id) { return allQuotes.find(q => q.id === id); }

            function initDisplayedIds(cat) {
                const available = getAvailableQuoteIds(cat);
                displayedIds = available.slice(0, 100);
            }

            function refillDisplayedIds(cat) {
                const needed = 100 - displayedIds.length;
                if (needed <= 0) return;
                const available = getAvailableQuoteIds(cat);
                displayedIds.push(...available.slice(0, needed));
            }

            function renderGrid() {
                grid.innerHTML = '';
                if (displayedIds.length === 0) {
                    const msg = currentCategory === 'favorites' ? '❤️ هنوز جمله‌ای به علاقه‌مندی‌ها اضافه نکردی.' :
                               currentCategory === 'blacklist' ? '🚫 بلک‌لیست خالی است.' :
                               '📭 جمله‌ای برای نمایش نیست.';
                    grid.innerHTML = `<div class="empty-state"><span class="icon-big">${currentCategory==='favorites'?'💔':'🕊️'}</span>${msg}</div>`;
                    return;
                }
                const fragment = document.createDocumentFragment();
                displayedIds.forEach((id, idx) => {
                    const quote = findQuoteById(id);
                    if (!quote) return;
                    const isFav = favorites.has(id);
                    const authorDisplay = (quote.author && quote.author !== 'ناشناس') ? quote.author : '';
                    const card = document.createElement('div');
                    card.className = 'quote-card';
                    card.style.animationDelay = `${(idx % 15) * 0.05}s`;
                    card.innerHTML = `
                        <div class="quote-text">${escapeHTML(quote.text)}</div>
                        ${authorDisplay ? `<div class="quote-author">— ${escapeHTML(authorDisplay)}</div>` : ''}
                        <div class="card-actions">
                            <button class="card-btn fav-btn ${isFav ? 'liked' : ''}" data-id="${id}">${isFav ? '❤️' : '🤍'}</button>
                            <button class="card-btn delete-btn" data-id="${id}">🗑️</button>
                        </div>
                    `;
                    fragment.appendChild(card);
                });
                grid.appendChild(fragment);
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updateCounts() {
                favCountEl.textContent = `(${favorites.size})`;
                blacklistCountEl.textContent = `(${blacklist.size})`;
            }
            function updateSidebarActive() {
                document.querySelectorAll('.sidebar button[data-category]').forEach(btn => {
                    btn.classList.toggle('active-cat', btn.dataset.category === currentCategory);
                });
            }

            function switchCategory(cat) {
                if (cat === 'favorites') {
                    currentCategory = 'favorites';
                    displayedIds = [...favorites];
                } else if (cat === 'blacklist') {
                    currentCategory = 'blacklist';
                    displayedIds = [...blacklist];
                } else {
                    currentCategory = cat;
                    initDisplayedIds(cat);
                    refillDisplayedIds(cat);
                }
                updateSidebarActive();
                renderGrid();
                updateCounts();
                closeSidebar();
                saveState();
            }

            function toggleFavorite(id) {
                if (favorites.has(id)) {
                    favorites.delete(id);
                } else {
                    favorites.add(id);
                }
                updateCounts();
                if (currentCategory === 'favorites') displayedIds = [...favorites];
                renderGrid();
                saveState();
            }

            function deleteQuote(id) {
                if (blacklist.has(id)) return;
                displayedIds = displayedIds.filter(did => did !== id);
                blacklist.add(id);
                favorites.delete(id);
                if (currentCategory !== 'favorites' && currentCategory !== 'blacklist') {
                    refillDisplayedIds(currentCategory);
                } else if (currentCategory === 'favorites') {
                    displayedIds = [...favorites];
                } else if (currentCategory === 'blacklist') {
                    displayedIds = [...blacklist];
                }
                updateCounts();
                renderGrid();
                saveState();
            }

            function clearBlacklistAction() {
                if (blacklist.size === 0) return;
                blacklist.clear();
                if (currentCategory === 'blacklist') displayedIds = [];
                else if (currentCategory !== 'favorites') {
                    initDisplayedIds(currentCategory);
                    refillDisplayedIds(currentCategory);
                }
                updateCounts();
                renderGrid();
                saveState();
            }

            grid.addEventListener('click', e => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const id = parseInt(btn.dataset.id);
                if (isNaN(id)) return;
                if (btn.classList.contains('fav-btn')) toggleFavorite(id);
                else if (btn.classList.contains('delete-btn')) deleteQuote(id);
            });

            document.querySelectorAll('.sidebar button[data-category]').forEach(btn => {
                btn.addEventListener('click', () => switchCategory(btn.dataset.category));
            });
            showFavoritesBtn.addEventListener('click', () => switchCategory('favorites'));
            showBlacklistBtn.addEventListener('click', () => switchCategory('blacklist'));
            clearBlacklistBtn.addEventListener('click', clearBlacklistAction);

            function openSidebar() { sidebar.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
            function closeSidebar() { sidebar.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
            hamburgerBtn.addEventListener('click', openSidebar);
            closeSidebarBtn.addEventListener('click', closeSidebar);
            overlay.addEventListener('click', closeSidebar);
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && sidebar.classList.contains('active')) closeSidebar(); });

            function init() {
                createSky();
                loadState();
                applyTheme(currentThemeIndex);
                if (displayedIds.length === 0 && currentCategory !== 'favorites' && currentCategory !== 'blacklist') {
                    initDisplayedIds(currentCategory);
                    refillDisplayedIds(currentCategory);
                }
                if (currentCategory === 'favorites') displayedIds = [...favorites];
                if (currentCategory === 'blacklist') displayedIds = [...blacklist];
                updateCounts();
                updateSidebarActive();
                renderGrid();
                saveState();
            }
            init();
        })();
    </script>
</body>
</html>
