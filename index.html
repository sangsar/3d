<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقل‌قول‌سرا | سیستم چند‌رباته + مخزن بی‌نهایت</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0f14; --surface: #151e24; --text: #cbd5e0;
      --primary: #f4a261; --secondary: #e76f51; --accent: #2a9d8f;
      --glass-bg: rgba(21, 30, 36, 0.75); --glass-border: rgba(255,255,255,0.07);
      --font: 'Vazirmatn', sans-serif; --danger: #e74c3c;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      transition: background 0.3s, color 0.3s; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    #particles {
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;
    }
    header {
      background: var(--glass-bg); backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--glass-border); padding: 0.8rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top:0; z-index:100;
    }
    .logo {
      font-size: 1.8rem; font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer;
    }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem 1rem; border-radius: 2rem; color: var(--text);
      cursor: pointer; font-family: var(--font); font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.3rem; transition: 0.2s;
    }
    .icon-btn:hover { background: var(--primary); color:#000; }
    .hamburger {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 0.5rem; cursor: pointer;
      display: flex; flex-direction: column; gap: 5px; width: 40px; height: 40px;
      justify-content: center; align-items: center;
    }
    .hamburger span { display:block; width:25px; height:3px; background:var(--text); transition:0.3s; }
    .sidebar {
      position: fixed; top:0; right:-100%; width:280px; height:100%;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border); z-index:120;
      transition: right 0.3s ease; padding:1rem; overflow-y:auto;
      display: flex; flex-direction: column; gap:1.2rem;
    }
    .sidebar.open { right:0; }
    .sidebar-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index:115; display:none;
    }
    .sidebar-overlay.open { display:block; }
    .close-sidebar { align-self: flex-end; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; }
    .sidebar-section h3 { font-size:0.95rem; color:var(--primary); margin-bottom:0.5rem; border-bottom:1px solid var(--glass-border); padding-bottom:0.3rem; }
    .category-list { display:flex; flex-direction:column; gap:0.4rem; }
    .category-btn {
      background: var(--surface); border:1px solid var(--glass-border);
      padding:0.5rem 1rem; border-radius:1.5rem; color:var(--text);
      cursor:pointer; font-family:var(--font); font-size:0.85rem; transition:0.2s;
    }
    .category-btn:hover, .category-btn.active { background:var(--accent); color:#000; }
    main { flex:1; padding:1rem 1.5rem; max-width:1200px; margin:0 auto; width:100%; }
    .status-bar {
      background: var(--surface); border-radius: 1rem; padding: 0.5rem 1rem;
      margin-bottom: 1.5rem; display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--secondary);
    }
    .quote-list { display: flex; flex-direction: column; gap: 0.8rem; position: relative; }
    .quote-card {
      background: var(--glass-bg); backdrop-filter: blur(10px);
      border:1px solid var(--glass-border); border-radius:1.2rem; padding:1rem 1.2rem;
      display:flex; align-items: center; gap:1rem;
      transition: opacity 0.3s ease, transform 0.3s ease;
      animation: fadeInUp 0.4s ease;
    }
    .quote-card.removing { opacity: 0; transform: scale(0.95); }
    .quote-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,0,0,0.3); }
    .quote-number { font-size: 1.5rem; font-weight: 900; color: var(--primary); min-width: 2.5rem; text-align: center; }
    .quote-content { flex:1; }
    .quote-text { font-size: 1.1rem; line-height: 1.8; font-style: italic; margin-bottom: 0.3rem; }
    .quote-source { font-size: 0.8rem; color: var(--accent); }
    .quote-actions { display: flex; gap: 0.5rem; align-items: center; }
    .sentiment-icon { font-size:1.2rem; }
    .delete-btn {
      background: var(--danger); border:none; padding:0.4rem 1.2rem;
      border-radius:2rem; color:white; font-family:var(--font); cursor:pointer;
      font-weight:bold; transition: background 0.2s;
    }
    .delete-btn:hover { background: #c0392b; }
    .log-area {
      background: var(--surface); border-radius:1rem; padding:0.8rem; margin-top:1.5rem;
      font-size:0.8rem; color:var(--secondary); max-height:100px; overflow-y:auto;
      border:1px solid var(--glass-border);
    }
    .log-area p { margin:0.2rem 0; border-right:2px solid var(--accent); padding-right:0.5rem; }
    footer { text-align:center; padding:1rem; color:#555; font-size:0.8rem; margin-top:auto; }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(15px); }
      to { opacity:1; transform:translateY(0); }
    }
    body.light-mode {
      --bg: #f5f0eb; --surface: #ffffff; --text: #2c3e50;
      --glass-bg: rgba(255,255,255,0.85); --glass-border: rgba(0,0,0,0.05);
    }
    @media (max-width: 600px) {
      .quote-card { flex-direction: column; align-items: flex-start; }
      .logo { font-size:1.4rem; }
    }
  </style>
</head>
<body>
<canvas id="particles"></canvas>
<header>
  <div class="logo" id="logoText">📖 نقل‌قول‌سرا</div>
  <div class="header-actions">
    <button class="icon-btn" id="langToggle">🌐 <span id="langLabel">FA</span></button>
    <button class="icon-btn" id="themeToggle">🌓</button>
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <button class="close-sidebar" id="closeSidebar">✕</button>
  <div class="sidebar-section">
    <h3>🤖 ربات‌ها</h3>
    <p>📡 دروگر ۱: <span id="h1">⏳</span></p>
    <p>📡 دروگر ۲: <span id="h2">⏳</span></p>
    <p>📡 دروگر ۳: <span id="h3">⏳</span></p>
    <p>🧠 مولد: <span id="gen">✅</span></p>
    <hr style="border-color:var(--glass-border);">
    <p>📊 مخزن: <span id="poolSize">0</span></p>
    <p>🚫 بلک‌لیست: <span id="blacklistSize">0</span></p>
  </div>
  <div class="sidebar-section">
    <h3>🗂️ دسته‌بندی‌ها</h3>
    <div class="category-list" id="categoryList"></div>
  </div>
</div>

<main>
  <div class="status-bar">
    <span id="quoteCounter">۵۰ جمله</span>
    <span id="commanderLog">ربات‌ها در حال کارند</span>
  </div>
  <div class="quote-list" id="quoteList"></div>
  <div class="log-area" id="logArea"><p>🤖 راه‌اندازی...</p></div>
</main>
<footer>سیستم چندرباته + مخزن بی‌نهایت جمله</footer>

<script>
  // ==================== تنظیمات ====================
  const MAX_DISPLAY = 50;
  const CATS = ['همه','عشق','زمان','اخلاق','موفقیت','زندگی','مرگ','دوستی','امید','شجاعت','دانش','قدرت','آرامش','هنر','طبیعت','سفر','کار','سلامتی','معنویت','خلاقیت','رهبری','شادی','غم','صبر','آزادی','عدالت'];

  // ==================== ابزار ====================
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  const fp = txt => txt.toLowerCase().replace(/[^a-z0-9]/g, '').trim();

  // ==================== دیتابیس بزرگ برای تولید بی‌نهایت ====================
  const DB = {
    subjects: ['عشق','زندگی','مرگ','زمان','آزادی','حقیقت','تنهایی','امید','ترس','شجاعت','دانش','هنر','طبیعت','سکوت','دوستی','بخشش','انتظار','تغییر','رشد','آگاهی','قدرت','ضعف','ثروت','فقر','سلامتی','بیماری','جوانی','پیری','زیبایی','نور','تاریکی','صدا','خاموشی','حرکت','سکون'],
    verbs: ['پلی است به سوی','نوری است در تاریکی','آغازی است برای','پایانی است بر','معلمی است که می‌آموزد','آینه‌ای است که نشان می‌دهد','هدیه‌ای است از','سفری است به اعماق','رازی است در','پنجره‌ای است رو به','دری است به سوی','بذری است که','رودی است که به','کوهی است که','درختی است که ریشه در','آسمانی است پر از','اقیانوسی است از','بیابانی است که در آن','شهری است که در آن','قلعه‌ای است در برابر'],
    objects: ['روح انسان','قلب تپنده','ذهن بیدار','دنیای ناشناخته','اعماق وجود','افق‌های دور','باغ خاطرات','اقیانوس آرامش','قله‌های بلند','کویر سکوت','جنگل اسرار','آسمان بی‌نهایت','ستارگان خاموش','ماه تنهایی','خورشید حقیقت','باد تغییر','باران رحمت','برف پاکی','آتش شوق','خاک فروتنی'],
    adjectives: ['بی‌پایان','اسرارآمیز','شکننده','قدرتمند','زیبا','وحشتناک','آرامش‌بخش','تحول‌آفرین','رهایی‌بخش','چالش‌برانگیز','فریبنده','دست‌نیافتنی','جاودانه','گذرا','ساکت','فریادزن','ملایم','خشن','روشن','تاریک'],
    quotes: [
      {fa:"باشد که نیرو با تو باشد.",en:"May the Force be with you.",cat:"شجاعت",src:"جنگ ستارگان"},
      {fa:"من پدر تو هستم.",en:"I am your father.",cat:"خلاقیت",src:"جنگ ستارگان"},
      {fa:"زندگی مثل یه جعبه شکلاته.",en:"Life is like a box of chocolates.",cat:"زندگی",src:"فارست گامپ"},
      {fa:"چرا اینقدر جدی هستی؟",en:"Why so serious?",cat:"غم",src:"شوالیه تاریکی"},
      {fa:"من فکر می‌کنم، پس هستم.",en:"I think, therefore I am.",cat:"خلاقیت",src:"دکارت"},
      {fa:"زندگی بدون تأمل، ارزش زیستن ندارد.",en:"The unexamined life is not worth living.",cat:"زندگی",src:"سقراط"},
      {fa:"تنها چیزی که می‌دانم این است که هیچ نمی‌دانم.",en:"I know that I know nothing.",cat:"دانش",src:"سقراط"},
      {fa:"انسان آزاد آفریده شده، اما همه جا در زنجیر است.",en:"Man is born free, and everywhere he is in chains.",cat:"آزادی",src:"روسو"},
      {fa:"آینده به کسانی تعلق دارد که به زیبایی رویاهایشان ایمان دارند.",en:"The future belongs to those who believe in the beauty of their dreams.",cat:"امید",src:"النور روزولت"},
      {fa:"تنها راه انجام کار بزرگ، دوست داشتن کاری است که انجام می‌دهی.",en:"The only way to do great work is to love what you do.",cat:"موفقیت",src:"استیو جابز"},
      {fa:"موفقیت یعنی از شکستی به شکست دیگر رفتن، بدون از دست دادن اشتیاق.",en:"Success is going from failure to failure without losing enthusiasm.",cat:"موفقیت",src:"چرچیل"},
      {fa:"دوست واقعی کسی است که وقتی بقیه از در بیرون می‌روند، از پنجره وارد می‌شود.",en:"A true friend walks in when the rest of the world walks out.",cat:"دوستی",src:"والتر وینچل"},
      {fa:"در نومیدی بسی امید است.",en:"In the midst of despair, there is much hope.",cat:"امید",src:"مولانا"},
      {fa:"کسی که طعم عشق را چشیده باشد، می‌داند که هیچ چیز باارزش‌تر نیست.",en:"He who has tasted love knows that nothing is more precious.",cat:"عشق",src:"جبران خلیل جبران"},
      {fa:"زمان ارزشمندترین چیز است.",en:"Time is the most valuable thing.",cat:"زمان",src:"تئوفراستوس"},
      {fa:"تجربه، نامی است که هر کس بر اشتباهاتش می‌گذارد.",en:"Experience is the name everyone gives to their mistakes.",cat:"خلاقیت",src:"اسکار وایلد"},
      {fa:"شجاعت، درست در لحظه‌ای متولد می‌شود که ترس را می‌پذیری و قدم برمی‌داری.",en:"Courage is born the moment you accept fear and take a step.",cat:"شجاعت",src:"ناشناس"},
      {fa:"هنر نفس کشیدن روح است.",en:"Art is the breathing of the soul.",cat:"هنر",src:"پیکاسو"},
      {fa:"طبیعت هرگز عجله نمی‌کند، با این حال همه چیز به انجام می‌رسد.",en:"Nature does not hurry, yet everything is accomplished.",cat:"طبیعت",src:"لائوتسه"},
      {fa:"خلاقیت یعنی دیدن چیزی که همه می‌بینند و فکر کردن به چیزی که هیچ‌کس تا به حال به آن فکر نکرده است.",en:"Creativity is seeing what everyone sees and thinking what no one has ever thought.",cat:"خلاقیت",src:"انیشتین"}
    ]
  };

  // ==================== موتور تولید بی‌نهایت ====================
  function generateQuote() {
    if (Math.random() < 0.3) {
      // ۳۰٪ از جملات واقعی
      let q = rand(DB.quotes);
      return {fa:q.fa, en:q.en, cat:q.cat, source:q.src};
    } else {
      // ۷۰٪ تولید ترکیبی
      let s = rand(DB.subjects);
      let v = rand(DB.verbs);
      let o = rand(DB.objects);
      let a = rand(DB.adjectives);
      let fa = `${s} ${v} ${o} ${a}.`;
      let en = `${s} ${v} ${o} ${a}.`; // simplified
      let cat = CATS.find(c => fa.includes(c)) || 'زندگی';
      return {fa, en, cat, source:'AI مولد'};
    }
  }

  // ==================== ربات‌های دروگر (تلاش برای API) ====================
  async function harvestAPI(url, parser, label, statusEl) {
    try {
      if (statusEl) statusEl.textContent = '🔄';
      let res = await fetch(url);
      if (!res.ok) throw new Error('fail');
      let data = await res.json();
      let items = parser(data);
      if (items && items.length) {
        let added = 0;
        items.forEach(item => {
          let txtEn = (item.en || item.content || item.quote || item.text || '').trim();
          if (!txtEn || txtEn.length < 20) return;
          if (!quotesPool.some(q => fp(q.en) === fp(txtEn)) && !blacklist.has(fp(txtEn))) {
            quotesPool.push({
              id: nextId++,
              fa: item.fa || txtEn,
              en: txtEn,
              cat: 'عمومی',
              source: label
            });
            added++;
          }
        });
        if (added) {
          poolSizeEl.textContent = quotesPool.length;
          if (statusEl) statusEl.textContent = '✅';
          addLog(`📡 ${label}: ${added} جمله`);
          refreshDisplay();
        } else {
          if (statusEl) statusEl.textContent = '⚠️';
        }
      }
    } catch(e) {
      if (statusEl) statusEl.textContent = '❌';
    }
  }

  // ==================== حالت ====================
  let currentLang = localStorage.getItem('qlang') || 'fa';
  let currentCategory = 'همه';
  let displayedQuotes = [];
  let quotesPool = DB.quotes.map((q,i) => ({...q, id:i+1}));
  let blacklist = new Set(JSON.parse(localStorage.getItem('quote_blacklist')||'[]'));
  let nextId = DB.quotes.length + 1;
  let logs = [];

  // DOM
  const quoteList = document.getElementById('quoteList');
  const categoryList = document.getElementById('categoryList');
  const quoteCounter = document.getElementById('quoteCounter');
  const commanderLog = document.getElementById('commanderLog');
  const logArea = document.getElementById('logArea');
  const poolSizeEl = document.getElementById('poolSize');
  const blacklistSizeEl = document.getElementById('blacklistSize');

  // ذرات
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  window.addEventListener('resize', resize); resize();
  class P {
    constructor(){ this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.s=Math.random()*2+0.5; this.vx=(Math.random()-0.5)*0.4; this.vy=(Math.random()-0.5)*0.4; }
    upd(){ this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>canvas.width) this.vx*=-1; if(this.y<0||this.y>canvas.height) this.vy*=-1; }
    draw(){ ctx.fillStyle='rgba(244,162,97,0.5)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
  }
  for(let i=0;i<60;i++) particles.push(new P());
  function anim(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.upd();p.draw();}); requestAnimationFrame(anim); }
  anim();

  // ترجمه
  const ui = {
    fa:{logo:'📖 نقل‌قول‌سرا',counter:n=>`${n} جمله`,del:'حذف',loading:'در حال بارگذاری...',ready:'آماده'},
    en:{logo:'📖 QuoteVault',counter:n=>`${n} quotes`,del:'Remove',loading:'Loading...',ready:'Ready'}
  };
  function t(k,...a){ let s=ui[currentLang]?.[k]||k; return typeof s==='function'?s(...a):s; }
  function updUI(){
    document.getElementById('logoText').textContent=t('logo');
    document.getElementById('langLabel').textContent=currentLang==='fa'?'FA':'EN';
    quoteCounter.textContent=t('counter',displayedQuotes.length);
    commanderLog.textContent=t('ready');
    poolSizeEl.textContent=quotesPool.length;
    blacklistSizeEl.textContent=blacklist.size;
    renderCategories();
  }

  // منو
  function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
  document.getElementById('hamburgerBtn').addEventListener('click',toggleSidebar);
  document.getElementById('closeSidebar').addEventListener('click',toggleSidebar);
  document.getElementById('sidebarOverlay').addEventListener('click',toggleSidebar);
  function renderCategories(){
    categoryList.innerHTML = CATS.map(c=>`<button class="category-btn ${c===currentCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');
    categoryList.querySelectorAll('.category-btn').forEach(b=>b.addEventListener('click',()=>{
      currentCategory=b.dataset.cat; renderCategories(); refreshDisplay(); toggleSidebar();
    }));
  }

  // مدیریت
  function avail(){
    let f = currentCategory==='همه'?quotesPool:quotesPool.filter(q=>q.cat===currentCategory);
    let ids = new Set(displayedQuotes.map(q=>q.id));
    return f.filter(q=>!ids.has(q.id)&&!blacklist.has(fp(q.en)));
  }
  function ensure(){
    let a = avail();
    if(a.length < MAX_DISPLAY){
      let need = MAX_DISPLAY - a.length + 5;
      for(let i=0;i<need;i++){
        let q = generateQuote();
        if(!quotesPool.some(p=>fp(p.en)===fp(q.en)) && !blacklist.has(fp(q.en))){
          quotesPool.push({...q, id:nextId++});
        }
      }
      poolSizeEl.textContent=quotesPool.length;
      addLog('🧠 مولد جملات جدید ساخت.');
    }
  }
  function refreshDisplay(){
    ensure();
    let a = avail();
    let need = MAX_DISPLAY - displayedQuotes.length;
    if(need>0 && a.length>0){
      let add = [...a].sort(()=>Math.random()-0.5).slice(0,need);
      displayedQuotes.push(...add);
      add.forEach(q=>append(q));
    }
    while(displayedQuotes.length > MAX_DISPLAY){
      removeEl(displayedQuotes.shift().id);
    }
    quoteCounter.textContent=t('counter',displayedQuotes.length);
    updNums();
  }
  function updNums(){
    document.querySelectorAll('.quote-card').forEach((c,i)=>c.querySelector('.quote-number').textContent=i+1);
  }
  function build(q){
    let c=document.createElement('div'); c.className='quote-card'; c.dataset.id=q.id;
    let txt=currentLang==='fa'?q.fa:q.en;
    let emoji=q.id%3===0?'😊':(q.id%3===1?'😐':'😞');
    c.innerHTML=`<div class="quote-number">0</div><div class="quote-content"><div class="quote-text">“${txt}”</div><div class="quote-source">${q.source||'نامشخص'}</div></div><div class="quote-actions"><span class="sentiment-icon">${emoji}</span><button class="delete-btn">${t('del')}</button></div>`;
    c.querySelector('.delete-btn').addEventListener('click',e=>{e.stopPropagation();del(q.id);});
    return c;
  }
  function append(q,anim=true){ let c=build(q); if(!anim) c.style.animation='none'; quoteList.appendChild(c); }
  function removeEl(id){ let c=document.querySelector(`.quote-card[data-id="${id}"]`); if(c){ c.classList.add('removing'); setTimeout(()=>c.remove(),300); } }
  function del(id){
    let q=displayedQuotes.find(x=>x.id==id); if(!q) return;
    blacklist.add(fp(q.en)); localStorage.setItem('quote_blacklist',JSON.stringify([...blacklist]));
    blacklistSizeEl.textContent=blacklist.size; addLog('🗑️ حذف شد.');
    removeEl(id); displayedQuotes=displayedQuotes.filter(x=>x.id!=id);
    refreshDisplay();
  }
  function addLog(msg){
    let time=new Date().toLocaleTimeString('fa-IR'); logs.push(`[${time}] ${msg}`);
    if(logs.length>20) logs.shift(); logArea.innerHTML=logs.map(m=>`<p>${m}</p>`).join('');
  }

  // شروع
  function init(){
    document.documentElement.lang=currentLang; document.documentElement.dir=currentLang==='fa'?'rtl':'ltr';
    renderCategories(); updUI();
    // نمایش اولیه ۵۰ جمله
    let a = avail();
    displayedQuotes = a.slice(0, MAX_DISPLAY);
    quoteList.innerHTML = ''; displayedQuotes.forEach(q=>append(q,false));
    updNums(); quoteCounter.textContent=t('counter',displayedQuotes.length);
    poolSizeEl.textContent=quotesPool.length; blacklistSizeEl.textContent=blacklist.size;
    // ربات‌های دروگر هر ۶۰ ثانیه
    setInterval(()=>{
      harvestAPI('https://api.quotable.io/quotes/random?limit=5', d=>d, 'Quotable', document.getElementById('h1'));
    }, 60000);
    setInterval(()=>{
      harvestAPI('https://zenquotes.io/api/random', d=>d.map(q=>({en:q.q,source:q.a})), 'ZenQuotes', document.getElementById('h2'));
    }, 90000);
    setInterval(()=>{
      harvestAPI('https://dummyjson.com/quotes?limit=5', d=>d.quotes.map(q=>({en:q.quote,source:q.author})), 'DummyJSON', document.getElementById('h3'));
    }, 120000);
    // اولین برداشت
    harvestAPI('https://api.quotable.io/quotes/random?limit=5', d=>d, 'Quotable', document.getElementById('h1'));
  }

  function toggleLang(){
    currentLang=currentLang==='fa'?'en':'fa'; localStorage.setItem('qlang',currentLang);
    document.documentElement.lang=currentLang; document.documentElement.dir=currentLang==='fa'?'rtl':'ltr';
    updUI(); quoteList.innerHTML=''; displayedQuotes.forEach(q=>append(q,false)); updNums();
  }
  function toggleTheme(){
    document.body.classList.toggle('light-mode');
    localStorage.setItem('qtheme',document.body.classList.contains('light-mode')?'light':'dark');
  }
  document.getElementById('langToggle').addEventListener('click',toggleLang);
  document.getElementById('themeToggle').addEventListener('click',toggleTheme);
  if(localStorage.getItem('qtheme')==='light') document.body.classList.add('light-mode');

  init();
</script>
</body>
</html>
