<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش کفش سه‌بعدی | Samisaki</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e8e4df;
            font-family: 'Vazirmatn', sans-serif;
        }
        canvas {
            display: block;
        }
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="hint">🖱️ بچرخانید | اسکرول برای زوم | کفش اسپرت Samisaki</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== صحنه، دوربین، رندرر ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8e4df); // پس‌زمینهٔ کرم روشن (استودیویی)

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
        camera.position.set(2.5, 1.8, 3.5);
        camera.lookAt(0, 0.3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ==================== کنترل‌ها ====================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.35, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.minDistance = 1.8;
        controls.maxDistance = 6;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.update();

        // ==================== نورپردازی حرفه‌ای (Three-Point Lighting) ====================
        // نور محیطی برای روشنایی پایه
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        // Key Light (نور اصلی از جلو-چپ)
        const keyLight = new THREE.DirectionalLight(0xfff5f0, 8.0);
        keyLight.position.set(-3, 4, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 20;
        keyLight.shadow.camera.left = -3;
        keyLight.shadow.camera.right = 3;
        keyLight.shadow.camera.top = 3;
        keyLight.shadow.camera.bottom = -3;
        keyLight.shadow.bias = -0.0001;
        scene.add(keyLight);

        // Fill Light (نور پرکننده از راست، ملایم)
        const fillLight = new THREE.DirectionalLight(0xccddff, 3.5);
        fillLight.position.set(3, 1.5, 1.5);
        scene.add(fillLight);

        // Rim Light (نور لبه از پشت برای جدا شدن سوژه از پس‌زمینه)
        const rimLight = new THREE.DirectionalLight(0xffffff, 6.0);
        rimLight.position.set(0, 1.5, -3);
        scene.add(rimLight);

        // ==================== کف و پایه ====================
        // یک دیسک نرم برای پایه (سایه‌ها رو خوب نشون بده)
        const pedestalGeometry = new THREE.CylinderGeometry(0.7, 0.75, 0.05, 64);
        const pedestalMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 });
        const pedestal = new THREE.Mesh(pedestalGeometry, pedestalMaterial);
        pedestal.position.y = -0.05;
        pedestal.receiveShadow = true;
        pedestal.castShadow = true;
        scene.add(pedestal);

        // ==================== ساخت کفش ====================
        const shoeGroup = new THREE.Group();
        scene.add(shoeGroup);

        // --- بافت‌ها با Canvas ---
        // بافت پارچه‌ای (مشکی)
        const fabricCanvas = document.createElement('canvas');
        fabricCanvas.width = 256; fabricCanvas.height = 256;
        const fCtx = fabricCanvas.getContext('2d');
        fCtx.fillStyle = '#2a2a2a'; fCtx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 1000; i++) {
            fCtx.fillStyle = `rgba(${Math.random()>0.5?255:0},${Math.random()>0.5?255:0},${Math.random()>0.5?255:0},0.04)`;
            fCtx.fillRect(Math.random()*256, Math.random()*256, 1, 1);
        }
        const fabricTexture = new THREE.CanvasTexture(fabricCanvas);

        // بافت لاستیکی (سفید کدر)
        const rubberCanvas = document.createElement('canvas');
        rubberCanvas.width = 128; rubberCanvas.height = 128;
        const rCtx = rubberCanvas.getContext('2d');
        rCtx.fillStyle = '#eeeeee'; rCtx.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 300; i++) {
            rCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.05})`;
            rCtx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
        }
        const rubberTexture = new THREE.CanvasTexture(rubberCanvas);

        // متریال‌ها
        const fabricMat = new THREE.MeshStandardMaterial({ map: fabricTexture, roughness: 0.7, metalness: 0.0, color: 0x333333 });
        const rubberMat = new THREE.MeshStandardMaterial({ map: rubberTexture, roughness: 0.4, metalness: 0.05, color: 0xeeeeee });
        const soleMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5, metalness: 0.1 });
        const accentMat = new THREE.MeshStandardMaterial({ color: 0xff5533, roughness: 0.3, metalness: 0.2 }); // جزئیات نارنجی

        // --- زیره (Sole) ---
        const sole = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.08, 1.5), soleMat);
        sole.position.set(0, 0.02, 0.1);
        sole.castShadow = true; sole.receiveShadow = true;
        shoeGroup.add(sole);
        // زیرهٔ پاشنه
        const heelSole = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.35), soleMat);
        heelSole.position.set(0, 0.04, -0.45);
        heelSole.castShadow = true; heelSole.receiveShadow = true;
        shoeGroup.add(heelSole);

        // --- رویهٔ اصلی (بدنهٔ کفش) ---
        // قسمت جلویی (Toe Box)
        const toeBox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.65), fabricMat);
        toeBox.position.set(0, 0.25, 0.55);
        toeBox.castShadow = true; toeBox.receiveShadow = true;
        shoeGroup.add(toeBox);
        // قسمت میانی (Mid Section)
        const midSection = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.35, 0.5), fabricMat);
        midSection.position.set(0, 0.3, 0.1);
        midSection.castShadow = true; midSection.receiveShadow = true;
        shoeGroup.add(midSection);
        // پاشنه (Heel Counter)
        const heelCounter = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.35, 0.35), fabricMat);
        heelCounter.position.set(0, 0.3, -0.45);
        heelCounter.castShadow = true; heelCounter.receiveShadow = true;
        shoeGroup.add(heelCounter);

        // --- زبانه (Tongue) ---
        const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.15), fabricMat);
        tongue.position.set(0, 0.55, 0.2);
        tongue.rotation.x = -0.3;
        tongue.castShadow = true; tongue.receiveShadow = true;
        shoeGroup.add(tongue);

        // --- یقه (Collar) دور مچ پا ---
        const collar = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.06, 8, 16), fabricMat);
        collar.position.set(0, 0.55, -0.35);
        collar.rotation.x = Math.PI / 2;
        collar.castShadow = true; collar.receiveShadow = true;
        shoeGroup.add(collar);

        // --- بندها (Laces) ---
        for (let i = 0; i < 4; i++) {
            const lace = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.35, 6), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }));
            lace.position.set(0, 0.45 + i * 0.08, 0.25);
            lace.rotation.z = Math.PI / 2;
            lace.castShadow = true;
            shoeGroup.add(lace);
        }

        // --- جزئیات نارنجی (خط روی زیره) ---
        const accentStripe = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.03, 1.3), accentMat);
        accentStripe.position.set(0, 0.07, 0.1);
        accentStripe.castShadow = true;
        shoeGroup.add(accentStripe);

        // --- لوگوی Swoosh (منحنی ساده) ---
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-0.2, 0.15, 0.6),
            new THREE.Vector3(-0.05, 0.28, 0.3),
            new THREE.Vector3(0.15, 0.35, -0.1),
            new THREE.Vector3(0.1, 0.25, -0.5)
        ]);
        const tubeGeometry = new THREE.TubeGeometry(curve, 32, 0.025, 8, false);
        const swoosh = new THREE.Mesh(tubeGeometry, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.1 }));
        swoosh.castShadow = true;
        shoeGroup.add(swoosh);

        // --- زیرهٔ داخلی (Insole) — قابل مشاهده از بالا ---
        const insole = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.03, 0.9), new THREE.MeshStandardMaterial({ color: 0xffddcc, roughness: 0.8 }));
        insole.position.set(0, 0.42, 0.15);
        insole.castShadow = true; insole.receiveShadow = true;
        shoeGroup.add(insole);

        // تنظیم موقعیت کلی کفش (چرخش ۱۵ درجه برای زاویهٔ بهتر)
        shoeGroup.rotation.y = -0.2;

        // ==================== انیمیشن ====================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ==================== واکنش‌گرایی ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
