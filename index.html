<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه بزرگ | همه چیز در یک جا</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #f5f6fa;
      --text: #2f3640;
      --card-bg: #ffffff;
      --primary: #e84118;
      --secondary: #273c75;
      --shadow: 0 2px 15px rgba(0,0,0,0.05);
      --header-bg: rgba(255,255,255,0.95);
      --tag-bg: #dcdde1;
    }
    body.dark {
      --bg: #1e272e;
      --text: #d2dae2;
      --card-bg: #2f3640;
      --primary: #e84118;
      --secondary: #f5f6fa;
      --shadow: 0 2px 15px rgba(0,0,0,0.3);
      --header-bg: rgba(30, 39, 46, 0.95);
      --tag-bg: #485460;
    }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1.8em;
      font-weight: 900;
      color: var(--primary);
      cursor: pointer;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .search-box {
      display: flex;
      background: var(--card-bg);
      border-radius: 30px;
      padding: 3px 3px 3px 15px;
      box-shadow: var(--shadow);
    }
    .search-box input {
      border: none;
      background: transparent;
      padding: 10px;
      font-family: inherit;
      font-size: 0.95em;
      width: 180px;
      color: var(--text);
      outline: none;
    }
    .search-box button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    .cart-btn, .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--text);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9em;
      white-space: nowrap;
      transition: 0.2s;
    }
    .theme-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.3em;
    }
    main {
      flex: 1;
      padding: 30px 20px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }
    .category-filters {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .cat-btn {
      background: var(--tag-bg);
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
      transition: 0.2s;
      color: var(--text);
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: white;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #ddd;
    }
    .product-info {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-title {
      font-weight: 600;
      font-size: 1em;
      margin-bottom: 5px;
    }
    .product-cat {
      color: #888;
      font-size: 0.8em;
      margin-bottom: 8px;
    }
    .product-price {
      font-weight: bold;
      color: var(--primary);
      font-size: 1.2em;
      margin: auto 0 10px 0;
    }
    .add-to-cart {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: opacity 0.2s;
      width: 100%;
    }
    .add-to-cart:hover {
      opacity: 0.9;
    }
    .cart-badge {
      background: var(--primary);
      color: white;
      border-radius: 50%;
      padding: 2px 8px;
      font-size: 0.7em;
      margin-right: -8px;
      margin-top: -10px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: var(--card-bg);
      color: #888;
      font-size: 0.9em;
      margin-top: auto;
    }
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="resetFilters()">🛍️ فروشگاه بزرگ</div>
    <div class="nav-actions">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="جستجوی محصول..." />
        <button onclick="searchProducts()">🔍</button>
      </div>
      <button class="cart-btn" onclick="showCart()">🛒 سبد خرید <span id="cart-count" class="cart-badge">0</span></button>
      <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    </div>
  </header>

  <main>
    <div class="category-filters" id="category-filters">
      <button class="cat-btn active" data-category="all">همه</button>
      <button class="cat-btn" data-category="الکترونیک">الکترونیک</button>
      <button class="cat-btn" data-category="کتاب">کتاب</button>
      <button class="cat-btn" data-category="پوشاک">پوشاک</button>
      <button class="cat-btn" data-category="خانه">خانه و آشپزخانه</button>
      <button class="cat-btn" data-category="ورزشی">ورزشی</button>
    </div>
    <div id="product-grid" class="product-grid"></div>
  </main>

  <footer>
    فروشگاه ساختگی با ۱۰۰ محصول – طراحی شده برای نمایش قدرت یک سایت گسترده بدون محتوای دستی
  </footer>

  <script>
    // ====================== ساخت ۱۰۰ محصول fake ======================
    const categories = ["الکترونیک", "کتاب", "پوشاک", "خانه", "ورزشی"];
    const productNames = {
      الکترونیک: ["هدفون بی‌سیم مدل X", "ساعت هوشمند نسل ۵", "پاوربانک ۲۰۰۰۰ میلی‌آمپر", "کیبورد مکانیکال RGB", "مانیتور ۲۷ اینچ", "ماوس گیمینگ", "اسپیکر بلوتوثی", "شارژر سریع ۶۵ وات", "هارد اکسترنال ۱ ترابایت", "وب‌کم Full HD", "هدفون گیمینگ", "تبلت ۱۰ اینچی", "دوربین عکاسی", "چراغ مطالعه LED", "فلش مموری ۶۴ گیگ", "کابل USB-C", "پایه نگهدارنده لپتاپ", "اسپیکر هوشمند", "مانیتور گیمینگ", "پروژکتور کوچک"],
      کتاب: ["رمان جاودانگی", "مدیریت زمان", "هنر شفاف اندیشیدن", "صد سال تنهایی", "کیمیاگر", "ملت عشق", "انسان در جستجوی معنا", "بی‌حد و مرز", "قدرت عادت", "باشگاه پنج صبحی‌ها", "چهار میثاق", "اثر مرکب", "هنر ظریف بی‌خیالی", "شازده کوچولو", "جنگ و صلح", "دن‌کیشوت", "مغازه خودکشی", "ذهنیت برنده", "ثروت سریع", "قانون جذب"],
      پوشاک: ["کفش اسپرت مردانه", "تی‌شرت تابستانی", "شلوار جین لی", "مانتو بهاره", "کت چرم", "پیراهن رسمی", "کاپشن زمستانی", "کفش پاشنه‌بلند", "سویشرت کلاه‌دار", "شلوار کتان", "تی‌شرت طرح‌دار", "کفش کوهنوردی", "جوراب ست", "لباس زیر نخ", "دامن چیندار", "کراوات ابریشمی", "شال و روسری", "کلاه بافتنی", "دستکش چرمی", "کمربند مردانه"],
      خانه: ["سرویس قابلمه گرانیتی", "دستگاه قهوه‌ساز", "جارو برقی بی‌سیم", "پرده‌های مدرن", "ست ظروف پذیرایی", "چاقوی آشپزخانه", "کتری برقی", "ماهیتابه نچسب", "آبمیوه‌گیری", "ساعت دیواری", "قاب عکس چوبی", "گلدان سرامیکی", "جا لباسی ایستاده", "فرش ماشینی", "چراغ خواب", "آینه قدی", "سرویس لحاف", "دستمال کاغذی", "ظرف نگهداری مواد", "زودپز"],
      ورزشی: ["توپ فوتبال", "دمبل ۱۰ کیلویی", "زیرانداز یوگا", "طناب ورزشی", "دوچرخه کوهستان", "کفش فوتبال", "کوله‌پشتی کوهنوردی", "بطری آب ورزشی", "تردمیل خانگی", "توپ بسکتبال", "هندزفری ورزشی", "مچ‌بند هوشمند", "لباس شنا", "حلقه لاغری", "کش مقاومتی", "کلاه دوچرخه‌سواری", "عینک شنا", "کفش تنیس", "پد زانو", "جوراب ورزشی"]
    };

    function generateProduct(id, cat, index) {
      const names = productNames[cat];
      const name = names[index % names.length];
      const price = Math.floor(Math.random() * 900000) + 100000; // بین ۱۰۰ هزار تا ۱ میلیون تومان
      return {
        id,
        name,
        category: cat,
        price,
        image: `https://picsum.photos/400/300?random=${id}`, // تصاویر واقعی از Lorem Picsum
        desc: `${name} با کیفیت عالی و قیمت مناسب. مناسب برای استفاده روزمره و هدیه.`
      };
    }

    let allProducts = [];
    let idCounter = 0;
    categories.forEach(cat => {
      for (let i = 0; i < 20; i++) { // ۲۰ محصول از هر دسته = ۱۰۰ محصول
        allProducts.push(generateProduct(idCounter++, cat, i));
      }
    });

    // ====================== سبد خرید ======================
    let cart = JSON.parse(localStorage.getItem('fake_shop_cart') || '[]');

    function saveCart() {
      localStorage.setItem('fake_shop_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    function addToCart(productId) {
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: productId, qty: 1 });
      }
      saveCart();
      alert('✅ به سبد خرید اضافه شد');
    }

    function updateCartBadge() {
      const total = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = total;
    }

    function showCart() {
      if (cart.length === 0) {
        alert('🛒 سبد خرید شما خالی است.');
        return;
      }
      let msg = 'محصولات در سبد خرید:\n';
      cart.forEach(item => {
        const product = allProducts.find(p => p.id === item.id);
        if (product) {
          msg += `${product.name} (${item.qty} عدد) - ${(product.price * item.qty).toLocaleString()} تومان\n`;
        }
      });
      const totalPrice = cart.reduce((sum, item) => {
        const p = allProducts.find(prod => prod.id === item.id);
        return sum + (p ? p.price * item.qty : 0);
      }, 0);
      msg += `\n💰 جمع کل: ${totalPrice.toLocaleString()} تومان`;
      alert(msg);
    }

    // ====================== فیلتر و جستجو ======================
    let currentFilter = 'all';
    let currentSearch = '';

    function filterProducts() {
      let filtered = allProducts;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(p => p.category === currentFilter);
      }
      if (currentSearch.trim()) {
        const term = currentSearch.trim().toLowerCase();
        filtered = filtered.filter(p => p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term));
      }
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      if (products.length === 0) {
        grid.innerHTML = '<p style="text-align:center; padding:50px;">هیچ محصولی یافت نشد.</p>';
        return;
      }
      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=بدون+تصویر'">
          <div class="product-info">
            <div class="product-title">${product.name}</div>
            <div class="product-cat">${product.category}</div>
            <div class="product-price">${product.price.toLocaleString()} تومان</div>
            <button class="add-to-cart" onclick="addToCart(${product.id})">🛒 افزودن به سبد</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function searchProducts() {
      currentSearch = document.getElementById('search-input').value;
      filterProducts();
    }

    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchProducts();
    });

    // فیلترهای دسته‌بندی
    document.getElementById('category-filters').addEventListener('click', (e) => {
      if (e.target.classList.contains('cat-btn')) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.category;
        filterProducts();
      }
    });

    function resetFilters() {
      currentFilter = 'all';
      currentSearch = '';
      document.getElementById('search-input').value = '';
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.cat-btn[data-category="all"]').classList.add('active');
      filterProducts();
    }

    // ====================== حالت تاریک ======================
    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('theme', theme);
    }
    function toggleTheme() {
      const newTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(newTheme);
    }
    applyTheme(localStorage.getItem('theme') || 'light');

    // ====================== راه‌اندازی ======================
    updateCartBadge();
    filterProducts();
  </script>
</body>
</html>
