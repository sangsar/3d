<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گوسفند پشمالو | Samisaki</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0ebe3; font-family: 'Vazirmatn', sans-serif; }
        canvas { display: block; }
        .hint {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            color: #fff; padding: 8px 22px; border-radius: 25px;
            font-size: 0.85rem; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div class="hint">🐑 بچرخونید | اسکرول برای زوم | گوسفند آبی Samisaki</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- صحنه، دوربین، رندرر ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f0e8);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 20);
        camera.position.set(3, 2.2, 4.5);
        camera.lookAt(0, 0.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.9, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2.2;
        controls.maxDistance = 8;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.update();

        // --- نور ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xfff5e8, 5);
        sun.position.set(4, 6, 3);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 20;
        sun.shadow.camera.left = -5;
        sun.shadow.camera.right = 5;
        sun.shadow.camera.top = 5;
        sun.shadow.camera.bottom = -5;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0xc8d8ff, 2);
        fill.position.set(-2, 1, -2);
        scene.add(fill);

        // --- کف ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(8, 8),
            new THREE.MeshStandardMaterial({ color: 0xe8e0d5, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- گروه گوسفند ---
        const sheep = new THREE.Group();
        scene.add(sheep);

        // متریال پشم (آبی کمرنگ، خیلی زبر)
        const woolMat = new THREE.MeshStandardMaterial({
            color: 0xa8c8e8,
            roughness: 1.0,
            metalness: 0.0
        });

        // متریال صورت و پاها (صورتی-کرم)
        const skinMat = new THREE.MeshStandardMaterial({
            color: 0xe8c8b8,
            roughness: 0.6,
            metalness: 0.0
        });

        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.05 });
        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.05 });
        const noseMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.3 });

        // --- بدنه (کره بزرگ) ---
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), woolMat);
        body.position.y = 0.45;
        body.castShadow = true; body.receiveShadow = true;
        sheep.add(body);

        // --- توده‌های پشم اضافی (برای حس پفکی) ---
        function addWoolCluster(x, y, z, scale) {
            const cluster = new THREE.Mesh(new THREE.SphereGeometry(0.35 * scale, 16, 16), woolMat);
            cluster.position.set(x, y, z);
            cluster.castShadow = true; cluster.receiveShadow = true;
            sheep.add(cluster);
        }
        addWoolCluster(0.4, 0.55, 0.35, 0.7);
        addWoolCluster(-0.4, 0.55, 0.35, 0.7);
        addWoolCluster(0.35, 0.55, -0.35, 0.65);
        addWoolCluster(-0.35, 0.55, -0.35, 0.65);
        addWoolCluster(0, 0.7, 0.4, 0.6);
        addWoolCluster(0, 0.7, -0.4, 0.6);
        addWoolCluster(0.5, 0.4, 0, 0.5);
        addWoolCluster(-0.5, 0.4, 0, 0.5);
        addWoolCluster(0, 0.35, 0.55, 0.55);
        addWoolCluster(0, 0.35, -0.55, 0.55);

        // --- سر ---
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), skinMat);
        head.position.set(0, 0.95, 0.55);
        head.castShadow = true; head.receiveShadow = true;
        sheep.add(head);

        // --- پشم روی سر (چند تا توده کوچیک) ---
        function addHeadWool(x, y, z, s) {
            const w = new THREE.Mesh(new THREE.SphereGeometry(0.15 * s, 8, 8), woolMat);
            w.position.set(x, y, z);
            w.castShadow = true;
            sheep.add(w);
        }
        addHeadWool(0, 1.2, 0.55, 1.3);
        addHeadWool(0.2, 1.15, 0.55, 0.9);
        addHeadWool(-0.2, 1.15, 0.55, 0.9);
        addHeadWool(0.15, 1.05, 0.7, 0.7);
        addHeadWool(-0.15, 1.05, 0.7, 0.7);

        // --- گوش‌ها ---
        const earL = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), skinMat);
        earL.position.set(-0.35, 1.1, 0.6);
        earL.castShadow = true;
        sheep.add(earL);
        const earR = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), skinMat);
        earR.position.set(0.35, 1.1, 0.6);
        earR.castShadow = true;
        sheep.add(earR);

        // --- چشم‌ها (درشت و بامزه) ---
        const eyeWhiteL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05 }));
        eyeWhiteL.position.set(-0.15, 1.05, 0.9);
        sheep.add(eyeWhiteL);
        const eyeWhiteR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05 }));
        eyeWhiteR.position.set(0.15, 1.05, 0.9);
        sheep.add(eyeWhiteR);

        const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
        pupilL.position.set(-0.15, 1.05, 0.98);
        sheep.add(pupilL);
        const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
        pupilR.position.set(0.15, 1.05, 0.98);
        sheep.add(pupilR);

        // --- بینی ---
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), noseMat);
        nose.position.set(0, 0.92, 0.93);
        sheep.add(nose);

        // --- دهان (خط کوچیک) ---
        const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.015, 4, 8), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3 }));
        mouth.position.set(0, 0.86, 0.94);
        mouth.rotation.x = Math.PI / 2;
        mouth.rotation.z = Math.PI;
        sheep.add(mouth);

        // --- پاها (۴ تا استوانه کوتاه) ---
        function createLeg(x, z) {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.5, 8), skinMat);
            leg.position.set(x, -0.05, z);
            leg.castShadow = true; leg.receiveShadow = true;
            sheep.add(leg);
        }
        createLeg(0.3, 0.3);
        createLeg(-0.3, 0.3);
        createLeg(0.3, -0.3);
        createLeg(-0.3, -0.3);

        // --- دم (یه گلوله پشمی کوچیک) ---
        const tail = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), woolMat);
        tail.position.set(0, 0.5, -0.7);
        tail.castShadow = true;
        sheep.add(tail);

        // --- انیمیشن ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
