<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقل‌قول‌سرا | فقط واقعی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0f14; --surface: #151e24; --text: #cbd5e0;
      --primary: #f4a261; --secondary: #e76f51; --accent: #2a9d8f;
      --glass-bg: rgba(21, 30, 36, 0.75); --glass-border: rgba(255,255,255,0.07);
      --font: 'Vazirmatn', sans-serif;
      --danger: #e74c3c;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      transition: background 0.3s, color 0.3s; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    #particles {
      position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;
    }
    header {
      background: var(--glass-bg); backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--glass-border); padding: 0.8rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top:0; z-index:100;
    }
    .logo {
      font-size: 1.8rem; font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer;
    }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 2rem; color: var(--text);
      cursor: pointer; font-family: var(--font); font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.3rem; transition: 0.2s;
    }
    .icon-btn:hover { background: var(--primary); color:#000; }
    .hamburger {
      background: var(--surface); border: 1px solid var(--glass-border);
      padding: 0.5rem; border-radius: 0.5rem; cursor: pointer;
      display: flex; flex-direction: column; gap: 5px; width: 40px; height: 40px;
      justify-content: center; align-items: center;
    }
    .hamburger span { display:block; width:25px; height:3px; background:var(--text); transition:0.3s; }
    .sidebar {
      position: fixed; top:0; right:-100%; width:270px; height:100%;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border); z-index:120;
      transition: right 0.3s ease; padding:1rem; overflow-y:auto;
      display: flex; flex-direction: column; gap:1rem;
    }
    .sidebar.open { right:0; }
    .sidebar-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index:115; display:none;
    }
    .sidebar-overlay.open { display:block; }
    .close-sidebar { align-self: flex-end; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; }
    main {
      flex:1; padding:1rem 1.5rem; max-width:1200px; margin:0 auto; width:100%;
    }
    .category-filter {
      display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap;
    }
    .category-btn {
      background: var(--surface); border:1px solid var(--glass-border);
      padding:0.5rem 1.2rem; border-radius:2rem; color:var(--text);
      cursor:pointer; font-family:var(--font); font-size:0.85rem; transition:0.2s;
      white-space: nowrap;
    }
    .category-btn:hover, .category-btn.active { background:var(--accent); color:#000; }
    .status-bar {
      background: var(--surface); border-radius: 1rem; padding: 0.5rem 1rem;
      margin-bottom: 1.5rem; display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--secondary);
    }
    .quote-list {
      display: flex; flex-direction: column; gap: 0.8rem;
    }
    .quote-card {
      background: var(--glass-bg); backdrop-filter: blur(10px);
      border:1px solid var(--glass-border); border-radius:1.2rem; padding:1rem 1.2rem;
      display:flex; align-items: center; gap:1rem;
      transition: transform 0.2s, box-shadow 0.2s; animation: fadeInUp 0.4s ease;
    }
    .quote-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,0,0,0.3); }
    .quote-number {
      font-size: 1.5rem; font-weight: 900; color: var(--primary);
      min-width: 2.5rem; text-align: center;
    }
    .quote-content { flex:1; }
    .quote-text {
      font-size: 1.1rem; line-height: 1.8; font-style: italic; margin-bottom: 0.3rem;
    }
    .quote-source { font-size: 0.8rem; color: var(--accent); }
    .quote-actions { display: flex; gap: 0.5rem; align-items: center; }
    .sentiment-icon { font-size:1.2rem; }
    .delete-btn {
      background: var(--danger); border:none; padding:0.4rem 1.2rem;
      border-radius:2rem; color:white; font-family:var(--font); cursor:pointer;
      font-weight:bold; transition: background 0.2s;
    }
    .delete-btn:hover { background: #c0392b; }
    .log-area {
      background: var(--surface); border-radius:1rem; padding:0.8rem; margin-top:1.5rem;
      font-size:0.8rem; color:var(--secondary); max-height:100px; overflow-y:auto;
      border:1px solid var(--glass-border);
    }
    .log-area p { margin:0.2rem 0; border-right:2px solid var(--accent); padding-right:0.5rem; }
    footer { text-align:center; padding:1rem; color:#555; font-size:0.8rem; margin-top:auto; }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(15px); }
      to { opacity:1; transform:translateY(0); }
    }
    body.light-mode {
      --bg: #f5f0eb; --surface: #ffffff; --text: #2c3e50;
      --glass-bg: rgba(255,255,255,0.85); --glass-border: rgba(0,0,0,0.05);
    }
    @media (max-width: 600px) {
      .quote-card { flex-direction: column; align-items: flex-start; }
      .logo { font-size:1.4rem; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <header>
    <div class="logo" id="logoText">📖 نقل‌قول‌سرا</div>
    <div class="header-actions">
      <button class="icon-btn" id="langToggle">🌐 <span id="langLabel">FA</span></button>
      <button class="icon-btn" id="themeToggle">🌓</button>
      <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <button class="close-sidebar" id="closeSidebar">✕</button>
    <h3>🤖 ربات‌ها</h3>
    <div style="font-size:0.9rem;">
      <p>📥 دروگر: <span id="harvesterStatus">فعال</span></p>
      <p>🧹 پالایشگر: <span id="cleanerStatus">آماده</span></p>
      <p>🧠 تحلیل‌گر: <span id="sentimentStatus">فعال</span></p>
      <p>🔍 ارزیاب کیفیت: <span id="qualityStatus">فعال</span></p>
    </div>
    <hr style="border-color:var(--glass-border);">
    <p style="font-size:0.8rem;">📊 کل جملات مخزن: <span id="poolSize">0</span></p>
  </div>

  <main>
    <div class="category-filter" id="categoryFilter"></div>
    <div class="status-bar">
      <span id="quoteCounter">۰ جمله</span>
      <span id="commanderLog">در حال بارگذاری...</span>
    </div>
    <div class="quote-list" id="quoteList"></div>
    <div class="log-area" id="logArea">
      <p>🤖 ربات‌ها آمادهٔ سرویس‌دهی...</p>
    </div>
  </main>

  <footer>
    قدرت‌گرفته از Quotable API + هوش مصنوعی مرورگر | فقط جملات واقعی
  </footer>

  <script>
    // ==================== پیکربندی ====================
    const MAX_DISPLAY = 40;
    const CATEGORIES = [
      'همه', 'عشق', 'زمان', 'اخلاق', 'موفقیت', 'زندگی', 'مرگ', 'دوستی', 'امید', 'شجاعت', 'دانش',
      'قدرت', 'آرامش', 'هنر', 'طبیعت', 'سفر', 'کار', 'سلامتی', 'معنویت', 'خلاقیت', 'رهبری',
      'شادی', 'غم', 'صبر', 'آزادی', 'عدالت'
    ];

    // ==================== وضعیت ====================
    let currentLang = localStorage.getItem('qlang') || 'fa';
    let currentCategory = 'همه';
    let displayedQuotes = [];          // دقیقاً MAX_DISPLAY جمله که روی صفحه هستند
    let quotesPool = [];              // مخزن کل جملات دریافت‌شده از API
    let robotLogs = [];

    // ==================== المان‌های DOM ====================
    const quoteList = document.getElementById('quoteList');
    const categoryFilter = document.getElementById('categoryFilter');
    const quoteCounter = document.getElementById('quoteCounter');
    const commanderLog = document.getElementById('commanderLog');
    const logArea = document.getElementById('logArea');
    const poolSizeEl = document.getElementById('poolSize');

    // ==================== ذرات پس‌زمینه ====================
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.fillStyle = 'rgba(244, 162, 97, 0.5)';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
      }
    }
    for (let i=0; i<60; i++) particlesArray.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particlesArray.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ==================== ترجمه رابط ====================
    const ui = {
      fa: { 
        logo:'📖 نقل‌قول‌سرا', counter:(n)=>`${n} جمله`, deleteBtn:'حذف',
        harvester:'فعال', cleaner:'آماده', sentiment:'فعال', quality:'فعال',
        loading:'در حال دریافت جملات واقعی...', commanderLog:'ربات‌ها فعال هستند'
      },
      en: { 
        logo:'📖 QuoteVault', counter:(n)=>`${n} quotes`, deleteBtn:'Remove',
        harvester:'Active', cleaner:'Ready', sentiment:'Active', quality:'Active',
        loading:'Fetching real quotes...', commanderLog:'Robots are active'
      }
    };
    function t(key, ...args) {
      let str = (ui[currentLang] && ui[currentLang][key]) || key;
      if (typeof str === 'function') return str(...args);
      return str;
    }

    function updateUILanguage() {
      document.getElementById('logoText').textContent = t('logo');
      document.getElementById('langLabel').textContent = currentLang === 'fa' ? 'FA' : 'EN';
      quoteCounter.textContent = t('counter', displayedQuotes.length);
      commanderLog.textContent = t('commanderLog');
      document.getElementById('harvesterStatus').textContent = t('harvester');
      document.getElementById('cleanerStatus').textContent = t('cleaner');
      document.getElementById('sentimentStatus').textContent = t('sentiment');
      document.getElementById('qualityStatus').textContent = t('quality');
      renderCategoryFilter();
      renderQuotes();
    }

    // ==================== منو همبرگری ====================
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }
    document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);

    // ==================== دسته‌بندی‌ها ====================
    function renderCategoryFilter() {
      let html = '';
      CATEGORIES.forEach(cat => {
        html += `<button class="category-btn ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>`;
      });
      categoryFilter.innerHTML = html;
      categoryFilter.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.cat;
          renderCategoryFilter();
          refreshDisplay();
        });
      });
    }

    // ==================== مدیریت جملات ====================
    function getAvailableQuotes() {
      let filtered = currentCategory === 'همه' ? quotesPool : quotesPool.filter(q => q.cat === currentCategory);
      const displayedIds = new Set(displayedQuotes.map(q => q.id));
      return filtered.filter(q => !displayedIds.has(q.id));
    }

    function refreshDisplay() {
      const available = getAvailableQuotes();
      const needed = MAX_DISPLAY - displayedQuotes.length;
      if (needed > 0 && available.length > 0) {
        const shuffled = [...available].sort(() => Math.random() - 0.5);
        const toAdd = shuffled.slice(0, Math.min(needed, shuffled.length));
        displayedQuotes.push(...toAdd);
      }
      if (displayedQuotes.length > MAX_DISPLAY) {
        displayedQuotes.length = MAX_DISPLAY;
      }
      quoteCounter.textContent = t('counter', displayedQuotes.length);
      renderQuotes();
    }

    function deleteQuote(quoteId) {
      const index = displayedQuotes.findIndex(q => q.id === quoteId);
      if (index !== -1) {
        displayedQuotes.splice(index, 1);
        const available = getAvailableQuotes();
        if (available.length > 0) {
          const newQuote = available[Math.floor(Math.random() * available.length)];
          displayedQuotes.push(newQuote);
        }
        addLog(`🗑️ جمله حذف شد و جملهٔ جدید جایگزین شد.`);
        quoteCounter.textContent = t('counter', displayedQuotes.length);
        renderQuotes();
      }
    }

    function renderQuotes() {
      quoteList.innerHTML = '';
      displayedQuotes.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'quote-card';
        const text = currentLang === 'fa' ? q.fa : q.en;
        const sentEmoji = { pos:'😊', neu:'😐', neg:'😞' };
        card.innerHTML = `
          <div class="quote-number">${idx + 1}</div>
          <div class="quote-content">
            <div class="quote-text">“${text}”</div>
            <div class="quote-source">${q.source || 'Quotable'}</div>
          </div>
          <div class="quote-actions">
            <span class="sentiment-icon">${sentEmoji[q.sentiment] || '😐'}</span>
            <button class="delete-btn" data-id="${q.id}">${t('deleteBtn')}</button>
          </div>
        `;
        card.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteQuote(q.id);
        });
        quoteList.appendChild(card);
      });
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString('fa-IR');
      robotLogs.push(`[${time}] ${msg}`);
      if (robotLogs.length > 20) robotLogs.shift();
      logArea.innerHTML = robotLogs.map(m => `<p>${m}</p>`).join('');
      logArea.scrollTop = logArea.scrollHeight;
    }

    // ==================== تحلیل احساس ====================
    function simpleSentiment(text) {
      const positiveWords = ['خوب', 'عالی', 'زیبا', 'عشق', 'امید', 'شادی', 'موفقیت', 'love', 'hope', 'joy', 'success', 'great', 'wonderful', 'beautiful'];
      const negativeWords = ['بد', 'غم', 'ترس', 'شکست', 'مرگ', 'درد', 'sad', 'fear', 'failure', 'death', 'pain', 'hate', 'angry'];
      const lower = text.toLowerCase();
      let pos = 0, neg = 0;
      positiveWords.forEach(w => { if (lower.includes(w)) pos++; });
      negativeWords.forEach(w => { if (lower.includes(w)) neg++; });
      if (pos > neg) return 'pos';
      if (neg > pos) return 'neg';
      return 'neu';
    }

    // ==================== دسته‌بندی جمله ====================
    function categorizeQuote(text) {
      const lower = text.toLowerCase();
      for (let cat of CATEGORIES.slice(1)) { // همه به جز 'همه'
        if (lower.includes(cat)) return cat;
      }
      return 'زندگی'; // پیش‌فرض
    }

    // ==================== ربات ارزیاب کیفیت ====================
    function isQualityQuote(text) {
      return text && text.length >= 20 && !/^[0-9\s]+$/.test(text) && !/[<>{}]/.test(text);
    }

    // ==================== ربات دروگر: دریافت از API ====================
    async function fetchQuotes(count = 5) {
      try {
        const res = await fetch(`https://api.quotable.io/quotes/random?limit=${count}`);
        const data = await res.json();
        if (data && data.length) {
          let added = 0;
          data.forEach(item => {
            const textEn = item.content;
            const textFa = textEn; // Quotable فقط انگلیسی دارد، می‌توان بعداً ترجمه اضافه کرد
            if (!quotesPool.some(q => q.en === textEn) && isQualityQuote(textEn)) {
              const cat = categorizeQuote(textEn);
              const sent = simpleSentiment(textEn);
              quotesPool.push({
                id: Date.now() + Math.random(),
                cat: cat,
                fa: textFa,
                en: textEn,
                sentiment: sent,
                source: item.author || 'Quotable'
              });
              added++;
            }
          });
          if (added > 0) {
            addLog(`📥 دروگر: ${added} جملهٔ جدید به مخزن اضافه کرد.`);
            poolSizeEl.textContent = quotesPool.length;
            refreshDisplay();
          }
        }
      } catch (e) {
        addLog('⚠️ دروگر: خطا در دریافت جملات.');
      }
    }

    // ==================== ربات پالایشگر ====================
    function cleanDuplicates() {
      const seen = new Set();
      const unique = [];
      quotesPool.forEach(q => {
        const key = q.en.toLowerCase().trim();
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(q);
        }
      });
      const removed = quotesPool.length - unique.length;
      if (removed > 0) {
        quotesPool = unique;
        addLog(`🧹 پالایشگر: ${removed} جملهٔ تکراری حذف شد.`);
        poolSizeEl.textContent = quotesPool.length;
        // حذف از displayedQuotes اگر تکراری بوده
        const displayedIds = new Set(displayedQuotes.map(q => q.id));
        displayedQuotes = displayedQuotes.filter(q => quotesPool.some(p => p.id === q.id));
        refreshDisplay();
      }
    }

    // ==================== زمان‌بندی ربات‌ها ====================
    setInterval(() => fetchQuotes(5), 10 * 60 * 1000); // هر ۱۰ دقیقه
    setInterval(cleanDuplicates, 30 * 1000); // هر ۳۰ ثانیه

    // ==================== بارگذاری اولیه ====================
    async function initialFetch() {
      commanderLog.textContent = t('loading');
      await fetchQuotes(40); // ۴۰ جمله اولیه
      commanderLog.textContent = t('commanderLog');
      quoteCounter.textContent = t('counter', displayedQuotes.length);
    }

    // ==================== تغییر زبان و تم ====================
    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      localStorage.setItem('qlang', currentLang);
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      updateUILanguage();
    }
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('qtheme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    document.getElementById('langToggle').addEventListener('click', toggleLanguage);
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    if (localStorage.getItem('qtheme') === 'light') document.body.classList.add('light-mode');

    // ==================== راه‌اندازی ====================
    function init() {
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      renderCategoryFilter();
      updateUILanguage();
      initialFetch();
      addLog('🤖 همهٔ ربات‌ها فعال شدند.');
    }
    init();
  </script>
</body>
</html>
