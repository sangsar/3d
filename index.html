<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استودیوی پادکست Samisaki</title>
    <style>
        body { background: #1a1a2e; color: #e0d6ff; font-family: 'Vazirmatn', sans-serif; padding: 30px; max-width: 700px; margin: 0 auto; }
        h1 { color: #ff99c8; text-align: center; }
        textarea { width: 100%; height: 200px; background: #0a0a0c; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 15px; font-family: inherit; font-size: 1rem; margin: 20px 0; }
        button { background: #7209b7; color: #fff; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1rem; cursor: pointer; margin: 5px; }
        button:hover { background: #ff99c8; color: #0a0a0c; }
        .status { margin-top: 15px; color: #aaa; }
    </style>
</head>
<body>
    <h1>🎙️ استودیوی پادکست</h1>
    <p>متن سناریو رو paste کن و گوش بده—صدای طبیعی فارسی</p>
    <textarea id="textInput" placeholder="سناریوی پادکست رو اینجا بنویس..."></textarea>
    <div>
        <button onclick="speak()">▶️ پخش کن</button>
        <button onclick="pause()">⏸️ توقف</button>
        <button onclick="resume()">🔄 ادامه</button>
    </div>
    <div class="status" id="status">آماده</div>

    <script>
        const synth = window.speechSynthesis;
        let utterance = null;

        function speak() {
            synth.cancel();
            const text = document.getElementById('textInput').value;
            utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fa-IR';
            utterance.rate = 0.9;  // کمی آهسته‌تر—طبیعی‌تر
            utterance.pitch = 1.0;
            utterance.onstart = () => document.getElementById('status').textContent = '🔊 در حال پخش...';
            utterance.onend = () => document.getElementById('status').textContent = '✅ پخش تموم شد';
            synth.speak(utterance);
        }

        function pause() { synth.pause(); document.getElementById('status').textContent = '⏸️ متوقف شد'; }
        function resume() { synth.resume(); document.getElementById('status').textContent = '🔊 ادامه...'; }
    </script>
</body>
</html>
